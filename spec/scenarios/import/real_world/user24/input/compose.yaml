    restart: unless-stopped
    logging:
      options:
        max-size: 10m
        max-file: '3'
    labels:
      - com.centurylinklabs.watchtower.scope=solectrus

#  Shelly - Collector - Neu Dezember 2024 
#  WASH = Waschmaschine
#  DRYER = Trockner
#  GAS = Gasheizung
#  DISH = Geschirrspueler
#  COOLER = Kuehlschrank
#  CIRCLE = Zirkulationspumpe (outdated)
#  WZTECHNIK = Wohnzimmer Technik (Fernseher und so)
#  PCTECHNIK = Arbeitszimmer Technik (PC und Buero)
#  FREEZER = Gefrierschrank (Keller)
#  WINE = Weinkühlschrank (Keller)

  shelly-collector-dish:
    image: ghcr.io/solectrus/shelly-collector:latest
    environment:
      - TZ
      - SHELLY_HOST=${SHELLY_HOST_DISH}
      - INFLUX_MEASUREMENT=${INFLUX_MEASUREMENT_SHELLY_DISH}
      - SHELLY_GEN=${SHELLY_GEN_DISH}
      - SHELLY_INTERVAL
      - INFLUX_HOST
      - INFLUX_SCHEMA
      - INFLUX_PORT
      - INFLUX_TOKEN=${INFLUX_TOKEN_WRITE}
      - INFLUX_ORG
      - INFLUX_BUCKET
      - INFLUX_MODE
    logging:
      options:
        max-size: 10m
        max-file: '3'
    restart: unless-stopped
    depends_on:
      influxdb:
        condition: service_healthy
    links:
      - influxdb
    labels:
      - com.centurylinklabs.watchtower.scope=solectrus

