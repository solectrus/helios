services:
  app:
    hostname: app.${APP_HOST}
    image: ${DOCKER_IMAGE}
    environment:
      - TZ
      - APP_HOST
      - FORCE_SSL
      - ASSET_HOST
      - TRUSTED_PROXY_RANGES
      - DB_HOST=db
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_USER=postgres
      - SECRET_KEY_BASE
      - INFLUX_HOST=influxdb
      - INFLUX_TOKEN=${INFLUX_TOKEN_READ}
      - INFLUX_ORG
      - INFLUX_BUCKET
      - LOCKUP_CODEWORD
      - REDIS_URL
      - HONEYBADGER_API_KEY
      - RORVSWILD_API_KEY
      - PLAUSIBLE_URL
      - INSTALLATION_DATE
      - ELECTRICITY_PRICE
      - FEED_IN_TARIFF
      - ADMIN_PASSWORD
      - RUBY_YJIT_ENABLE=1
      - FRAME_ANCESTORS
      - INFLUX_SENSOR_INVERTER_POWER
      - INFLUX_SENSOR_INVERTER_POWER_1
      - INFLUX_SENSOR_INVERTER_POWER_2
      - INFLUX_SENSOR_INVERTER_POWER_3
      - INFLUX_SENSOR_INVERTER_POWER_4
      - INFLUX_SENSOR_INVERTER_POWER_5
      - INFLUX_SENSOR_HOUSE_POWER
      - INFLUX_SENSOR_GRID_IMPORT_POWER
      - INFLUX_SENSOR_GRID_EXPORT_POWER
      - INFLUX_SENSOR_BATTERY_CHARGING_POWER
      - INFLUX_SENSOR_BATTERY_DISCHARGING_POWER
      - INFLUX_SENSOR_BATTERY_SOC
      - INFLUX_SENSOR_CAR_BATTERY_SOC
      - INFLUX_SENSOR_WALLBOX_POWER
      - INFLUX_SENSOR_WALLBOX_CAR_CONNECTED
      - INFLUX_SENSOR_CASE_TEMP
      - INFLUX_SENSOR_INVERTER_POWER_FORECAST
      - INFLUX_SENSOR_INVERTER_POWER_FORECAST_CLEARSKY
      - INFLUX_SENSOR_SYSTEM_STATUS
      - INFLUX_SENSOR_SYSTEM_STATUS_OK
      - INFLUX_SENSOR_GRID_EXPORT_LIMIT
      - INFLUX_SENSOR_HEATPUMP_POWER
      - INFLUX_EXCLUDE_FROM_HOUSE_POWER
      - INFLUX_SENSOR_HEATPUMP_HEATING_POWER
      - INFLUX_SENSOR_HEATPUMP_LEAVING_TEMP
      - INFLUX_SENSOR_HEATPUMP_STATUS
      - INFLUX_SENSOR_HEATPUMP_SCORE
      - INFLUX_SENSOR_HEATPUMP_TANK_TEMP
      - INFLUX_SENSOR_HEATPUMP_TANK_TEMP_SETPOINT
      - INFLUX_SENSOR_OUTDOOR_TEMP
      - INFLUX_SENSOR_OUTDOOR_TEMP_FORECAST
      - INFLUX_SENSOR_CAR_MILEAGE
      - INFLUX_SENSOR_CUSTOM_POWER_01
      - INFLUX_SENSOR_CUSTOM_POWER_02
      - INFLUX_SENSOR_CUSTOM_POWER_03
      - INFLUX_SENSOR_CUSTOM_POWER_04
      - INFLUX_SENSOR_CUSTOM_POWER_05
      - INFLUX_SENSOR_CUSTOM_POWER_06
      - INFLUX_SENSOR_CUSTOM_POWER_07
      - INFLUX_SENSOR_CUSTOM_POWER_08
      - INFLUX_SENSOR_CUSTOM_POWER_09
      - INFLUX_SENSOR_CUSTOM_POWER_10
      - INFLUX_SENSOR_CUSTOM_POWER_11
      - INFLUX_SENSOR_CUSTOM_POWER_12
      - INFLUX_SENSOR_CUSTOM_POWER_13
      - INFLUX_SENSOR_CUSTOM_POWER_14
      - INFLUX_SENSOR_CUSTOM_POWER_15
      - INFLUX_SENSOR_CUSTOM_POWER_16
      - INFLUX_SENSOR_CUSTOM_POWER_17
      - INFLUX_SENSOR_CUSTOM_POWER_18
      - INFLUX_SENSOR_CUSTOM_POWER_19
      - INFLUX_SENSOR_CUSTOM_POWER_20
      - SKIP_BROWSER_CHECK
    deploy:
      update_config:
        order: start-first
        failure_action: rollback
        delay: 10s
      rollback_config:
        parallelism: 0
        order: stop-first
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 3
        window: 120s
      placement:
        constraints: [node.labels.type==stateless]
      replicas: 1
      labels:
        - traefik.enable=true
        - traefik.http.routers.solectrus-websecure.rule=Host(`${APP_HOST}`)
        - traefik.http.routers.solectrus-websecure.tls=true
        - traefik.http.routers.solectrus-websecure.tls.certResolver=le-dns-cloudflare
        - traefik.http.routers.solectrus-websecure.entryPoints=websecure
        - traefik.http.routers.solectrus-websecure.middlewares=cloudflare-only@file,secHeaders@file
        - traefik.http.services.solectrus-websecure.loadBalancer.server.port=3000
        - traefik.http.routers.solectrus-unsecure.rule=Host(`${APP_HOST}`)
        - traefik.http.routers.solectrus-unsecure.entryPoints=web
        - traefik.http.routers.solectrus-unsecure.middlewares=httpsRedirect@file
    healthcheck:
      test:
        - CMD-SHELL
        - nc -z 127.0.0.1 3000 || exit 1
    networks:
      - traefik-public
      - default
    links:
      - db
      - redis
      - influxdb
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 20000
        hard: 40000

  influxdb:
    hostname: influxdb.${APP_HOST}
    restart: unless-stopped
    deploy:
      update_config:
        order: stop-first
      placement:
        constraints: [node.labels.type==stateful-arm64]
      replicas: 1
      labels:
        - traefik.enable=true
        - traefik.http.routers.solectrus-influxdb-websecure.rule=Host(`influxdb.${APP_HOST}`)
        - traefik.http.routers.solectrus-influxdb-websecure.tls=true
        - traefik.http.routers.solectrus-influxdb-websecure.tls.certResolver=le-dns-cloudflare
        - traefik.http.routers.solectrus-influxdb-websecure.entryPoints=websecure
        - traefik.http.services.solectrus-influxdb-websecure.loadBalancer.server.port=8086
        - traefik.http.routers.solectrus-influxdb-unsecure.rule=Host(`influxdb.${APP_HOST}`)
        - traefik.http.routers.solectrus-influxdb-unsecure.entryPoints=web
        - traefik.http.routers.solectrus-influxdb-unsecure.middlewares=httpsRedirect@file
    image: influxdb:2.8-alpine
    command: influxd run --bolt-path /var/lib/influxdb2/influxd.bolt --engine-path /var/lib/influxdb2/engine --store disk
    environment:
      - TZ
    healthcheck:
      test: ['CMD', 'influx', 'ping']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    volumes:
      - ${INFLUXDB_VOLUME_PATH}:/var/lib/influxdb2
      - ${INFLUXDB_BACKUP_VOLUME_PATH}:/influxdb-backup
    networks:
      - traefik-public
      - default

  ingest:
    hostname: ingest.${APP_HOST}
    networks:
      - default
      - traefik-public
    links:
      - influxdb
    image: ghcr.io/solectrus/ingest:develop
    environment:
      - TZ
      - INFLUX_SENSOR_INVERTER_POWER
      - INFLUX_SENSOR_GRID_IMPORT_POWER
      - INFLUX_SENSOR_GRID_EXPORT_POWER
      - INFLUX_SENSOR_BATTERY_DISCHARGING_POWER
      - INFLUX_SENSOR_BATTERY_CHARGING_POWER
      - INFLUX_SENSOR_WALLBOX_POWER
      - INFLUX_SENSOR_HEATPUMP_POWER
      - INFLUX_SENSOR_HOUSE_POWER
      - INFLUX_EXCLUDE_FROM_HOUSE_POWER
      - INFLUX_SENSOR_HOUSE_POWER_CALCULATED=Calculated:house_power
      - INFLUX_HOST=influxdb
      - INFLUX_SCHEMA
      - INFLUX_PORT
      - STATS_USERNAME=admin
      - STATS_PASSWORD=${ADMIN_PASSWORD}
      - RETENTION_HOURS=36
    deploy:
      update_config:
        order: stop-first
      placement:
        constraints: [node.labels.type==stateful-arm64]
      replicas: 1
      labels:
        - traefik.enable=true
        - traefik.http.routers.solectrus-ingest-websecure.rule=Host(`ingest.${APP_HOST}`)
        - traefik.http.routers.solectrus-ingest-websecure.tls=true
        - traefik.http.routers.solectrus-ingest-websecure.tls.certResolver=le-dns-cloudflare
        - traefik.http.routers.solectrus-ingest-websecure.entryPoints=websecure
        - traefik.http.services.solectrus-ingest-websecure.loadBalancer.server.port=4567
        - traefik.http.routers.solectrus-ingest-unsecure.rule=Host(`ingest.${APP_HOST}`)
        - traefik.http.routers.solectrus-ingest-unsecure.entryPoints=web
        - traefik.http.routers.solectrus-ingest-unsecure.middlewares=httpsRedirect@file
    volumes:
      - ${INGEST_VOLUME_PATH}:/app/data

  db:
    hostname: db.${APP_HOST}
    environment:
      - POSTGRES_PASSWORD
    image: postgres:18-alpine
    restart: unless-stopped
    deploy:
      update_config:
        order: stop-first
      placement:
        constraints: [node.labels.type==stateful-arm64]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
    volumes:
      - ${DB_VOLUME_PATH}:/var/lib/postgresql

  redis:
    hostname: redis.${APP_HOST}
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "no", "--maxmemory", "500mb", "--maxmemory-policy", "allkeys-lru"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
    deploy:
      update_config:
        order: stop-first
      placement:
        constraints: [node.labels.type==stateful-arm64]
    volumes:
      - ${REDIS_VOLUME_PATH}:/data

  power-splitter:
    hostname: power-splitter.${APP_HOST}
    links:
      - influxdb
      - redis
    image: ghcr.io/solectrus/power-splitter:develop
    environment:
      - TZ
      - INSTALLATION_DATE
      - INFLUX_HOST=influxdb
      - INFLUX_SCHEMA=http
      - INFLUX_TOKEN=${INFLUX_TOKEN_READWRITE}
      - INFLUX_PORT
      - INFLUX_ORG
      - INFLUX_BUCKET
      - POWER_SPLITTER_INTERVAL
      - INFLUX_SENSOR_HOUSE_POWER
      - INFLUX_SENSOR_GRID_IMPORT_POWER
      - INFLUX_SENSOR_WALLBOX_POWER
      - INFLUX_SENSOR_HEATPUMP_POWER
      - INFLUX_SENSOR_BATTERY_CHARGING_POWER
      - INFLUX_SENSOR_CUSTOM_POWER_01
      - INFLUX_SENSOR_CUSTOM_POWER_02
      - INFLUX_SENSOR_CUSTOM_POWER_03
      - INFLUX_SENSOR_CUSTOM_POWER_04
      - INFLUX_SENSOR_CUSTOM_POWER_05
      - INFLUX_SENSOR_CUSTOM_POWER_06
      - INFLUX_SENSOR_CUSTOM_POWER_07
      - INFLUX_SENSOR_CUSTOM_POWER_08
      - INFLUX_SENSOR_CUSTOM_POWER_09
      - INFLUX_SENSOR_CUSTOM_POWER_10
      - INFLUX_EXCLUDE_FROM_HOUSE_POWER
      - REDIS_URL
    deploy:
      update_config:
        order: stop-first
      placement:
        constraints: [node.labels.type==stateless]

  forecast-collector-pvnode:
    hostname: forecast-collector.${APP_HOST}
    links:
      - influxdb
    image: ghcr.io/solectrus/forecast-collector:develop
    environment:
      - TZ
      - FORECAST_LATITUDE
      - FORECAST_LONGITUDE
      - FORECAST_DECLINATION
      - FORECAST_AZIMUTH=209
      - FORECAST_KWP
      - FORECAST_INTERVAL
      - FORECAST_PROVIDER=pvnode
      - PVNODE_APIKEY
      - PVNODE_PAID=nowcast
      - PVNODE_EXTRA_PARAMS
      - INFLUX_HOST=influxdb
      - INFLUX_TOKEN=${INFLUX_TOKEN_WRITE}
      - INFLUX_ORG
      - INFLUX_BUCKET
      - INFLUX_MEASUREMENT=Forecast
    restart: unless-stopped
    deploy:
      update_config:
        order: stop-first
      placement:
        constraints: [node.labels.type==stateless]

  forecast-collector-solcast:
    hostname: forecast-collector.${APP_HOST}
    links:
      - influxdb
    image: ghcr.io/solectrus/forecast-collector:develop
    environment:
      - TZ
      - FORECAST_LATITUDE
      - FORECAST_LONGITUDE
      - FORECAST_DECLINATION
      - FORECAST_AZIMUTH
      - FORECAST_KWP
      - FORECAST_INTERVAL
      - FORECAST_PROVIDER=solcast
      - SOLCAST_APIKEY
      - SOLCAST_SITE
      - INFLUX_HOST=influxdb
      - INFLUX_TOKEN=${INFLUX_TOKEN_WRITE}
      - INFLUX_ORG
      - INFLUX_BUCKET
      - INFLUX_MEASUREMENT=Forecast-Solcast
    restart: unless-stopped
    deploy:
      update_config:
        order: stop-first
      placement:
        constraints: [node.labels.type==stateless]

  forecast-collector-forecast-solar:
    hostname: forecast-collector.${APP_HOST}
    links:
      - influxdb
    image: ghcr.io/solectrus/forecast-collector:develop
    environment:
      - TZ
      - FORECAST_LATITUDE
      - FORECAST_LONGITUDE
      - FORECAST_DECLINATION
      - FORECAST_AZIMUTH
      - FORECAST_KWP
      - FORECAST_DAMPING_MORNING
      - FORECAST_DAMPING_EVENING
      - FORECAST_INTERVAL
      - FORECAST_PROVIDER=forecast.solar
      - INFLUX_HOST=influxdb
      - INFLUX_TOKEN=${INFLUX_TOKEN_WRITE}
      - INFLUX_ORG
      - INFLUX_BUCKET
      - INFLUX_MEASUREMENT=Forecast-Solar
    restart: unless-stopped
    deploy:
      update_config:
        order: stop-first
      placement:
        constraints: [node.labels.type==stateless]

  postgresbackup:
    hostname: postgresbackup.${APP_HOST}
    environment:
      - POSTGRES_DATABASE=solectrus_production
      - POSTGRES_HOST=db
      - POSTGRES_PASSWORD
      - POSTGRES_USER=postgres
      - S3_ACCESS_KEY_ID=${AWS_ACCESS_KEY}
      - S3_SECRET_ACCESS_KEY=${AWS_SECRET_KEY}
      - S3_REGION=eu-central-1
      - S3_BUCKET=solectrus
      - S3_PREFIX=postgres_backup
      - SCHEDULE=@daily
    image: ghcr.io/solectrus/postgres-s3-backup:18
    links:
      - db
    restart: unless-stopped
    deploy:
      placement:
        constraints: [node.labels.type==stateless]

  fluxbackup:
    image: ghcr.io/solectrus/influxdb2-s3-backup:latest
    environment:
      INFLUXDB_HOST: influxdb
      INFLUXDB_ORG: ${INFLUX_ORG}
      INFLUXDB_TOKEN: "my-influxdb-admin-token"
      INFLUXDB_BACKUP_PORT: 8086
      BACKUP_PATH: "/data/influxdb/backup"
      S3_BUCKET: 'solectrus'
      S3_PREFIX: 'influxdb_backup'
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_KEY}
      CRON: '0 2 * * *'
    restart: unless-stopped
    deploy:
      update_config:
        order: stop-first
      placement:
        constraints: [node.labels.type==stateful-arm64]

networks:
  traefik-public:
    external: true
