services:
  dashboard:
    image: ghcr.io/solectrus/solectrus:latest
    ports:
      - 3000:3000
    environment:
      - TZ
      - INSTALLATION_DATE
      - SECRET_KEY_BASE
      - ADMIN_PASSWORD
      - DB_HOST=postgresql
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_USER=postgres
      - REDIS_URL=redis://redis:6379
      - INFLUX_HOST=influxdb
      - INFLUX_TOKEN=${INFLUX_TOKEN}
      - INFLUX_ORG
      - INFLUX_BUCKET
      - INFLUX_SENSOR_INVERTER_POWER=SENEC:inverter_power
      - INFLUX_SENSOR_HOUSE_POWER=SENEC:house_power
      - INFLUX_SENSOR_GRID_IMPORT_POWER=SENEC:grid_power_plus
      - INFLUX_SENSOR_GRID_EXPORT_POWER=SENEC:grid_power_minus
      - INFLUX_SENSOR_BATTERY_CHARGING_POWER=SENEC:bat_power_plus
      - INFLUX_SENSOR_BATTERY_DISCHARGING_POWER=SENEC:bat_power_minus
      - INFLUX_SENSOR_BATTERY_SOC=SENEC:bat_fuel_charge
      - INFLUX_SENSOR_INVERTER_POWER_FORECAST=Forecast:watts
    depends_on:
      postgresql:
        condition: service_healthy
      influxdb:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
  influxdb:
    image: influxdb:2-alpine
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUX_PASSWORD}
      - DOCKER_INFLUXDB_INIT_ORG=${INFLUX_ORG}
      - DOCKER_INFLUXDB_INIT_BUCKET=${INFLUX_BUCKET}
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUX_TOKEN}
    volumes:
      - ./influxdb:/var/lib/influxdb2
    restart: unless-stopped
  postgresql:
    image: postgres:18-alpine
    environment:
      - POSTGRES_PASSWORD
    volumes:
      - ./postgresql:/var/lib/postgresql
    restart: unless-stopped
  redis:
    image: redis:8-alpine
    volumes:
      - ./redis:/data
    restart: unless-stopped
  watchtower:
    image: nickfedor/watchtower
    environment:
      - TZ
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --scope solectrus --cleanup
    restart: unless-stopped
  senec-collector:
    image: ghcr.io/solectrus/senec-collector:latest
    environment:
      - TZ
      - SENEC_ADAPTER
      - SENEC_HOST
      - SENEC_SCHEMA
      - SENEC_INTERVAL
      - SENEC_LANGUAGE
      - INFLUX_HOST=influxdb
      - INFLUX_TOKEN=${INFLUX_TOKEN}
      - INFLUX_ORG
      - INFLUX_BUCKET
      - INFLUX_MEASUREMENT=${INFLUX_MEASUREMENT_SENEC}
    depends_on:
      influxdb:
        condition: service_healthy
    restart: unless-stopped
  forecast-collector:
    image: ghcr.io/solectrus/forecast-collector:latest
    environment:
      - TZ
      - FORECAST_PROVIDER
      - FORECAST_LATITUDE
      - FORECAST_LONGITUDE
      - FORECAST_DECLINATION
      - FORECAST_AZIMUTH
      - FORECAST_KWP
      - INFLUX_HOST=influxdb
      - INFLUX_TOKEN=${INFLUX_TOKEN}
      - INFLUX_ORG
      - INFLUX_BUCKET
      - INFLUX_MEASUREMENT=${INFLUX_MEASUREMENT_FORECAST}
    depends_on:
      influxdb:
        condition: service_healthy
    restart: unless-stopped
  tibber-collector:
    image: ghcr.io/solectrus/tibber-collector:latest
    environment:
      - TZ
      - TIBBER_TOKEN
      - INFLUX_HOST=influxdb
      - INFLUX_TOKEN=${INFLUX_TOKEN}
      - INFLUX_ORG
      - INFLUX_BUCKET
      - INFLUX_MEASUREMENT=${INFLUX_MEASUREMENT_PRICES}
    depends_on:
      influxdb:
        condition: service_healthy
    restart: unless-stopped
  senec-charger:
    image: ghcr.io/solectrus/senec-charger:latest
    environment:
      - TZ
      - SENEC_HOST
      - SENEC_SCHEMA
      - CHARGER_INTERVAL
      - CHARGER_PRICE_MAX
      - CHARGER_PRICE_TIME_RANGE
      - CHARGER_FORECAST_THRESHOLD
      - CHARGER_DRY_RUN
      - INFLUX_HOST=influxdb
      - INFLUX_TOKEN=${INFLUX_TOKEN}
      - INFLUX_ORG
      - INFLUX_BUCKET
      - INFLUX_MEASUREMENT_PRICES=Tibber
      - INFLUX_MEASUREMENT_FORECAST=${INFLUX_MEASUREMENT_FORECAST}
    depends_on:
      influxdb:
        condition: service_healthy
    restart: unless-stopped
