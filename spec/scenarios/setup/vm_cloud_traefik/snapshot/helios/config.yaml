---
_schema_version: 9
system:
  admin_password: dummy-admin-password
  app_host: solectrus.example.com
  currency: EUR
  installation_date: '2025-04-01'
  secret_key_base: dummy-secret-key-base-for-setup-scenarios
  timezone: Europe/Berlin
dashboard:
  image: ghcr.io/solectrus/solectrus:latest
postgresql:
  image: postgres:18-alpine
  password: minted-postgresql-password
influxdb:
  bucket: solectrus
  image: influxdb:2.9-alpine
  org: solectrus
  password: minted-influxdb-password
  token_admin: minted-influxdb-token-admin
  token_read: minted-influxdb-token-admin
  token_readwrite: minted-influxdb-token-admin
  token_write: minted-influxdb-token-admin
redis:
  image: redis:8-alpine
watchtower:
  image: nickfedor/watchtower:latest
senec:
  adapter: cloud
  interval: 60
  measurement: SENEC
  password: dummy-senec-cloud-password
  request_mode: minimal
  username: dummy@example.com
  version: v4
reverse_proxy:
  letsencrypt_email: dummy@example.com
  mode: internal
backup:
  aws_access_key_id: DUMMYACCESSKEYID
  aws_bucket: dummy-backup-bucket
  aws_region: eu-central-1
  aws_secret_access_key: dummy-secret-access-key
  destination: s3
  s3_endpoint_url: https://s3.example.com
  s3_prefix: solectrus/
backup_schedule:
  schedule_enabled: true
  schedule_time: '03:00'
sensors:
  battery_charging_power:
    source: senec
  battery_discharging_power:
    source: senec
  battery_soc:
    source: senec
  case_temp:
    source: senec
  grid_export_limit:
    source: senec
  grid_export_power:
    source: senec
  grid_import_power:
    source: senec
  house_power:
    source: senec
  inverter_power:
    source: senec
  inverter_power_1:
    source: senec
  inverter_power_2:
    source: senec
  inverter_power_3:
    source: senec
  system_status:
    source: senec
  system_status_ok:
    source: senec
  wallbox_car_connected:
    source: senec
  wallbox_power:
    source: senec
helios:
  image: ghcr.io/solectrus/helios:latest
