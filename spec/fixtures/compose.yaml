# Generated by Helios — DO NOT EDIT MANUALLY!
#
# This file defines your SOLECTRUS Docker stack.
# It is regenerated whenever you apply changes in Helios.
# Use the Helios web interface to modify your configuration.
# ============================================================
---
name: solectrus
services:

  # SOLECTRUS web application
  dashboard:
    image: ghcr.io/solectrus/solectrus:latest
    environment:
      TZ: "${TZ}"
      INSTALLATION_DATE: "${INSTALLATION_DATE}"
      REDIS_URL: redis://redis:6379
      INFLUX_HOST: influxdb
      INFLUX_TOKEN: "${INFLUX_TOKEN}"
      INFLUX_ORG: "${INFLUX_ORG}"
      INFLUX_BUCKET: "${INFLUX_BUCKET}"
      DB_HOST: postgresql
      DB_USER: postgres
      DB_PASSWORD: "${POSTGRES_PASSWORD}"
      DB_DATABASE: solectrus
      SECRET_KEY_BASE: "${SECRET_KEY_BASE}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD}"
      FORCE_SSL: 'true'
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
      influxdb:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
      - CMD-SHELL
      - nc -z 127.0.0.1 3000 || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
    - traefik.enable=true
    - traefik.http.routers.dashboard.rule=Host(`solar.example.com`)
    - traefik.http.routers.dashboard.entrypoints=websecure
    - traefik.http.routers.dashboard.tls.certresolver=letsencrypt
    - traefik.http.services.dashboard.loadbalancer.server.port=3000

  # Time-series database for sensor measurements
  influxdb:
    image: influxdb:2-alpine
    ports:
    - 8086:8086
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: "${INFLUX_PASSWORD}"
      DOCKER_INFLUXDB_INIT_ORG: "${INFLUX_ORG}"
      DOCKER_INFLUXDB_INIT_BUCKET: "${INFLUX_BUCKET}"
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: "${INFLUX_TOKEN}"
    volumes:
    - "./influxdb:/var/lib/influxdb2"
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - influx
      - ping
      interval: 10s
      timeout: 5s
      retries: 5

  # Relational database for daily summaries, electricity prices, and settings
  postgresql:
    image: postgres:18-alpine
    environment:
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: solectrus
    volumes:
    - "./postgresql:/var/lib/postgresql"
    restart: unless-stopped
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U postgres
      interval: 10s
      timeout: 5s
      retries: 5

  # In-memory store for caching
  redis:
    image: redis:8-alpine
    volumes:
    - "./redis:/data"
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 10s
      timeout: 5s
      retries: 5

  # Automatic Docker image updates
  watchtower:
    image: nickfedor/watchtower
    environment:
    - TZ
    volumes:
    - "/var/run/docker.sock:/var/run/docker.sock"
    command: "--scope solectrus --cleanup"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    labels:
    - com.centurylinklabs.watchtower.scope=solectrus

  # Configuration management UI
  helios:
    image: ghcr.io/solectrus/helios:develop
    user: root
    environment:
      ADMIN_PASSWORD: "${ADMIN_PASSWORD}"
      SECRET_KEY_BASE: "${SECRET_KEY_BASE}"
    volumes:
    - "/opt/solectrus:/data"
    - "/var/run/docker.sock:/var/run/docker.sock"
    ports:
    - 3999:3000
    restart: unless-stopped

  # Reverse proxy with automatic HTTPS
  traefik:
    image: traefik:v3
    command:
    - "--providers.docker=true"
    - "--providers.docker.exposedbydefault=false"
    - "--entrypoints.web.address=:80"
    - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
    - "--entrypoints.websecure.address=:443"
    - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
    - "--certificatesresolvers.letsencrypt.acme.email=webmaster@solar.example.com"
    - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
    ports:
    - 80:80
    - 443:443
    volumes:
    - "/var/run/docker.sock:/var/run/docker.sock:ro"
    - "./traefik:/letsencrypt"
    restart: unless-stopped

  # Automated PostgreSQL backup to S3
  postgresql-backup:
    image: ghcr.io/solectrus/postgres-s3-backup:18
    environment:
      POSTGRES_HOST: postgresql
      POSTGRES_DATABASE: solectrus
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      S3_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID}"
      S3_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY}"
      S3_REGION: "${AWS_REGION}"
      S3_BUCKET: "${AWS_BUCKET}"
      S3_PREFIX: postgresql
      SCHEDULE: "@daily"
    depends_on:
      postgresql:
        condition: service_healthy
    restart: unless-stopped

  # Automated InfluxDB backup to S3
  influxdb-backup:
    image: ghcr.io/solectrus/influxdb2-s3-backup:latest
    environment:
      INFLUXDB_HOST: influxdb
      INFLUXDB_ORG: "${INFLUX_ORG}"
      INFLUXDB_TOKEN: "${INFLUX_TOKEN}"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY}"
      S3_BUCKET: "${AWS_BUCKET}"
      S3_PREFIX: influxdb_backup
      CRON: 0 0 * * 0
    depends_on:
      influxdb:
        condition: service_healthy
    restart: unless-stopped
