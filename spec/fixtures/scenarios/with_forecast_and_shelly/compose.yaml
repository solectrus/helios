services:
  dashboard:
    image: ghcr.io/solectrus/solectrus:latest
    ports:
      - 3000:3000
    environment:
      - TZ
      - INSTALLATION_DATE
      - SECRET_KEY_BASE
      - ADMIN_PASSWORD
      - APP_HOST=myhost
      - WEB_CONCURRENCY=0
      - INFLUX_POLL_INTERVAL=5
      - CO2_EMISSION_FACTOR=500
      - DB_HOST=postgresql
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_USER=postgres
      - REDIS_URL=redis://redis:6379
      - INFLUX_HOST=influxdb
      - INFLUX_TOKEN=${INFLUX_TOKEN}
      - INFLUX_ORG
      - INFLUX_BUCKET
      - INFLUX_SENSOR_INVERTER_POWER=SENEC:inverter_power
      - INFLUX_SENSOR_HOUSE_POWER=SENEC:house_power
      - INFLUX_SENSOR_GRID_IMPORT_POWER=SENEC:grid_power_plus
      - INFLUX_SENSOR_GRID_EXPORT_POWER=SENEC:grid_power_minus
      - INFLUX_SENSOR_BATTERY_CHARGING_POWER=SENEC:bat_power_plus
      - INFLUX_SENSOR_BATTERY_DISCHARGING_POWER=SENEC:bat_power_minus
      - INFLUX_SENSOR_BATTERY_SOC=SENEC:bat_fuel_charge
      - INFLUX_SENSOR_HEATPUMP_POWER=HeatPump:power
      - INFLUX_SENSOR_WALLBOX_POWER=Wallbox:power
      - INFLUX_SENSOR_INVERTER_POWER_FORECAST=Forecast:watt
    depends_on:
      postgresql:
        condition: service_healthy
      influxdb:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
  influxdb:
    image: influxdb:2-alpine
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUX_PASSWORD}
      - DOCKER_INFLUXDB_INIT_ORG=${INFLUX_ORG}
      - DOCKER_INFLUXDB_INIT_BUCKET=${INFLUX_BUCKET}
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUX_TOKEN}
    volumes:
      - ./influxdb:/var/lib/influxdb2
    restart: unless-stopped
  postgresql:
    image: postgres:18-alpine
    environment:
      - POSTGRES_PASSWORD
    volumes:
      - ./postgresql:/var/lib/postgresql
    restart: unless-stopped
  redis:
    image: redis:8-alpine
    volumes:
      - ./redis:/data
    restart: unless-stopped
  watchtower:
    image: nickfedor/watchtower
    environment:
      - TZ
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --scope solectrus --cleanup
    restart: unless-stopped
  senec-collector:
    image: ghcr.io/solectrus/senec-collector:latest
    environment:
      - TZ
      - SENEC_ADAPTER
      - SENEC_HOST
      - SENEC_SCHEMA
      - SENEC_INTERVAL
      - SENEC_LANGUAGE
      - SENEC_IGNORE
      - INFLUX_HOST=influxdb
      - INFLUX_TOKEN=${INFLUX_TOKEN}
      - INFLUX_ORG
      - INFLUX_BUCKET
      - INFLUX_MEASUREMENT=${INFLUX_MEASUREMENT_SENEC}
    depends_on:
      influxdb:
        condition: service_healthy
    restart: unless-stopped
  forecast-collector:
    image: ghcr.io/solectrus/forecast-collector:latest
    environment:
      - TZ
      - FORECAST_PROVIDER
      - FORECAST_LATITUDE
      - FORECAST_LONGITUDE
      - FORECAST_DECLINATION
      - FORECAST_AZIMUTH
      - FORECAST_KWP
      - FORECAST_INTERVAL
      - FORECAST_DAMPING_MORNING
      - FORECAST_DAMPING_EVENING
      - FORECAST_HORIZON
      - FORECAST_INVERTER
      - FORECAST_SOLAR_APIKEY
      - INFLUX_HOST=influxdb
      - INFLUX_TOKEN=${INFLUX_TOKEN}
      - INFLUX_ORG
      - INFLUX_BUCKET
      - INFLUX_MEASUREMENT=${INFLUX_MEASUREMENT_FORECAST}
    depends_on:
      influxdb:
        condition: service_healthy
    restart: unless-stopped
  shelly-collector:
    image: ghcr.io/solectrus/shelly-collector:latest
    environment:
      - TZ
      - SHELLY_HOST
      - SHELLY_INTERVAL
      - SHELLY_PASSWORD
      - INFLUX_HOST=influxdb
      - INFLUX_TOKEN=${INFLUX_TOKEN}
      - INFLUX_ORG
      - INFLUX_BUCKET
      - INFLUX_MEASUREMENT=HeatPump,Wallbox,Fridge
    depends_on:
      influxdb:
        condition: service_healthy
    restart: unless-stopped
