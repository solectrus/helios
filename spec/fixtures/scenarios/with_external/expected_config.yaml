---
system:
  timezone: Europe/Berlin
  installation_date: '2025-01-01'
  admin_password: example-admin-password
  secret_key_base: example-secret-key-base
  app_host: 192.168.1.100
  force_ssl: 'false'
  web_concurrency: '2'
  power_splitter_interval: '300'
dashboard:
  image: ghcr.io/solectrus/solectrus:develop
postgresql:
  image: postgres:18-alpine
  password: example-postgres-password
influxdb:
  image: influxdb:2-alpine
  password: example-influx-password
  org: solectrus
  bucket: solectrus
  token: example-influx-admin-token
redis:
  image: redis:8-alpine
watchtower:
  image: nickfedor/watchtower:latest
sensors:
  inverter_power:
    source: external
    measurement: inverter
    field: power
  inverter_power_1:
    source: external
    measurement: inverter_1
    field: power
  inverter_power_2:
    source: external
    measurement: inverter_2
    field: power
  inverter_power_3:
    source: external
    measurement: inverter_3
    field: power
  case_temp:
    source: external
    measurement: case
    field: temperature
  system_status:
    source: external
    measurement: system
    field: status
  system_status_ok:
    source: external
    measurement: system
    field: status_ok
  grid_import_power:
    source: external
    measurement: grid
    field: import_power
  grid_export_power:
    source: external
    measurement: grid
    field: export_power
  grid_export_limit:
    source: external
    measurement: grid
    field: export_limit
  house_power:
    source: external
    measurement: house
    field: power
  battery_charging_power:
    source: external
    measurement: battery
    field: charging_power
  battery_discharging_power:
    source: external
    measurement: battery
    field: discharging_power
  battery_soc:
    source: external
    measurement: battery
    field: soc
  wallbox_power:
    source: external
    measurement: wallbox
    field: power
  wallbox_car_connected:
    source: external
    measurement: wallbox
    field: connected
  car_battery_soc:
    source: external
    measurement: car
    field: battery_soc
  heatpump_power:
    source: external
    measurement: heatpump
    field: power
  heatpump_heating_power:
    source: external
    measurement: heatpump
    field: heating_power
  heatpump_tank_temp:
    source: external
    measurement: heatpump
    field: tank_temp
  heatpump_status:
    source: external
    measurement: heatpump
    field: status
  outdoor_temp:
    source: external
    measurement: outdoor
    field: temperature
  inverter_power_forecast:
    source: forecast
    measurement: inverter_forecast
    field: power
  inverter_power_forecast_clearsky:
    source: forecast
    measurement: inverter_forecast_clearsky
    field: power
  outdoor_temp_forecast:
    source: forecast
    measurement: outdoor_forecast
    field: temperature
  custom_power_01:
    source: external
    measurement: custom_01
    field: power
  custom_power_02:
    source: external
    measurement: custom_02
    field: power
  custom_power_03:
    source: external
    measurement: custom_03
    field: power
  custom_power_04:
    source: external
    measurement: custom_04
    field: power
