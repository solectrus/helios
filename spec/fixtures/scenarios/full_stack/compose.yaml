---
name: solectrus
services:
  # SOLECTRUS web application
  dashboard:
    image: ghcr.io/solectrus/solectrus:latest
    environment:
      - TZ
      - INSTALLATION_DATE
      - INFLUX_TOKEN
      - INFLUX_ORG
      - INFLUX_BUCKET
      - SECRET_KEY_BASE
      - ADMIN_PASSWORD
      - APP_HOST
      - WEB_CONCURRENCY
      - INFLUX_POLL_INTERVAL
      - REDIS_URL=redis://redis:6379
      - INFLUX_HOST=influxdb
      - DB_HOST=postgresql
      - DB_USER=postgres
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_DATABASE=solectrus
      - UI_THEME
      - LOCKUP_CODEWORD
      - INFLUX_EXCLUDE_FROM_HOUSE_POWER
      - INFLUX_SENSOR_INVERTER_POWER
      - INFLUX_SENSOR_INVERTER_POWER_1
      - INFLUX_SENSOR_INVERTER_POWER_2
      - INFLUX_SENSOR_INVERTER_POWER_3
      - INFLUX_SENSOR_CASE_TEMP
      - INFLUX_SENSOR_SYSTEM_STATUS
      - INFLUX_SENSOR_SYSTEM_STATUS_OK
      - INFLUX_SENSOR_GRID_IMPORT_POWER
      - INFLUX_SENSOR_GRID_EXPORT_POWER
      - INFLUX_SENSOR_GRID_EXPORT_LIMIT
      - INFLUX_SENSOR_HOUSE_POWER
      - INFLUX_SENSOR_BATTERY_CHARGING_POWER
      - INFLUX_SENSOR_BATTERY_DISCHARGING_POWER
      - INFLUX_SENSOR_BATTERY_SOC
      - INFLUX_SENSOR_WALLBOX_POWER
      - INFLUX_SENSOR_WALLBOX_CAR_CONNECTED
      - INFLUX_SENSOR_CAR_BATTERY_SOC
      - INFLUX_SENSOR_HEATPUMP_POWER
      - INFLUX_SENSOR_HEATPUMP_HEATING_POWER
      - INFLUX_SENSOR_HEATPUMP_TANK_TEMP
      - INFLUX_SENSOR_HEATPUMP_STATUS
      - INFLUX_SENSOR_OUTDOOR_TEMP
      - INFLUX_SENSOR_INVERTER_POWER_FORECAST
      - INFLUX_SENSOR_INVERTER_POWER_FORECAST_CLEARSKY
      - INFLUX_SENSOR_OUTDOOR_TEMP_FORECAST
      - INFLUX_SENSOR_CUSTOM_POWER_01
      - INFLUX_SENSOR_CUSTOM_POWER_02
      - INFLUX_SENSOR_CUSTOM_POWER_03
      - INFLUX_SENSOR_CUSTOM_POWER_04
      - INFLUX_SENSOR_CUSTOM_POWER_05
      - INFLUX_SENSOR_CUSTOM_POWER_06
      - INFLUX_SENSOR_CUSTOM_POWER_07
      - INFLUX_SENSOR_CUSTOM_POWER_08
      - INFLUX_SENSOR_CUSTOM_POWER_09
      - INFLUX_SENSOR_CUSTOM_POWER_10
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
      influxdb:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - nc -z 127.0.0.1 3000 || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - 3000:3000

  # Time-series database for sensor measurements
  influxdb:
    image: influxdb:2-alpine
    ports:
      - 8086:8086
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUX_PASSWORD}
      - DOCKER_INFLUXDB_INIT_ORG=${INFLUX_ORG}
      - DOCKER_INFLUXDB_INIT_BUCKET=${INFLUX_BUCKET}
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUX_TOKEN}
    volumes:
      - "./influxdb:/var/lib/influxdb2"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - influx
        - ping
      interval: 10s
      timeout: 5s
      retries: 5

  # Relational database for daily summaries, electricity prices, and settings
  postgresql:
    image: postgres:18-alpine
    environment:
      - POSTGRES_PASSWORD
      - POSTGRES_DB=solectrus
    volumes:
      - "./postgresql:/var/lib/postgresql"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U postgres
      interval: 10s
      timeout: 5s
      retries: 5

  # In-memory store for caching
  redis:
    image: redis:8-alpine
    volumes:
      - "./redis:/data"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 10s
      timeout: 5s
      retries: 5

  # Automatic Docker image updates
  watchtower:
    image: nickfedor/watchtower:latest
    environment:
      - TZ
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
    command: "--scope solectrus --cleanup"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    labels:
      - com.centurylinklabs.watchtower.scope=solectrus

  # Configuration management UI
  helios:
    image: ghcr.io/solectrus/helios:develop
    user: root
    environment:
      - ADMIN_PASSWORD
      - SECRET_KEY_BASE
    volumes:
      - "/opt/solectrus:/data"
      - "/var/run/docker.sock:/var/run/docker.sock"
    ports:
      - 3999:3000
    restart: unless-stopped

  # SENEC data collector
  senec-collector:
    image: ghcr.io/solectrus/senec-collector:latest
    environment:
      - TZ
      - INFLUX_TOKEN
      - INFLUX_ORG
      - INFLUX_BUCKET
      - INFLUX_MEASUREMENT_SENEC
      - SENEC_ADAPTER
      - SENEC_INTERVAL
      - INFLUX_HOST=influxdb
      - SENEC_HOST
      - SENEC_SCHEMA
      - SENEC_LANGUAGE
    depends_on:
      influxdb:
        condition: service_healthy
    restart: unless-stopped

  # Shelly collector
  shelly-collector:
    image: ghcr.io/solectrus/shelly-collector:develop
    environment:
      - INFLUX_TOKEN
      - INFLUX_ORG
      - INFLUX_BUCKET
      - SHELLY_HOST
      - SHELLY_INTERVAL
      - INFLUX_MEASUREMENT
      - INFLUX_HOST=influxdb
      - SHELLY_PASSWORD
    depends_on:
      influxdb:
        condition: service_healthy
    restart: unless-stopped

  # MQTT data collector
  mqtt-collector:
    image: ghcr.io/solectrus/mqtt-collector:latest
    environment:
      - TZ
      - INFLUX_TOKEN
      - INFLUX_ORG
      - INFLUX_BUCKET
      - MQTT_HOST
      - INFLUX_HOST=influxdb
      - MQTT_PORT
      - MQTT_USERNAME
      - MQTT_PASSWORD
      - MAPPING_0_TOPIC
      - MAPPING_0_MEASUREMENT
      - MAPPING_0_FIELD
      - MAPPING_0_TYPE
      - MAPPING_1_TOPIC
      - MAPPING_1_MEASUREMENT
      - MAPPING_1_FIELD
      - MAPPING_1_TYPE
      - MAPPING_1_JSON_FORMULA
      - MAPPING_2_TOPIC
      - MAPPING_2_MEASUREMENT
      - MAPPING_2_FIELD
      - MAPPING_2_TYPE
      - MAPPING_2_JSON_KEY
      - MAPPING_3_TOPIC
      - MAPPING_3_MEASUREMENT
      - MAPPING_3_FIELD
      - MAPPING_3_TYPE
      - MAPPING_3_JSON_FORMULA
      - MAPPING_4_TOPIC
      - MAPPING_4_MEASUREMENT
      - MAPPING_4_FIELD
      - MAPPING_4_TYPE
      - MAPPING_4_JSON_KEY
    depends_on:
      influxdb:
        condition: service_healthy
    restart: unless-stopped

  # Solar forecast data collector
  forecast-collector:
    image: ghcr.io/solectrus/forecast-collector:latest
    environment:
      - TZ
      - INFLUX_TOKEN
      - INFLUX_ORG
      - INFLUX_BUCKET
      - FORECAST_PROVIDER
      - FORECAST_LATITUDE
      - FORECAST_LONGITUDE
      - FORECAST_INTERVAL
      - INFLUX_HOST=influxdb
      - INFLUX_MEASUREMENT=${INFLUX_MEASUREMENT_FORECAST}
      - FORECAST_DECLINATION
      - FORECAST_AZIMUTH
      - FORECAST_KWP
      - PVNODE_APIKEY
    depends_on:
      influxdb:
        condition: service_healthy
    restart: unless-stopped

  # Calculates derived power values
  power-splitter:
    image: ghcr.io/solectrus/power-splitter:latest
    environment:
      - TZ
      - INSTALLATION_DATE
      - INFLUX_TOKEN
      - INFLUX_ORG
      - INFLUX_BUCKET
      - POSTGRES_PASSWORD
      - INFLUX_HOST=influxdb
      - REDIS_URL=redis://redis:6379/1
      - DB_HOST=postgresql
      - DB_USER=postgres
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - INFLUX_SENSOR_INVERTER_POWER
      - INFLUX_SENSOR_INVERTER_POWER_1
      - INFLUX_SENSOR_INVERTER_POWER_2
      - INFLUX_SENSOR_INVERTER_POWER_3
      - INFLUX_SENSOR_CASE_TEMP
      - INFLUX_SENSOR_SYSTEM_STATUS
      - INFLUX_SENSOR_SYSTEM_STATUS_OK
      - INFLUX_SENSOR_GRID_IMPORT_POWER
      - INFLUX_SENSOR_GRID_EXPORT_POWER
      - INFLUX_SENSOR_GRID_EXPORT_LIMIT
      - INFLUX_SENSOR_HOUSE_POWER
      - INFLUX_SENSOR_BATTERY_CHARGING_POWER
      - INFLUX_SENSOR_BATTERY_DISCHARGING_POWER
      - INFLUX_SENSOR_BATTERY_SOC
      - INFLUX_SENSOR_WALLBOX_POWER
      - INFLUX_SENSOR_WALLBOX_CAR_CONNECTED
      - INFLUX_SENSOR_CAR_BATTERY_SOC
      - INFLUX_SENSOR_HEATPUMP_POWER
      - INFLUX_SENSOR_HEATPUMP_HEATING_POWER
      - INFLUX_SENSOR_HEATPUMP_TANK_TEMP
      - INFLUX_SENSOR_HEATPUMP_STATUS
      - INFLUX_SENSOR_OUTDOOR_TEMP
      - INFLUX_SENSOR_INVERTER_POWER_FORECAST
      - INFLUX_SENSOR_INVERTER_POWER_FORECAST_CLEARSKY
      - INFLUX_SENSOR_OUTDOOR_TEMP_FORECAST
      - INFLUX_SENSOR_CUSTOM_POWER_01
      - INFLUX_SENSOR_CUSTOM_POWER_02
      - INFLUX_SENSOR_CUSTOM_POWER_03
      - INFLUX_SENSOR_CUSTOM_POWER_04
      - INFLUX_SENSOR_CUSTOM_POWER_05
      - INFLUX_SENSOR_CUSTOM_POWER_06
      - INFLUX_SENSOR_CUSTOM_POWER_07
      - INFLUX_SENSOR_CUSTOM_POWER_08
      - INFLUX_SENSOR_CUSTOM_POWER_09
      - INFLUX_SENSOR_CUSTOM_POWER_10
    depends_on:
      influxdb:
        condition: service_healthy
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
