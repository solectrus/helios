---
_schema_version: 4
system:
  admin_password: example-admin-password
  app_host: solectrus.example.com
  installation_date: '2024-01-01'
  secret_key_base: my-secret-key-base
  timezone: Europe/Berlin
dashboard:
  image: ghcr.io/solectrus/solectrus:latest
postgresql:
  image: postgres:18-alpine
  password: my-secret-db-password
influxdb:
  bucket: solectrus
  image: influxdb:2-alpine
  org: solectrus
  password: my-influx-password
  publish_port: true
  token_admin: my-super-secret-admin-token
  token_read: my-super-secret-admin-token
  token_readwrite: my-super-secret-admin-token
  token_write: my-super-secret-admin-token
redis:
  image: redis:8-alpine
watchtower:
  image: nickfedor/watchtower:latest
mqtt:
  mqtt_host: mqtt-broker.local
  mqtt_password: my-mqtt-password
  mqtt_port: '1883'
  mqtt_username: my-mqtt-username
shelly:
  connection: local
  interval: '5'
sensors:
  custom_power_01:
    field: power
    measurement: fridge
    name: fridge
    shelly_host: shelly-fridge.fritz.box
    source: shelly
  heatpump_heating_power:
    field: heating_power
    measurement: heatpump
    mqtt_payload_type: float
    mqtt_topic: heatpump/heating
    source: mqtt
  heatpump_power:
    exclude_from_house_power: true
    field: power
    measurement: heatpump
    shelly_host: shelly-heatpump.fritz.box
    source: shelly
helios:
  image: ghcr.io/solectrus/helios:develop
