# ============================================================
# Managed by HELIOS — DO NOT EDIT MANUALLY!
#
# This file stores your HELIOS configuration.
# It is rewritten whenever you apply changes in HELIOS.
# Use the HELIOS web interface to modify your configuration.
# ============================================================
---
system:
  admin_password: password
  app_host: localhost
  installation_date: '2022-01-01'
  secret_key_base: c5a9c3e5d6a7b8c9d0e1f2a3b4c5d6e7f8g9h0i1j2k3l4m5n6o7p8q9r0s1t2u3v4w5x6y7z8a9b0c1d2e3f4g5h6
  timezone: Europe/Berlin
dashboard:
  image: ghcr.io/solectrus/solectrus:1-0-beta
postgresql:
  image: postgres:18-alpine
  password: my-secret-db-password
influxdb:
  bucket: my-solectrus-bucket
  image: influxdb:2.7-alpine
  org: solectrus
  password: password
  token: my-super-secret-admin-token
redis:
  image: redis:7-alpine
watchtower:
  image: containrrr/watchtower:latest
forecast:
  forecast_azimuth1: "-30"
  forecast_azimuth2: '75'
  forecast_declination1: '30'
  forecast_declination2: '10'
  forecast_interval: '900'
  forecast_kwp1: '9.9'
  forecast_kwp2: '1.5'
  forecast_latitude: '51.12345'
  forecast_longitude: '12.12345'
  forecast_roofs: '2'
  measurement: Forecast
senec:
  adapter: local
  host: 192.168.1.100
  ignore: wallbox_charge_power
  interval: '5'
  language: de
  schema: https
  version: v3
mqtt:
  mqtt_host: 192.168.1.2
  mqtt_password: ''
  mqtt_port: '1883'
  mqtt_ssl: 'false'
  mqtt_username: ''
sensors:
  battery_charging_power:
    source: senec
  battery_discharging_power:
    source: senec
  battery_soc:
    source: senec
  car_battery_soc:
    field: car_battery_soc
    measurement: Car_Opel
    mqtt_payload_type: integer
    mqtt_topic: homeassistant/lp/1/%Soc
    source: mqtt
  case_temp:
    source: senec
  grid_export_power:
    source: senec
  grid_import_power:
    source: senec
  house_power:
    source: senec
  inverter_power_1:
    field: inverter_power
    measurement: SENEC
    source: senec
  inverter_power_2:
    field: inverter_power
    is_balcony: true
    measurement: Garage
    mqtt_payload_type: integer
    mqtt_topic: homeassistant/PV/GaragePower
    source: mqtt
  inverter_power_forecast:
    field: watt
    measurement: Forecast
    source: forecast
  system_status:
    source: senec
  system_status_ok:
    source: senec
  wallbox_car_connected:
    field: plug_status
    measurement: Car_Opel
    mqtt_payload_type: integer
    mqtt_topic: homeassistant/lp/1/PlugStat
    source: mqtt
  wallbox_power:
    field: wallbox_charge_power
    measurement: SENEC
    mqtt_payload_type: integer
    mqtt_topic: homeassistant/lp/1/W
    source: mqtt
ingest:
  image: ghcr.io/solectrus/ingest:latest
_unmanaged:
  env_vars:
    INFLUX_MEASUREMENT_TIBBER: my-tibber
