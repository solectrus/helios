name: solectrus

services:

  # ┌──────────────────────────────────────────────────────────┐
  # │  SOLECTRUS — Web application                             │
  # └──────────────────────────────────────────────────────────┘
  #
  dashboard:
    image: ghcr.io/solectrus/solectrus:latest
    environment:
    - TZ
    - INSTALLATION_DATE
    - INFLUX_TOKEN
    - INFLUX_ORG
    - INFLUX_BUCKET
    - SECRET_KEY_BASE
    - ADMIN_PASSWORD
    - APP_HOST
    - FORCE_SSL
    - REDIS_URL=redis://redis:6379
    - INFLUX_HOST=influxdb
    - DB_HOST=postgresql
    - DB_USER=postgres
    - DB_PASSWORD=${POSTGRES_PASSWORD}
    - DB_DATABASE=solectrus
    - WEB_CONCURRENCY=0
    - LOCKUP_CODEWORD
    - INFLUX_SENSOR_BATTERY_CHARGING_POWER
    - INFLUX_SENSOR_BATTERY_DISCHARGING_POWER
    - INFLUX_SENSOR_BATTERY_SOC
    - INFLUX_SENSOR_CASE_TEMP
    - INFLUX_SENSOR_CUSTOM_POWER_01
    - INFLUX_SENSOR_CUSTOM_POWER_02
    - INFLUX_SENSOR_CUSTOM_POWER_03
    - INFLUX_SENSOR_GRID_EXPORT_LIMIT
    - INFLUX_SENSOR_GRID_EXPORT_POWER
    - INFLUX_SENSOR_GRID_IMPORT_POWER
    - INFLUX_SENSOR_HOUSE_POWER
    - INFLUX_SENSOR_INVERTER_POWER
    - INFLUX_SENSOR_INVERTER_POWER_FORECAST
    - INFLUX_SENSOR_INVERTER_POWER_FORECAST_CLEARSKY
    - INFLUX_SENSOR_OUTDOOR_TEMP_FORECAST
    - INFLUX_SENSOR_SYSTEM_STATUS
    - INFLUX_SENSOR_SYSTEM_STATUS_OK
    - INFLUX_SENSOR_WALLBOX_CAR_CONNECTED
    - INFLUX_SENSOR_WALLBOX_POWER
    labels:
    - traefik.enable=true
    - traefik.http.routers.dashboard.rule=Host(`solectrus.example.com`)
    - traefik.http.routers.dashboard.entrypoints=websecure
    - traefik.http.routers.dashboard.tls.certresolver=letsencrypt
    - traefik.http.services.dashboard.loadbalancer.server.port=3000
    - traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https
    - traefik.http.routers.redirs.middlewares=redirect-to-https
    - com.centurylinklabs.watchtower.scope=solectrus
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
      influxdb:
        condition: service_healthy
    healthcheck:
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
      start_interval: 2s
      test:
      - CMD-SHELL
      - nc -z 127.0.0.1 3000 || exit 1
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  # ┌───────────────────────────────────────────────────────────┐
  # │  InfluxDB — Time-series database for sensor measurements  │
  # └───────────────────────────────────────────────────────────┘
  #
  influxdb:
    image: influxdb:2-alpine
    environment:
    - DOCKER_INFLUXDB_INIT_MODE=setup
    - DOCKER_INFLUXDB_INIT_USERNAME=admin
    - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUX_PASSWORD}
    - DOCKER_INFLUXDB_INIT_ORG=${INFLUX_ORG}
    - DOCKER_INFLUXDB_INIT_BUCKET=${INFLUX_BUCKET}
    - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUX_TOKEN}
    volumes:
    - "${INFLUX_VOLUME_PATH}:/var/lib/influxdb2"
    ports:
    - 8086:8086
    labels:
    - com.centurylinklabs.watchtower.scope=solectrus
    healthcheck:
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 2s
      test:
      - CMD
      - influx
      - ping
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  # ┌──────────────────────────────────────────────────────────────────────────────────────────┐
  # │  PostgreSQL — Relational database for daily summaries, electricity prices, and settings  │
  # └──────────────────────────────────────────────────────────────────────────────────────────┘
  #
  postgresql:
    image: postgres:18-alpine
    environment:
    - POSTGRES_PASSWORD
    - POSTGRES_DB=solectrus
    volumes:
    - "${DB_VOLUME_PATH}:/var/lib/postgresql"
    labels:
    - com.centurylinklabs.watchtower.scope=solectrus
    healthcheck:
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 2s
      test:
      - CMD-SHELL
      - pg_isready -U postgres
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  # ┌──────────────────────────────────────────────────────────┐
  # │  Redis — In-memory store for caching                     │
  # └──────────────────────────────────────────────────────────┘
  #
  redis:
    image: redis:8-alpine
    volumes:
    - "${REDIS_VOLUME_PATH}:/data"
    labels:
    - com.centurylinklabs.watchtower.scope=solectrus
    healthcheck:
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
      start_interval: 2s
      test:
      - CMD
      - redis-cli
      - ping
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  # ┌───────────────────────────────────────────────────────────────────┐
  # │  SENEC Collector — Reads data from SENEC battery storage systems  │
  # └───────────────────────────────────────────────────────────────────┘
  #
  senec-collector:
    image: ghcr.io/solectrus/senec-collector:latest
    environment:
    - TZ
    - INFLUX_TOKEN
    - INFLUX_ORG
    - INFLUX_BUCKET
    - INFLUX_MEASUREMENT_SENEC
    - SENEC_ADAPTER
    - SENEC_INTERVAL
    - INFLUX_HOST=influxdb
    - SENEC_USERNAME
    - SENEC_PASSWORD
    - SENEC_REQUEST_MODE
    labels:
    - com.centurylinklabs.watchtower.scope=solectrus
    depends_on:
      influxdb:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  # ┌───────────────────────────────────────────────────────────┐
  # │  Shelly Collector — Reads data from Shelly energy meters  │
  # └───────────────────────────────────────────────────────────┘
  #
  shelly-collector:
    image: ghcr.io/solectrus/shelly-collector:latest
    environment:
    - TZ
    - INFLUX_TOKEN
    - INFLUX_ORG
    - INFLUX_BUCKET
    - SHELLY_INTERVAL
    - INFLUX_MEASUREMENT
    - INFLUX_HOST=influxdb
    - SHELLY_DEVICE_ID
    - SHELLY_CLOUD_SERVER
    - SHELLY_AUTH_KEY
    labels:
    - com.centurylinklabs.watchtower.scope=solectrus
    depends_on:
      influxdb:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  # ┌───────────────────────────────────────────────────────────┐
  # │  Forecast Collector — Fetches solar production forecasts  │
  # └───────────────────────────────────────────────────────────┘
  #
  forecast-collector:
    image: ghcr.io/solectrus/forecast-collector:latest
    environment:
    - TZ
    - INFLUX_TOKEN
    - INFLUX_ORG
    - INFLUX_BUCKET
    - INFLUX_HOST=influxdb
    - INFLUX_MEASUREMENT=${INFLUX_MEASUREMENT_FORECAST}
    - FORECAST_PROVIDER
    - FORECAST_LATITUDE
    - FORECAST_LONGITUDE
    - FORECAST_INTERVAL
    - FORECAST_CONFIGURATIONS
    - FORECAST_0_DECLINATION
    - FORECAST_0_AZIMUTH
    - FORECAST_0_KWP
    - FORECAST_1_DECLINATION
    - FORECAST_1_AZIMUTH
    - FORECAST_1_KWP
    - FORECAST_2_DECLINATION
    - FORECAST_2_AZIMUTH
    - FORECAST_2_KWP
    - FORECAST_3_DECLINATION
    - FORECAST_3_AZIMUTH
    - FORECAST_3_KWP
    - PVNODE_APIKEY
    - PVNODE_PAID
    - PVNODE_EXTRA_PARAMS
    labels:
    - com.centurylinklabs.watchtower.scope=solectrus
    depends_on:
      influxdb:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  # ┌──────────────────────────────────────────────────────────┐
  # │  Power Splitter — Calculates derived power values        │
  # └──────────────────────────────────────────────────────────┘
  #
  power-splitter:
    image: ghcr.io/solectrus/power-splitter:latest
    environment:
    - TZ
    - INSTALLATION_DATE
    - INFLUX_TOKEN
    - INFLUX_ORG
    - INFLUX_BUCKET
    - POSTGRES_PASSWORD
    - INFLUX_HOST=influxdb
    - REDIS_URL=redis://redis:6379/1
    - DB_HOST=postgresql
    - DB_USER=postgres
    - DB_PASSWORD=${POSTGRES_PASSWORD}
    - POWER_SPLITTER_INTERVAL=300
    - INFLUX_SENSOR_BATTERY_CHARGING_POWER
    - INFLUX_SENSOR_BATTERY_DISCHARGING_POWER
    - INFLUX_SENSOR_BATTERY_SOC
    - INFLUX_SENSOR_CASE_TEMP
    - INFLUX_SENSOR_CUSTOM_POWER_01
    - INFLUX_SENSOR_CUSTOM_POWER_02
    - INFLUX_SENSOR_CUSTOM_POWER_03
    - INFLUX_SENSOR_GRID_EXPORT_LIMIT
    - INFLUX_SENSOR_GRID_EXPORT_POWER
    - INFLUX_SENSOR_GRID_IMPORT_POWER
    - INFLUX_SENSOR_HOUSE_POWER
    - INFLUX_SENSOR_INVERTER_POWER
    - INFLUX_SENSOR_INVERTER_POWER_FORECAST
    - INFLUX_SENSOR_INVERTER_POWER_FORECAST_CLEARSKY
    - INFLUX_SENSOR_OUTDOOR_TEMP_FORECAST
    - INFLUX_SENSOR_SYSTEM_STATUS
    - INFLUX_SENSOR_SYSTEM_STATUS_OK
    - INFLUX_SENSOR_WALLBOX_CAR_CONNECTED
    - INFLUX_SENSOR_WALLBOX_POWER
    labels:
    - com.centurylinklabs.watchtower.scope=solectrus
    depends_on:
      influxdb:
        condition: service_healthy
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  # ┌──────────────────────────────────────────────────────────┐
  # │  Traefik — Reverse proxy with automatic HTTPS            │
  # └──────────────────────────────────────────────────────────┘
  #
  traefik:
    image: traefik:v3.6
    command:
    - "--providers.docker=true"
    - "--providers.docker.exposedbydefault=false"
    - "--entrypoints.web.address=:80"
    - "--entrypoints.websecure.address=:443"
    - "--entrypoints.influxdb.address=:8086"
    - "--certificatesresolvers.myresolver.acme.tlschallenge=true"
    - "--certificatesresolvers.myresolver.acme.email=${LETSENCRYPT_EMAIL}"
    - "--certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json"
    environment:
    - TZ
    volumes:
    - "${TRAEFIK_VOLUME_PATH}:/letsencrypt"
    - "/var/run/docker.sock:/var/run/docker.sock:ro"
    ports:
    - 80:80
    - 443:443
    - 8086:8086
    labels:
    - com.centurylinklabs.watchtower.scope=solectrus
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  # ┌──────────────────────────────────────────────────────────┐
  # │  Watchtower — Automatic Docker image updates             │
  # └──────────────────────────────────────────────────────────┘
  #
  watchtower:
    image: nickfedor/watchtower:latest
    environment:
    - TZ
    - WATCHTOWER_POLL_INTERVAL
    - WATCHTOWER_SCOPE
    - WATCHTOWER_CLEANUP
    volumes:
    - "/var/run/docker.sock:/var/run/docker.sock"
    labels:
    - com.centurylinklabs.watchtower.scope=solectrus
    healthcheck:
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
      start_interval: 2s
      test:
      - CMD
      - "/watchtower"
      - "--health-check"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  # ┌──────────────────────────────────────────────────────────┐
  # │  HELIOS — Configuration management UI                    │
  # └──────────────────────────────────────────────────────────┘
  #
  helios:
    image: ghcr.io/solectrus/helios:develop
    environment:
    - ADMIN_PASSWORD
    - SECRET_KEY_BASE
    volumes:
    - ".:/data"
    - "/var/run/docker.sock:/var/run/docker.sock"
    ports:
    - 3999:3000
    labels:
    - com.centurylinklabs.watchtower.scope=solectrus
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

networks:
  default:
    name: solectrus_default
