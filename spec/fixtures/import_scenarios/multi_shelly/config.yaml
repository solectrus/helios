---
_schema_version: 3
system:
  admin_password: example-admin-password
  app_host: solectrus.example.com
  installation_date: '2024-01-01'
  secret_key_base: 12e336f0dda1f5878bf24e60529b8980d972e67384efd32c0665d39593e407c7c9c66cee3eedbdd9b5a1012e0522c252a6ddf4f7ea568052e1ad8101e7e1219f
  timezone: Europe/Berlin
dashboard:
  image: ghcr.io/solectrus/solectrus:latest
  influx_poll_interval: '70'
  lockup_codeword: sonne
postgresql:
  image: postgres:18-alpine
  password: my-secret-db-password
influxdb:
  bucket: solectrus
  image: influxdb:2-alpine
  org: solectrus
  password: example-influx-password
  token_admin: my-super-secret-admin-token
  token_read: my-super-secret-admin-token
  token_readwrite: my-super-secret-admin-token
  token_write: my-super-secret-admin-token
redis:
  image: redis:8-alpine
watchtower:
  image: nickfedor/watchtower:latest
forecast:
  forecast: pvnode
  forecast_declination1: '45'
  forecast_declination2: '38'
  forecast_declination3: '38'
  forecast_declination4: '38'
  forecast_kwp1: '6'
  forecast_kwp2: '3.08'
  forecast_kwp3: '3.85'
  forecast_kwp4: '3.85'
  forecast_latitude: '50.123'
  forecast_longitude: '11.456'
  forecast_pvnode_apikey: pvn_example-pvnode-api-key
  forecast_pvnode_azimuth1: '180'
  forecast_pvnode_azimuth2: '180'
  forecast_pvnode_azimuth3: '90'
  forecast_pvnode_azimuth4: '270'
  forecast_pvnode_extra_params: diffuse_radiation_model=perez
  forecast_pvnode_paid: 'true'
  forecast_roofs: '4'
  measurement: forecast
senec:
  adapter: cloud
  interval: '60'
  password: example-password
  request_mode: full
  username: mail@example.com
  version: v4
shelly:
  auth_key: example-shelly-auth-key
  cloud_server: https://shelly-123-eu.shelly.cloud
  connection: cloud
  devices:
  - device_id: device-id-dishwasher
    measurement: Dishwasher
    name: dishwasher
  - device_id: device-id-fridge
    measurement: Fridge
    name: fridge
  - device_id: device-id-washer
    measurement: Washer
    name: washer
  interval: '20'
  mode: essential
reverse_proxy:
  app_domain: solectrus.example.com
  command:
  - "--providers.docker=true"
  - "--providers.docker.exposedbydefault=false"
  - "--entrypoints.web.address=:80"
  - "--entrypoints.websecure.address=:443"
  - "--entrypoints.influxdb.address=:8086"
  - "--certificatesresolvers.myresolver.acme.tlschallenge=true"
  - "--certificatesresolvers.myresolver.acme.email=${LETSENCRYPT_EMAIL}"
  - "--certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json"
  environment:
  - TZ
  image: traefik:v3.6
  labels:
  - com.centurylinklabs.watchtower.scope=solectrus
  letsencrypt_email: mail@example.org
  ports:
  - 80:80
  - 443:443
  - 8086:8086
  restart: unless-stopped
  volumes:
  - "${TRAEFIK_VOLUME_PATH}:/letsencrypt"
  - "/var/run/docker.sock:/var/run/docker.sock:ro"
sensors:
  battery_charging_power:
    source: senec
  battery_discharging_power:
    source: senec
  battery_soc:
    source: senec
  case_temp:
    source: senec
  custom_power_01:
    field: power
    measurement: Fridge
    name: Fridge
    source: shelly
  custom_power_02:
    field: power
    measurement: Dishwasher
    name: Dishwasher
    source: shelly
  custom_power_03:
    field: power
    measurement: Washer
    name: Washer
    source: shelly
  grid_export_limit:
    source: senec
  grid_export_power:
    source: senec
  grid_import_power:
    source: senec
  house_power:
    source: senec
  inverter_power:
    source: senec
  inverter_power_forecast:
    source: forecast
  inverter_power_forecast_clearsky:
    source: forecast
  outdoor_temp_forecast:
    field: temp
    measurement: forecast
    source: forecast
  system_status:
    source: senec
  system_status_ok:
    source: senec
  wallbox_car_connected:
    source: senec
  wallbox_power:
    source: senec
power_splitter:
  image: ghcr.io/solectrus/power-splitter:latest
service_overrides:
  dashboard:
    labels:
    - traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https
    - traefik.http.routers.redirs.middlewares=redirect-to-https
