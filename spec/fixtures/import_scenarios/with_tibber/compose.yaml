#
# This file defines the Docker services for your SOLECTRUS stack.
# It is regenerated whenever you apply changes in HELIOS.
# Use the HELIOS web interface to modify your configuration.
# ============================================================

name: solectrus

services:

  # ┌──────────────────────────────────────────────────────────┐
  # │  SOLECTRUS — Web application                             │
  # └──────────────────────────────────────────────────────────┘
  #
  dashboard:
    image: ghcr.io/solectrus/solectrus:latest
    environment:
    - TZ
    - INSTALLATION_DATE
    - INFLUX_TOKEN
    - INFLUX_ORG
    - INFLUX_BUCKET
    - SECRET_KEY_BASE
    - ADMIN_PASSWORD
    - APP_HOST
    - REDIS_URL=redis://redis:6379
    - INFLUX_HOST=influxdb
    - DB_HOST=postgresql
    - DB_USER=postgres
    - DB_PASSWORD=${POSTGRES_PASSWORD}
    - DB_DATABASE=solectrus
    - WEB_CONCURRENCY=0
    ports:
    - 3000:3000
    labels:
    - com.centurylinklabs.watchtower.scope=solectrus
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
      influxdb:
        condition: service_healthy
    healthcheck:
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
      start_interval: 2s
      test:
      - CMD-SHELL
      - nc -z 127.0.0.1 3000 || exit 1
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  # ┌───────────────────────────────────────────────────────────┐
  # │  InfluxDB — Time-series database for sensor measurements  │
  # └───────────────────────────────────────────────────────────┘
  #
  influxdb:
    image: influxdb:2-alpine
    environment:
    - DOCKER_INFLUXDB_INIT_MODE=setup
    - DOCKER_INFLUXDB_INIT_USERNAME=admin
    - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUX_PASSWORD}
    - DOCKER_INFLUXDB_INIT_ORG=${INFLUX_ORG}
    - DOCKER_INFLUXDB_INIT_BUCKET=${INFLUX_BUCKET}
    - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUX_TOKEN}
    volumes:
    - "./influxdb:/var/lib/influxdb2"
    ports:
    - 8086:8086
    labels:
    - com.centurylinklabs.watchtower.scope=solectrus
    healthcheck:
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 2s
      test:
      - CMD
      - influx
      - ping
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  # ┌──────────────────────────────────────────────────────────────────────────────────────────┐
  # │  PostgreSQL — Relational database for daily summaries, electricity prices, and settings  │
  # └──────────────────────────────────────────────────────────────────────────────────────────┘
  #
  postgresql:
    image: postgres:18-alpine
    environment:
    - POSTGRES_PASSWORD
    - POSTGRES_DB=solectrus
    volumes:
    - "./postgresql:/var/lib/postgresql"
    labels:
    - com.centurylinklabs.watchtower.scope=solectrus
    healthcheck:
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 2s
      test:
      - CMD-SHELL
      - pg_isready -U postgres
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  # ┌──────────────────────────────────────────────────────────┐
  # │  Redis — In-memory store for caching                     │
  # └──────────────────────────────────────────────────────────┘
  #
  redis:
    image: redis:8-alpine
    volumes:
    - "./redis:/data"
    labels:
    - com.centurylinklabs.watchtower.scope=solectrus
    healthcheck:
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
      start_interval: 2s
      test:
      - CMD
      - redis-cli
      - ping
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  # ┌──────────────────────────────────────────────────────────┐
  # │  Watchtower — Automatic Docker image updates             │
  # └──────────────────────────────────────────────────────────┘
  #
  watchtower:
    image: nickfedor/watchtower:latest
    command: "--scope solectrus --cleanup"
    environment:
    - TZ
    - WATCHTOWER_POLL_INTERVAL
    volumes:
    - "/var/run/docker.sock:/var/run/docker.sock"
    labels:
    - com.centurylinklabs.watchtower.scope=solectrus
    healthcheck:
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
      start_interval: 2s
      test:
      - CMD
      - "/watchtower"
      - "--health-check"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  # ┌──────────────────────────────────────────────────────────┐
  # │  HELIOS — Configuration management UI                    │
  # └──────────────────────────────────────────────────────────┘
  #
  helios:
    image: ghcr.io/solectrus/helios:develop
    environment:
    - ADMIN_PASSWORD
    - SECRET_KEY_BASE
    volumes:
    - ".:/data"
    - "/var/run/docker.sock:/var/run/docker.sock"
    ports:
    - 3999:3000
    labels:
    - com.centurylinklabs.watchtower.scope=solectrus
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  # ┌────────────────────────────────────────────────────────────┐
  # │  Unmanaged service (preserved from existing installation)  │
  # └────────────────────────────────────────────────────────────┘
  #
  tibber-collector:
    image: ghcr.io/solectrus/tibber-collector:latest
    environment:
    - TZ
    - INFLUX_BUCKET
    - INFLUX_HOST=influxdb
    - INFLUX_MEASUREMENT=${INFLUX_MEASUREMENT_TIBBER}
    - INFLUX_ORG
    - INFLUX_TOKEN=${INFLUX_TOKEN}
    - TIBBER_INTERVAL
    - TIBBER_TOKEN
    depends_on:
      influxdb:
        condition: service_healthy
    restart: unless-stopped

networks:
  default:
    name: solectrus_default
