---
_schema_version: 4
system:
  admin_password: test-admin
  installation_date: '2023-06-15'
  secret_key_base: test-secret-key
  timezone: Europe/Berlin
dashboard:
  image: ghcr.io/solectrus/solectrus:latest
postgresql:
  image: postgres:18-alpine
  password: test-db-password
influxdb:
  bucket: solectrus
  image: influxdb:2-alpine
  org: solectrus
  password: test-influx-pw
  token_admin: test-influx-token
  token_read: test-influx-token
  token_readwrite: test-influx-token
  token_write: test-influx-token
redis:
  image: redis:8-alpine
watchtower:
  image: nickfedor/watchtower:latest
forecast:
  forecast: forecast.solar
  forecast_azimuth1: '180'
  forecast_declination1: '30'
  forecast_kwp1: '10'
  forecast_latitude: '51.3'
  forecast_longitude: '9.5'
  forecast_roofs: '1'
  image: ghcr.io/solectrus/forecast-collector:latest
  measurement: Forecast
senec:
  adapter: local
  host: 192.168.178.42
  interval: '5'
  language: de
  schema: https
  version: v3
tibber:
  image: ghcr.io/solectrus/tibber-collector:latest
  measurement: Tibber
  token: test-tibber-token
senec_charger:
  dry_run: false
  forecast_threshold: '20'
  image: ghcr.io/solectrus/senec-charger:latest
  interval: '3600'
  price_max: '70'
  price_time_range: '4'
sensors:
  battery_charging_power:
    source: senec
  battery_discharging_power:
    source: senec
  battery_soc:
    source: senec
  grid_export_power:
    source: senec
  grid_import_power:
    source: senec
  house_power:
    source: senec
  inverter_power:
    source: senec
  inverter_power_forecast:
    field: watts
    measurement: Forecast
    source: forecast
helios:
  image: ghcr.io/solectrus/helios:latest
