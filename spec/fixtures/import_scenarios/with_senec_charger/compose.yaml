name: solectrus

services:

  # ┌──────────────────────────────────────────────────────────┐
  # │  SOLECTRUS — Web application                             │
  # └──────────────────────────────────────────────────────────┘
  #
  dashboard:
    image: ghcr.io/solectrus/solectrus:latest
    environment:
    - TZ
    - INSTALLATION_DATE
    - INFLUX_TOKEN
    - INFLUX_ORG
    - INFLUX_BUCKET
    - SECRET_KEY_BASE
    - ADMIN_PASSWORD
    - APP_HOST
    - FORCE_SSL
    - WEB_CONCURRENCY
    - REDIS_URL=redis://redis:6379/1
    - INFLUX_HOST=influxdb
    - DB_HOST=postgresql
    - DB_USER=postgres
    - DB_PASSWORD=${POSTGRES_PASSWORD}
    - DB_DATABASE=solectrus
    - INFLUX_SENSOR_BATTERY_CHARGING_POWER
    - INFLUX_SENSOR_BATTERY_DISCHARGING_POWER
    - INFLUX_SENSOR_BATTERY_SOC
    - INFLUX_SENSOR_GRID_EXPORT_POWER
    - INFLUX_SENSOR_GRID_IMPORT_POWER
    - INFLUX_SENSOR_HOUSE_POWER
    - INFLUX_SENSOR_INVERTER_POWER
    - INFLUX_SENSOR_INVERTER_POWER_FORECAST
    ports:
    - 3000:3000
    labels:
    - com.centurylinklabs.watchtower.scope=solectrus
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
      influxdb:
        condition: service_healthy
    healthcheck:
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
      start_interval: 2s
      test:
      - CMD-SHELL
      - nc -z 127.0.0.1 3000 || exit 1
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  # ┌───────────────────────────────────────────────────────────┐
  # │  InfluxDB — Time-series database for sensor measurements  │
  # └───────────────────────────────────────────────────────────┘
  #
  influxdb:
    image: influxdb:2-alpine
    environment:
    - TZ
    - DOCKER_INFLUXDB_INIT_MODE=setup
    - DOCKER_INFLUXDB_INIT_USERNAME=admin
    - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUX_PASSWORD}
    - DOCKER_INFLUXDB_INIT_ORG=${INFLUX_ORG}
    - DOCKER_INFLUXDB_INIT_BUCKET=${INFLUX_BUCKET}
    - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUX_TOKEN}
    volumes:
    - "${INFLUX_VOLUME_PATH}:/var/lib/influxdb2"
    ports:
    - 8086:8086
    labels:
    - com.centurylinklabs.watchtower.scope=solectrus
    healthcheck:
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 2s
      test:
      - CMD
      - influx
      - ping
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  # ┌──────────────────────────────────────────────────────────────────────────────────────────┐
  # │  PostgreSQL — Relational database for daily summaries, electricity prices, and settings  │
  # └──────────────────────────────────────────────────────────────────────────────────────────┘
  #
  postgresql:
    image: postgres:18-alpine
    environment:
    - TZ
    - POSTGRES_PASSWORD
    - POSTGRES_DB=solectrus
    volumes:
    - "${DB_VOLUME_PATH}:/var/lib/postgresql"
    labels:
    - com.centurylinklabs.watchtower.scope=solectrus
    healthcheck:
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 2s
      test:
      - CMD-SHELL
      - pg_isready -U postgres
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  # ┌──────────────────────────────────────────────────────────┐
  # │  Redis — In-memory store for caching                     │
  # └──────────────────────────────────────────────────────────┘
  #
  redis:
    image: redis:8-alpine
    environment:
    - TZ
    volumes:
    - "${REDIS_VOLUME_PATH}:/data"
    labels:
    - com.centurylinklabs.watchtower.scope=solectrus
    healthcheck:
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
      start_interval: 2s
      test:
      - CMD
      - redis-cli
      - ping
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  # ┌───────────────────────────────────────────────────────────────────┐
  # │  SENEC Collector — Reads data from SENEC battery storage systems  │
  # └───────────────────────────────────────────────────────────────────┘
  #
  senec-collector:
    image: ghcr.io/solectrus/senec-collector:latest
    environment:
    - TZ
    - INFLUX_TOKEN
    - INFLUX_ORG
    - INFLUX_BUCKET
    - INFLUX_MEASUREMENT_SENEC
    - SENEC_ADAPTER
    - SENEC_INTERVAL
    - INFLUX_HOST=influxdb
    - SENEC_HOST
    - SENEC_SCHEMA
    - SENEC_LANGUAGE
    labels:
    - com.centurylinklabs.watchtower.scope=solectrus
    depends_on:
      influxdb:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  # ┌───────────────────────────────────────────────────────────┐
  # │  Forecast Collector — Fetches solar production forecasts  │
  # └───────────────────────────────────────────────────────────┘
  #
  forecast-collector:
    image: ghcr.io/solectrus/forecast-collector:latest
    environment:
    - TZ
    - INFLUX_TOKEN
    - INFLUX_ORG
    - INFLUX_BUCKET
    - INFLUX_HOST=influxdb
    - INFLUX_MEASUREMENT=${INFLUX_MEASUREMENT_FORECAST}
    - FORECAST_PROVIDER
    - FORECAST_LATITUDE
    - FORECAST_LONGITUDE
    - FORECAST_INTERVAL
    - FORECAST_DECLINATION
    - FORECAST_AZIMUTH
    - FORECAST_KWP
    labels:
    - com.centurylinklabs.watchtower.scope=solectrus
    depends_on:
      influxdb:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  # ┌──────────────────────────────────────────────────────────┐
  # │  Power Splitter — Calculates derived power values        │
  # └──────────────────────────────────────────────────────────┘
  #
  power-splitter:
    image: ghcr.io/solectrus/power-splitter:latest
    environment:
    - TZ
    - INSTALLATION_DATE
    - INFLUX_TOKEN
    - INFLUX_ORG
    - INFLUX_BUCKET
    - POSTGRES_PASSWORD
    - POWER_SPLITTER_INTERVAL
    - INFLUX_HOST=influxdb
    - REDIS_URL=redis://redis:6379/1
    - DB_HOST=postgresql
    - DB_USER=postgres
    - DB_PASSWORD=${POSTGRES_PASSWORD}
    - INFLUX_SENSOR_BATTERY_CHARGING_POWER
    - INFLUX_SENSOR_BATTERY_DISCHARGING_POWER
    - INFLUX_SENSOR_BATTERY_SOC
    - INFLUX_SENSOR_GRID_EXPORT_POWER
    - INFLUX_SENSOR_GRID_IMPORT_POWER
    - INFLUX_SENSOR_HOUSE_POWER
    - INFLUX_SENSOR_INVERTER_POWER
    - INFLUX_SENSOR_INVERTER_POWER_FORECAST
    labels:
    - com.centurylinklabs.watchtower.scope=solectrus
    depends_on:
      influxdb:
        condition: service_healthy
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  # ┌──────────────────────────────────────────────────────────┐
  # │  Watchtower — Automatic Docker image updates             │
  # └──────────────────────────────────────────────────────────┘
  #
  watchtower:
    image: nickfedor/watchtower:latest
    environment:
    - TZ
    - WATCHTOWER_POLL_INTERVAL
    - WATCHTOWER_SCOPE
    - WATCHTOWER_CLEANUP
    volumes:
    - "/var/run/docker.sock:/var/run/docker.sock"
    labels:
    - com.centurylinklabs.watchtower.scope=solectrus
    healthcheck:
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
      start_interval: 2s
      test:
      - CMD
      - "/watchtower"
      - "--health-check"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  # ┌──────────────────────────────────────────────────────────┐
  # │  HELIOS — Configuration management UI                    │
  # └──────────────────────────────────────────────────────────┘
  #
  helios:
    image: ghcr.io/solectrus/helios:develop
    environment:
    - ADMIN_PASSWORD
    - SECRET_KEY_BASE
    volumes:
    - ".:/data"
    - "/var/run/docker.sock:/var/run/docker.sock"
    ports:
    - 3999:3000
    labels:
    - com.centurylinklabs.watchtower.scope=solectrus
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  # ┌────────────────────────────────────────────────────────────┐
  # │  Unmanaged service (preserved from existing installation)  │
  # └────────────────────────────────────────────────────────────┘
  #
  senec-charger:
    image: ghcr.io/solectrus/senec-charger:latest
    environment:
    - TZ
    - INFLUX_BUCKET
    - INFLUX_HOST=influxdb
    - INFLUX_MEASUREMENT_FORECAST=${INFLUX_MEASUREMENT_FORECAST}
    - INFLUX_MEASUREMENT_PRICES=Tibber
    - INFLUX_ORG
    - INFLUX_TOKEN=${INFLUX_TOKEN}
    - CHARGER_DRY_RUN
    - CHARGER_FORECAST_THRESHOLD
    - CHARGER_INTERVAL
    - CHARGER_PRICE_MAX
    - CHARGER_PRICE_TIME_RANGE
    - SENEC_HOST
    - SENEC_SCHEMA
    depends_on:
      influxdb:
        condition: service_healthy
    restart: unless-stopped

networks:
  default:
    name: solectrus_default
