name: solectrus

services:

  # +----------------------------------------------------------+
  # |  SOLECTRUS — Web application                             |
  # +----------------------------------------------------------+
  #
  dashboard:
    image: ghcr.io/solectrus/solectrus:latest
    environment:
    - TZ
    - ADMIN_PASSWORD
    - APP_HOST
    - CO2_EMISSION_FACTOR
    - CURRENCY
    - DB_HOST=postgresql
    - DB_PASSWORD=${POSTGRES_PASSWORD}
    - DB_USER=postgres
    - FORCE_SSL
    - INFLUX_BUCKET
    - INFLUX_EXCLUDE_FROM_HOUSE_POWER
    - INFLUX_HOST=influxdb
    - INFLUX_ORG
    - INFLUX_SENSOR_BATTERY_CHARGING_POWER
    - INFLUX_SENSOR_BATTERY_DISCHARGING_POWER
    - INFLUX_SENSOR_BATTERY_SOC
    - INFLUX_SENSOR_CAR_BATTERY_SOC
    - INFLUX_SENSOR_GRID_EXPORT_POWER
    - INFLUX_SENSOR_GRID_IMPORT_POWER
    - INFLUX_SENSOR_HEATPUMP_HEATING_POWER
    - INFLUX_SENSOR_HEATPUMP_STATUS
    - INFLUX_SENSOR_HEATPUMP_TANK_TEMP
    - INFLUX_SENSOR_HOUSE_POWER
    - INFLUX_SENSOR_INVERTER_POWER
    - INFLUX_SENSOR_OUTDOOR_TEMP
    - INFLUX_SENSOR_WALLBOX_CAR_CONNECTED
    - INFLUX_SENSOR_WALLBOX_POWER
    - INFLUX_TOKEN=${INFLUX_TOKEN_READ}
    - INSTALLATION_DATE
    - REDIS_URL=redis://redis:6379/1
    - SECRET_KEY_BASE
    - WEB_CONCURRENCY
    ports:
    - 3000:3000
    labels:
    - com.centurylinklabs.watchtower.scope=solectrus
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
      influxdb:
        condition: service_healthy
    healthcheck:
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
      start_interval: 2s
      test:
      - CMD-SHELL
      - nc -z 127.0.0.1 3000 || exit 1
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  # +-----------------------------------------------------------+
  # |  InfluxDB — Time-series database for sensor measurements  |
  # +-----------------------------------------------------------+
  #
  influxdb:
    image: influxdb:2-alpine
    environment:
    - TZ
    - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUX_ADMIN_TOKEN}
    - DOCKER_INFLUXDB_INIT_BUCKET=${INFLUX_BUCKET}
    - DOCKER_INFLUXDB_INIT_MODE=setup
    - DOCKER_INFLUXDB_INIT_ORG=${INFLUX_ORG}
    - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUX_PASSWORD}
    - DOCKER_INFLUXDB_INIT_USERNAME=admin
    volumes:
    - "${INFLUX_VOLUME_PATH}:/var/lib/influxdb2"
    - "./influx-backup-staging:/influx-backup-staging"
    labels:
    - com.centurylinklabs.watchtower.scope=solectrus
    healthcheck:
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 2s
      test:
      - CMD
      - influx
      - ping
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  # +------------------------------------------------------------------------------------------+
  # |  PostgreSQL — Relational database for daily summaries, electricity prices, and settings  |
  # +------------------------------------------------------------------------------------------+
  #
  postgresql:
    image: postgres:18-alpine
    environment:
    - TZ
    - POSTGRES_DB=solectrus
    - POSTGRES_PASSWORD
    volumes:
    - "${DB_VOLUME_PATH}:/var/lib/postgresql"
    labels:
    - com.centurylinklabs.watchtower.scope=solectrus
    healthcheck:
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 2s
      test:
      - CMD-SHELL
      - pg_isready -U postgres
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  # +----------------------------------------------------------+
  # |  Redis — In-memory store for caching                     |
  # +----------------------------------------------------------+
  #
  redis:
    image: redis:8-alpine
    environment:
    - TZ
    volumes:
    - "${REDIS_VOLUME_PATH}:/data"
    labels:
    - com.centurylinklabs.watchtower.scope=solectrus
    healthcheck:
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
      start_interval: 2s
      test:
      - CMD
      - redis-cli
      - ping
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  # +-------------------------------------------------------------------+
  # |  SENEC Collector — Reads data from SENEC battery storage systems  |
  # +-------------------------------------------------------------------+
  #
  senec-collector:
    image: ghcr.io/solectrus/senec-collector:latest
    environment:
    - TZ
    - INFLUX_BUCKET
    - INFLUX_HOST=influxdb
    - INFLUX_MEASUREMENT=${INFLUX_MEASUREMENT_SENEC}
    - INFLUX_ORG
    - INFLUX_TOKEN=${INFLUX_TOKEN_WRITE}
    - SENEC_ADAPTER
    - SENEC_HOST
    - SENEC_INTERVAL
    - SENEC_LANGUAGE
    - SENEC_SCHEMA
    labels:
    - com.centurylinklabs.watchtower.scope=solectrus
    depends_on:
      influxdb:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  # +-----------------------------------------------------------+
  # |  MQTT Collector — Receives sensor data via MQTT protocol  |
  # +-----------------------------------------------------------+
  #
  mqtt-collector:
    image: ghcr.io/solectrus/mqtt-collector:latest
    environment:
    - TZ
    - INFLUX_BUCKET
    - INFLUX_HOST=influxdb
    - INFLUX_ORG
    - INFLUX_TOKEN=${INFLUX_TOKEN_WRITE}
    - MAPPING_0_FIELD
    - MAPPING_0_JSON_KEY
    - MAPPING_0_MEASUREMENT
    - MAPPING_0_TOPIC
    - MAPPING_0_TYPE
    - MAPPING_1_FIELD
    - MAPPING_1_JSON_FORMULA
    - MAPPING_1_MEASUREMENT
    - MAPPING_1_TOPIC
    - MAPPING_1_TYPE
    - MAPPING_2_FIELD
    - MAPPING_2_JSON_FORMULA
    - MAPPING_2_MEASUREMENT
    - MAPPING_2_TOPIC
    - MAPPING_2_TYPE
    - MAPPING_3_FIELD
    - MAPPING_3_JSON_KEY
    - MAPPING_3_MEASUREMENT
    - MAPPING_3_TOPIC
    - MAPPING_3_TYPE
    - MAPPING_4_FIELD
    - MAPPING_4_JSON_KEY
    - MAPPING_4_MEASUREMENT
    - MAPPING_4_TOPIC
    - MAPPING_4_TYPE
    - MAPPING_5_FIELD
    - MAPPING_5_MEASUREMENT
    - MAPPING_5_TOPIC
    - MAPPING_5_TYPE
    - MAPPING_6_FIELD
    - MAPPING_6_JSON_KEY
    - MAPPING_6_MEASUREMENT
    - MAPPING_6_TOPIC
    - MAPPING_6_TYPE
    - MQTT_HOST
    - MQTT_PASSWORD
    - MQTT_PORT
    - MQTT_USERNAME
    labels:
    - com.centurylinklabs.watchtower.scope=solectrus
    depends_on:
      influxdb:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  # +----------------------------------------------------------+
  # |  Power Splitter — Calculates derived power values        |
  # +----------------------------------------------------------+
  #
  power-splitter:
    image: ghcr.io/solectrus/power-splitter:latest
    environment:
    - TZ
    - DB_HOST=postgresql
    - DB_PASSWORD=${POSTGRES_PASSWORD}
    - DB_USER=postgres
    - INFLUX_BUCKET
    - INFLUX_EXCLUDE_FROM_HOUSE_POWER
    - INFLUX_HOST=influxdb
    - INFLUX_ORG
    - INFLUX_SENSOR_BATTERY_CHARGING_POWER
    - INFLUX_SENSOR_BATTERY_DISCHARGING_POWER
    - INFLUX_SENSOR_BATTERY_SOC
    - INFLUX_SENSOR_CAR_BATTERY_SOC
    - INFLUX_SENSOR_GRID_EXPORT_POWER
    - INFLUX_SENSOR_GRID_IMPORT_POWER
    - INFLUX_SENSOR_HEATPUMP_HEATING_POWER
    - INFLUX_SENSOR_HEATPUMP_STATUS
    - INFLUX_SENSOR_HEATPUMP_TANK_TEMP
    - INFLUX_SENSOR_HOUSE_POWER
    - INFLUX_SENSOR_INVERTER_POWER
    - INFLUX_SENSOR_OUTDOOR_TEMP
    - INFLUX_SENSOR_WALLBOX_CAR_CONNECTED
    - INFLUX_SENSOR_WALLBOX_POWER
    - INFLUX_TOKEN=${INFLUX_TOKEN_READWRITE}
    - INSTALLATION_DATE
    - POSTGRES_PASSWORD
    - POWER_SPLITTER_INTERVAL
    - REDIS_URL=redis://redis:6379/1
    labels:
    - com.centurylinklabs.watchtower.scope=solectrus
    depends_on:
      influxdb:
        condition: service_healthy
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  # +----------------------------------------------------------+
  # |  Watchtower — Automatic Docker image updates             |
  # +----------------------------------------------------------+
  #
  watchtower:
    image: nickfedor/watchtower:latest
    environment:
    - TZ
    - WATCHTOWER_CLEANUP
    - WATCHTOWER_POLL_INTERVAL
    - WATCHTOWER_SCOPE
    volumes:
    - "/var/run/docker.sock:/var/run/docker.sock"
    labels:
    - com.centurylinklabs.watchtower.scope=solectrus
    healthcheck:
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
      start_interval: 2s
      test:
      - CMD
      - "/watchtower"
      - "--health-check"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  # +----------------------------------------------------------+
  # |  HELIOS — Configuration management UI                    |
  # +----------------------------------------------------------+
  #
  helios:
    image: ghcr.io/solectrus/helios:latest
    environment:
    - TZ
    - ADMIN_PASSWORD
    - SECRET_KEY_BASE
    volumes:
    - ".:/data"
    - "/var/run/docker.sock:/var/run/docker.sock"
    - "/sys/fs/cgroup:/host/sys/fs/cgroup:ro"
    ports:
    - 3999:3000
    labels:
    - com.centurylinklabs.watchtower.scope=solectrus
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

networks:
  default:
    name: solectrus_default
