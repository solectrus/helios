power_splitter:
  image: ghcr.io/solectrus/power-splitter:latest
helios:
  image: ghcr.io/solectrus/helios:latest
_unmanaged:
  env_vars:
    SHELLY_GEN_DRYER2: '2'
    SHELLY_GEN_GSA: '2'
    SHELLY_GEN_MW: '2'
    SHELLY_GEN_OVEN: '2'
    SHELLY_GEN_OVEN2: '2'
    SHELLY_GEN_TV: '2'
    SHELLY_GEN_WA: '2'
    SHELLY_GEN_WA2: '2'
  services:
    senec-charger:
      depends_on:
        influxdb:
          condition: service_healthy
      environment:
      - TZ
      - INFLUX_BUCKET
      - INFLUX_HOST=influxdb
      - INFLUX_MEASUREMENT_FORECAST=${INFLUX_MEASUREMENT_FORECAST}
      - INFLUX_MEASUREMENT_PRICES=${INFLUX_MEASUREMENT_PRICES}
      - INFLUX_ORG
      - INFLUX_TOKEN=${INFLUX_TOKEN_READ}
      - CHARGER_DRY_RUN
      - CHARGER_FORECAST_THRESHOLD
      - CHARGER_INTERVAL
      - CHARGER_PRICE_MAX
      - CHARGER_PRICE_TIME_RANGE
      - SENEC_HOST
      - SENEC_SCHEMA
      image: ghcr.io/solectrus/senec-charger:develop
      links:
      - influxdb
      restart: always
    tibber-collector:
      depends_on:
        influxdb:
          condition: service_healthy
      environment:
      - INFLUX_BUCKET
      - INFLUX_HOST=influxdb
      - INFLUX_MEASUREMENT=${INFLUX_MEASUREMENT_PRICES}
      - INFLUX_ORG
      - INFLUX_TOKEN=${INFLUX_TOKEN_WRITE}
      - TIBBER_INTERVAL
      - TIBBER_TOKEN
      image: ghcr.io/solectrus/tibber-collector:develop
      links:
      - influxdb
      restart: always
