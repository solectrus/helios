---
_schema_version: 2
system:
  admin_password: my-admin-password
  app_host: 192.168.1.91
  installation_date: '2022-09-01'
  secret_key_base: my-secret-key-base
  timezone: Europe/Berlin
dashboard:
  frame_ancestors: http://192.168.1.90:8123
  image: ghcr.io/solectrus/solectrus:develop
  influx_poll_interval: '5'
postgresql:
  image: postgres:18-alpine
  password: my-secret-db-password
  volume_path: "/home/pi/solectrus/postgresql"
influxdb:
  bucket: my-solectrus-bucket
  image: influxdb:2.7-alpine
  org: solectrus
  password: my-influxdb-password
  token: my-influxdb-token
  volume_path: "/home/pi/solectrus/influxdb"
redis:
  image: redis:7-alpine
  volume_path: "/home/pi/solectrus/redis"
watchtower:
  image: nickfedor/watchtower:latest
forecast:
  forecast: pvnode
  forecast_declination1: '24'
  forecast_declination2: '24'
  forecast_declination3: '30'
  forecast_interval: '3600'
  forecast_kwp1: '8.910'
  forecast_kwp2: '2.835'
  forecast_kwp3: '0.820'
  forecast_latitude: '48.12345'
  forecast_longitude: '9.12345'
  forecast_pvnode_apikey: my-pvnode-apikey
  forecast_pvnode_azimuth1: '87'
  forecast_pvnode_azimuth2: '267'
  forecast_pvnode_azimuth3: '180'
  forecast_pvnode_paid: 'TRUE'
  forecast_roofs: '3'
  measurement: forecast
senec:
  adapter: local
  host: 192.168.108.200
  interval: '5'
  language: de
  schema: https
  version: v3
mqtt:
  mappings:
  - field: temperature
    measurement: ws2900_v2_01_18_outdoor_temperature
    topic: homeassistant/sensor/ws2900_v2_01_18_outdoor_temperature/state
    type: float
  mqtt_host: 192.168.1.90
  mqtt_password: my-mqtt-password
  mqtt_port: '1883'
  mqtt_username: my-mqtt-username
shelly:
  connection: local
  interval: '5'
sensors:
  battery_charging_power:
    source: senec
  battery_discharging_power:
    source: senec
  battery_soc:
    source: senec
  case_temp:
    source: senec
  custom_power_01:
