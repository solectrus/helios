  grid_export_limit:
    field: power_ratio
    measurement: my-pv-measurement
    source: external
  grid_export_power:
    field: grid_power_minus
    measurement: my-pv-measurement
    mqtt_formula: IF({value} < 0, -{value}, 0)
    mqtt_payload_type: integer
    mqtt_topic: evcc/site/grid/power
    source: mqtt
  grid_import_power:
    field: grid_power_plus
    measurement: my-pv-measurement
    mqtt_formula: IF({value} > 0, {value}, 0)
    mqtt_payload_type: integer
    mqtt_topic: evcc/site/grid/power
    source: mqtt
  heatpump_heating_power:
    field: Buderus_Kompressor_power
    measurement: my-pv-measurement
    mqtt_payload_type: float
    mqtt_topic: Buderus/Kompressor_power
    source: mqtt
  heatpump_power:
    field: heatpump_power
    measurement: my-pv-measurement
    mqtt_payload_type: integer
    mqtt_topic: evcc/loadpoints/2/chargePower
