mqtt:
  mqtt_host: 10.31.22.46
  mqtt_password: JJJJJ
  mqtt_port: '1883'
  mqtt_ssl: 'false'
  mqtt_username: HHHHH
shelly:
  connection: local
  interval: '5'
  mode: essential
sensors:
  battery_charging_power:
    field: bat_power_plus
    measurement: my-pv-measurement
    mqtt_formula: IF({value} < 0, -{value}, 0)
    mqtt_payload_type: integer
    mqtt_topic: evcc/site/battery/devices/1/power
    source: mqtt
  battery_discharging_power:
    field: bat_power_minus
    measurement: my-pv-measurement
    mqtt_formula: IF({value} > 0, {value}, 0)
    mqtt_payload_type: integer
    mqtt_topic: evcc/site/battery/devices/1/power
    source: mqtt
  battery_soc:
    field: bat_fuel_charge
    measurement: my-pv-measurement
    mqtt_payload_type: float
    mqtt_topic: evcc/site/battery/devices/1/soc
    source: mqtt
  car_battery_soc:
    field: evoque_soc
    measurement: my-pv-measurement
    mqtt_payload_type: float
    mqtt_topic: evcc/loadpoints/1/vehicleSoc
    source: mqtt
  case_temp:
    field: case_temp
    measurement: my-pv-measurement
    mqtt_json_path: "$.curflowtemp"
    mqtt_payload_type: float
    mqtt_topic: ems-esp/boiler_data
    source: mqtt
  custom_power_01:
    field: power
    measurement: wash
    name: wash
    shelly_host: 10.31.22.35
