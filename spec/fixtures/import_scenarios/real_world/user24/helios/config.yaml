    SHELLY_GEN_COOLER: '2'
    SHELLY_GEN_DISH: '2'
    SHELLY_GEN_DRYER: '1'
    SHELLY_GEN_FREEZER: '3'
    SHELLY_GEN_PCTECHNIK: '3'
    SHELLY_GEN_WASH: '1'
    SHELLY_GEN_WINE: '3'
