# ============================================================
# Managed by HELIOS — DO NOT EDIT MANUALLY!
#
# This file stores your HELIOS configuration.
# It is rewritten whenever you apply changes in HELIOS.
# Use the HELIOS web interface to modify your configuration.
# ============================================================
---
_schema_version: 4
system:
  admin_password: my-admin-password
  app_host: 192.168.0.19
  installation_date: '2023-05-01'
  secret_key_base: my-secret-key-base
  timezone: Europe/Berlin
dashboard:
  image: ghcr.io/solectrus/solectrus:1-0-beta
postgresql:
  image: postgres:17-alpine
  password: my-secret-db-password
influxdb:
  bucket: solectrus
  image: influxdb:2.7-alpine
  org: solectrus
  password: my-influx-password
  publish_port: true
  token_admin: my-super-secret-admin-token
  token_read: my-super-secret-admin-token
  token_readwrite: my-super-secret-admin-token
  token_write: my-super-secret-admin-token
redis:
  image: redis:8-alpine
watchtower:
  image: containrrr/watchtower:latest
forecast:
  forecast: forecast.solar
  forecast_azimuth1: "-90"
  forecast_declination1: '40'
  forecast_interval: '900'
  forecast_kwp1: '9'
  forecast_latitude: '52.00000'
  forecast_longitude: '13.00000'
  forecast_roofs: '1'
  image: ghcr.io/solectrus/forecast-collector:latest
  measurement: forecast
senec:
  adapter: local
  host: 192.168.0.66
  interval: '5'
  language: de
  schema: https
  version: v3
mqtt:
  mappings:
  - field: test
    measurement: test
    topic: foo/bar/baz
    type: integer
  mqtt_host: ''
  mqtt_password: ''
  mqtt_port: '1883'
  mqtt_ssl: 'false'
  mqtt_username: ''
tibber:
  image: ghcr.io/solectrus/tibber-collector:latest
  measurement: tibber
  token: my-tibber-token
senec_charger:
  dry_run: false
  forecast_threshold: '20'
  image: ghcr.io/solectrus/senec-charger:latest
  interval: '3600'
  price_max: '85'
  price_time_range: '4'
shelly:
  connection: local
  devices:
  - host: 192.168.2.51
    measurement: gas
    name: gsa
  interval: '5'
sensors:
  battery_charging_power:
    source: senec
  battery_discharging_power:
    source: senec
  battery_soc:
    source: senec
  case_temp:
    source: senec
  custom_power_01:
    field: power
    measurement: airfry
    name: airfry
    shelly_host: 192.168.2.50
    source: shelly
  custom_power_02:
    field: power
    measurement: mw
    name: mw
    shelly_host: 192.168.2.52
    source: shelly
  custom_power_03:
    field: power
    measurement: gsa
    name: gsa
    source: external
  custom_power_04:
    field: power
    measurement: it
    name: it
    shelly_host: 192.168.3.53
    source: shelly
  custom_power_05:
    field: power
    measurement: server
    name: server
    shelly_host: 192.168.2.54
    source: shelly
  grid_export_limit:
    source: senec
  grid_export_power:
    source: senec
  grid_import_power:
    source: senec
  house_power:
    source: senec
  inverter_power_1:
    field: inverter_power
    measurement: SENEC
    source: senec
  inverter_power_2:
    field: power
    is_balcony: true
    measurement: Fence
    shelly_host: 192.168.2.55
    source: shelly
  inverter_power_forecast:
    source: forecast
  system_status:
    source: senec
  system_status_ok:
    source: senec
  wallbox_power:
    source: senec
ingest:
  image: ghcr.io/solectrus/ingest:latest
power_splitter:
  image: ghcr.io/solectrus/power-splitter:latest
helios:
  image: ghcr.io/solectrus/helios:latest
