    - MAPPING_22_TYPE
    - MAPPING_23_FIELD
    - MAPPING_23_MEASUREMENT
    - MAPPING_23_NULL_TO_ZERO
    - MAPPING_23_TOPIC
    - MAPPING_23_TYPE
    - MAPPING_24_FIELD
    - MAPPING_24_MEASUREMENT
    - MAPPING_24_NULL_TO_ZERO
    - MAPPING_24_TOPIC
