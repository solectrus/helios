    - MAPPING_5_TYPE
    - MAPPING_6_FIELD
    - MAPPING_6_JSON_KEY
    - MAPPING_6_MEASUREMENT
    - MAPPING_6_NULL_TO_ZERO
    - MAPPING_6_TOPIC
    - MAPPING_6_TYPE
    - MAPPING_7_FIELD
    - MAPPING_7_JSON_KEY
    - MAPPING_7_MEASUREMENT
    - MAPPING_7_NULL_TO_ZERO
    - MAPPING_7_TOPIC
    - MAPPING_7_TYPE
    - MAPPING_8_FIELD
    - MAPPING_8_JSON_KEY
    - MAPPING_8_MEASUREMENT
    - MAPPING_8_NULL_TO_ZERO
    - MAPPING_8_TOPIC
    - MAPPING_8_TYPE
    - MAPPING_9_FIELD
    - MAPPING_9_JSON_KEY
    - MAPPING_9_MEASUREMENT
    - MAPPING_9_NULL_TO_ZERO
    - MAPPING_9_TOPIC
    - MAPPING_9_TYPE
    - MAPPING_10_FIELD
    - MAPPING_10_JSON_KEY
    - MAPPING_10_MEASUREMENT
    - MAPPING_10_NULL_TO_ZERO
    - MAPPING_10_TOPIC
    - MAPPING_10_TYPE
    - MAPPING_11_FIELD
    - MAPPING_11_JSON_KEY
    - MAPPING_11_MEASUREMENT
    - MAPPING_11_NULL_TO_ZERO
    - MAPPING_11_TOPIC
    - MAPPING_11_TYPE
    - MAPPING_12_FIELD
    - MAPPING_12_JSON_KEY
    - MAPPING_12_MEASUREMENT
    - MAPPING_12_NULL_TO_ZERO
    - MAPPING_12_TOPIC
    - MAPPING_12_TYPE
    - MAPPING_13_FIELD
    - MAPPING_13_JSON_KEY
    - MAPPING_13_MEASUREMENT
    - MAPPING_13_NULL_TO_ZERO
    - MAPPING_13_TOPIC
    - MAPPING_13_TYPE
    - MAPPING_14_FIELD
    - MAPPING_14_JSON_KEY
    - MAPPING_14_MEASUREMENT
    - MAPPING_14_NULL_TO_ZERO
    - MAPPING_14_TOPIC
