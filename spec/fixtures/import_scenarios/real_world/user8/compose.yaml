    - MAPPING_25_FIELD
    - MAPPING_25_MEASUREMENT
    - MAPPING_25_NULL_TO_ZERO
    - MAPPING_25_TOPIC
    - MAPPING_25_TYPE
    - MAPPING_26_FIELD
    - MAPPING_26_JSON_KEY
    - MAPPING_26_MEASUREMENT
    - MAPPING_26_TOPIC
    - MAPPING_26_TYPE
    - MAPPING_27_FIELD
    - MAPPING_27_MEASUREMENT
    - MAPPING_27_TOPIC
    - MAPPING_27_TYPE
    - MAPPING_28_FIELD
    - MAPPING_28_MEASUREMENT
