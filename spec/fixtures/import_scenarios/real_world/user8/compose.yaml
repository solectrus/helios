    - MAPPING_17_TYPE
    - MAPPING_18_FIELD
    - MAPPING_18_MEASUREMENT
    - MAPPING_18_NULL_TO_ZERO
    - MAPPING_18_TOPIC
    - MAPPING_18_TYPE
    - MAPPING_19_FIELD
    - MAPPING_19_JSON_FORMULA
    - MAPPING_19_MEASUREMENT
    - MAPPING_19_TOPIC
    - MAPPING_19_TYPE
    - MAPPING_20_FIELD
    - MAPPING_20_JSON_KEY
    - MAPPING_20_MEASUREMENT
    - MAPPING_20_TOPIC
    - MAPPING_20_TYPE
    - MAPPING_21_FIELD
    - MAPPING_21_MEASUREMENT
    - MAPPING_21_NULL_TO_ZERO
    - MAPPING_21_TOPIC
