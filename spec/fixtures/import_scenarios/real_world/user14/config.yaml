# ============================================================
# Managed by HELIOS — DO NOT EDIT MANUALLY!
#
# This file stores your HELIOS configuration.
# It is rewritten whenever you apply changes in HELIOS.
# Use the HELIOS web interface to modify your configuration.
# ============================================================
---
_schema_version: 3
system:
  admin_password: my-admin-password
  app_host: 192.168.1.39
  installation_date: '2021-01-01'
  secret_key_base: ny-secret-key-base
  timezone: Europe/Berlin
dashboard:
  image: ghcr.io/solectrus/solectrus:latest
  influx_poll_interval: '5'
postgresql:
  image: postgres:18-alpine
  password: my-postgres-password
influxdb:
  bucket: solectrus
  image: influxdb:2-alpine
  org: solectrus
  password: my-influx-password
  token_admin: my-influx-admin-token
  token_read: my-influx-read-token
  token_readwrite: my-influx-admin-token
  token_write: my-influx-write-token
redis:
  image: redis:8-alpine
watchtower:
  image: nickfedor/watchtower:latest
forecast:
  forecast: forecast.solar
  forecast_azimuth1: '90'
  forecast_azimuth2: "-90"
  forecast_azimuth3: "-90"
  forecast_azimuth4: "-90"
  forecast_declination1: '40'
  forecast_declination2: '40'
  forecast_declination3: '40'
  forecast_declination4: '15'
  forecast_interval: '3600'
  forecast_kwp1: '4.97'
  forecast_kwp2: '4.615'
  forecast_kwp3: '5.53'
  forecast_kwp4: '2.37'
  forecast_latitude: '0.00000'
  forecast_longitude: '0.00000'
  forecast_roofs: '4'
  measurement: Forecast
senec:
  adapter: local
  host: 192.168.1.33
  version: v3
mqtt:
  mqtt_host: 192.168.1.39
  mqtt_password: XXXXX
  mqtt_port: '1883'
  mqtt_ssl: 'false'
  mqtt_username: XXXXX
sensors:
  battery_charging_power:
    source: senec
  battery_discharging_power:
    source: senec
  battery_soc:
    source: senec
  case_temp:
    source: senec
  custom_power_01:
    field: power
    measurement: MAIN_APARTMENT_POWER_CALCULATED
    name: MAIN_APARTMENT_POWER_CALCULATED
    source: external
  custom_power_02:
    field: power
    measurement: GRANNY_FLAT_POWER_CALCULATED
    name: GRANNY_FLAT_POWER_CALCULATED
    source: external
  grid_export_limit:
    field: export_limit
    measurement: SENEC_grid
    source: external
  grid_export_power:
    source: senec
  grid_import_power:
    source: senec
  heatpump_power:
    field: power
    measurement: HEATPUMP_POWER_CALCULATED
    source: external
  house_power:
    field: power
    measurement: HOUSE_POWER_CALCULATED
    source: external
  inverter_power_1:
    source: senec
  inverter_power_2:
    source: senec
  inverter_power_3:
    field: power
    measurement: FRONIUS_inverter_1
    source: external
  inverter_power_4:
    field: power
    measurement: FRONIUS_inverter_2
    source: external
  system_status:
    source: senec
  system_status_ok:
    source: senec
  wallbox_power:
    source: senec
power_splitter:
  image: ghcr.io/solectrus/power-splitter:latest
