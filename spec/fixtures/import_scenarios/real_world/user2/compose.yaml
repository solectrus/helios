# ============================================================
# DO NOT EDIT THIS FILE.
#
# This file is generated by HELIOS. Any manual change WILL be
# overwritten — silently, without backup — the next time HELIOS
# applies a configuration. In the worst case your edit breaks
# the stack and HELIOS can no longer recover it.
#
# Change every setting through the HELIOS web interface.
#
# Missing a setting? HELIOS is actively developed and can be
# extended — suggest it at:
# https://github.com/solectrus/helios/issues
#
# HELIOS fits the vast majority of setups. For a very
# specialized configuration, managing compose.yaml + .env
# by hand instead remains a valid alternative.
# ============================================================

name: solectrus

services:

  # ┌──────────────────────────────────────────────────────────┐
  # │  SOLECTRUS — Web application                             │
  # └──────────────────────────────────────────────────────────┘
  #
  dashboard:
    image: ghcr.io/solectrus/solectrus:power-balance-chart
    environment:
    - TZ
    - ADMIN_PASSWORD
    - APP_HOST
    - CO2_EMISSION_FACTOR
    - DB_DATABASE=solectrus
    - DB_HOST=postgresql
    - DB_PASSWORD=${POSTGRES_PASSWORD}
    - DB_USER=postgres
    - FORCE_SSL
    - INFLUX_BUCKET
    - INFLUX_EXCLUDE_FROM_HOUSE_POWER
    - INFLUX_HOST=influxdb
    - INFLUX_ORG
    - INFLUX_POLL_INTERVAL
    - INFLUX_SENSOR_BATTERY_CHARGING_POWER
    - INFLUX_SENSOR_BATTERY_DISCHARGING_POWER
    - INFLUX_SENSOR_BATTERY_SOC
    - INFLUX_SENSOR_CAR_BATTERY_SOC
    - INFLUX_SENSOR_CASE_TEMP
    - INFLUX_SENSOR_CUSTOM_POWER_01
    - INFLUX_SENSOR_CUSTOM_POWER_02
    - INFLUX_SENSOR_CUSTOM_POWER_03
    - INFLUX_SENSOR_CUSTOM_POWER_04
    - INFLUX_SENSOR_CUSTOM_POWER_05
    - INFLUX_SENSOR_CUSTOM_POWER_06
    - INFLUX_SENSOR_CUSTOM_POWER_07
    - INFLUX_SENSOR_CUSTOM_POWER_08
    - INFLUX_SENSOR_CUSTOM_POWER_09
    - INFLUX_SENSOR_CUSTOM_POWER_10
    - INFLUX_SENSOR_CUSTOM_POWER_11
    - INFLUX_SENSOR_CUSTOM_POWER_12
    - INFLUX_SENSOR_CUSTOM_POWER_13
    - INFLUX_SENSOR_GRID_EXPORT_LIMIT
    - INFLUX_SENSOR_GRID_EXPORT_POWER
    - INFLUX_SENSOR_GRID_IMPORT_POWER
    - INFLUX_SENSOR_HEATPUMP_HEATING_POWER
    - INFLUX_SENSOR_HEATPUMP_POWER
    - INFLUX_SENSOR_HEATPUMP_STATUS
    - INFLUX_SENSOR_HEATPUMP_TANK_TEMP
    - INFLUX_SENSOR_HOUSE_POWER
    - INFLUX_SENSOR_INVERTER_POWER_1
    - INFLUX_SENSOR_INVERTER_POWER_2
    - INFLUX_SENSOR_INVERTER_POWER_3
    - INFLUX_SENSOR_INVERTER_POWER_FORECAST
    - INFLUX_SENSOR_INVERTER_POWER_FORECAST_CLEARSKY
    - INFLUX_SENSOR_OUTDOOR_TEMP
    - INFLUX_SENSOR_OUTDOOR_TEMP_FORECAST
    - INFLUX_SENSOR_SYSTEM_STATUS
    - INFLUX_SENSOR_SYSTEM_STATUS_OK
    - INFLUX_SENSOR_WALLBOX_CAR_CONNECTED
    - INFLUX_SENSOR_WALLBOX_POWER
    - INFLUX_TOKEN=${INFLUX_TOKEN_READ}
    - INSTALLATION_DATE
    - REDIS_URL=redis://redis:6379/1
    - SECRET_KEY_BASE
    - WEB_CONCURRENCY
    ports:
    - 3000:3000
    labels:
    - traefik.docker.network=traefik
    - traefik.http.routers.to-solectrus.middlewares=ipallowlist@file
    - traefik.http.routers.to-solectrus.service=solectrus
    - traefik.http.services.solectrus.loadbalancer.passhostheader=true
    - com.centurylinklabs.watchtower.scope=solectrus
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
      influxdb:
        condition: service_healthy
    healthcheck:
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
      start_interval: 2s
      test:
      - CMD-SHELL
      - nc -z 127.0.0.1 3000 || exit 1
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  # ┌───────────────────────────────────────────────────────────┐
  # │  InfluxDB — Time-series database for sensor measurements  │
  # └───────────────────────────────────────────────────────────┘
  #
  influxdb:
    image: influxdb:2.8
    environment:
    - TZ
    - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUX_ADMIN_TOKEN}
    - DOCKER_INFLUXDB_INIT_BUCKET=${INFLUX_BUCKET}
    - DOCKER_INFLUXDB_INIT_MODE=setup
    - DOCKER_INFLUXDB_INIT_ORG=${INFLUX_ORG}
    - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUX_PASSWORD}
    - DOCKER_INFLUXDB_INIT_USERNAME=admin
    - INFLUXD_USE_HASHED_TOKENS
    volumes:
    - "${INFLUX_VOLUME_PATH}:/var/lib/influxdb2"
    labels:
    - traefik.docker.network=traefik
    - traefik.enable=true
    - traefik.http.routers.to-influxdb.middlewares=ipallowlist@file
    - traefik.http.routers.to-influxdb.rule=Host(`influxdb.${DOMAIN}`)
    - traefik.http.routers.to-influxdb.service=influxdb
    - traefik.http.services.influxdb.loadbalancer.passhostheader=true
    - traefik.http.services.influxdb.loadbalancer.server.port=${INFLUX_PORT}
    - com.centurylinklabs.watchtower.scope=solectrus
    healthcheck:
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 2s
      test:
      - CMD
      - influx
      - ping
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  # ┌───────────────────────────────────────────────────────────────────────────────────┐
  # │  Ingest — Ingestion proxy that recalculates house_power for balcony power plants  │
  # └───────────────────────────────────────────────────────────────────────────────────┘
  #
  ingest:
    image: ghcr.io/solectrus/ingest:develop
    environment:
    - TZ
    - INFLUX_BUCKET
    - INFLUX_EXCLUDE_FROM_HOUSE_POWER
    - INFLUX_HOST=influxdb
    - INFLUX_ORG
    - INFLUX_SENSOR_BATTERY_CHARGING_POWER
    - INFLUX_SENSOR_BATTERY_DISCHARGING_POWER
    - INFLUX_SENSOR_GRID_EXPORT_POWER
    - INFLUX_SENSOR_GRID_IMPORT_POWER
    - INFLUX_SENSOR_HEATPUMP_POWER
    - INFLUX_SENSOR_HOUSE_POWER
    - INFLUX_SENSOR_INVERTER_POWER_1
    - INFLUX_SENSOR_INVERTER_POWER_2
    - INFLUX_SENSOR_INVERTER_POWER_3
    - INFLUX_SENSOR_WALLBOX_POWER
    - INFLUX_TOKEN=${INFLUX_TOKEN_WRITE}
    - RETENTION_HOURS
    - STATS_PASSWORD=${ADMIN_PASSWORD}
    volumes:
    - "${INGEST_VOLUME_PATH}:/app/data"
    ports:
    - 4567:4567
    labels:
    - traefik.docker.network=traefik
    - traefik.enable=true
    - traefik.http.routers.to-ingest.middlewares=ipallowlist@file
    - traefik.http.routers.to-ingest.rule=Host(`ingest.${DOMAIN}`)
    - traefik.http.routers.to-ingest.service=ingest
    - traefik.http.services.ingest.loadbalancer.passhostheader=true
    - traefik.http.services.ingest.loadbalancer.server.port=${INGEST_PORT}
    - com.centurylinklabs.watchtower.scope=solectrus
    depends_on:
      influxdb:
        condition: service_healthy
    healthcheck:
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 2s
      test:
      - CMD-SHELL
      - wget -qO- http://127.0.0.1:4567/ping || exit 1
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  # ┌──────────────────────────────────────────────────────────────────────────────────────────┐
  # │  PostgreSQL — Relational database for daily summaries, electricity prices, and settings  │
  # └──────────────────────────────────────────────────────────────────────────────────────────┘
  #
  postgresql:
    image: postgres:16.11-trixie
    environment:
    - TZ
    - PGDATA
    - POSTGRES_DB=solectrus
    - POSTGRES_PASSWORD
    volumes:
    - "${DB_VOLUME_PATH}:/var/lib/postgresql"
    labels:
    - com.centurylinklabs.watchtower.scope=solectrus
    healthcheck:
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 2s
      test:
      - CMD-SHELL
      - pg_isready -U postgres
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  # ┌──────────────────────────────────────────────────────────┐
  # │  Redis — In-memory store for caching                     │
  # └──────────────────────────────────────────────────────────┘
  #
  redis:
    image: redis:8.4-bookworm
    environment:
    - TZ
    volumes:
    - "${REDIS_VOLUME_PATH}:/data"
    labels:
    - com.centurylinklabs.watchtower.scope=solectrus
    healthcheck:
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
      start_interval: 2s
      test:
      - CMD
      - redis-cli
      - ping
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  # ┌───────────────────────────────────────────────────────────────────┐
  # │  SENEC Collector — Reads data from SENEC battery storage systems  │
  # └───────────────────────────────────────────────────────────────────┘
  #
  senec-collector:
    image: ghcr.io/solectrus/senec-collector:latest
    environment:
    - TZ
    - INFLUX_BUCKET
    - INFLUX_HOST=ingest
    - INFLUX_MEASUREMENT_SENEC
    - INFLUX_ORG
    - INFLUX_PORT=4567
    - INFLUX_TOKEN=${INFLUX_TOKEN_WRITE}
    - SENEC_ADAPTER
    - SENEC_HOST
    - SENEC_IGNORE
    - SENEC_INTERVAL
    - SENEC_LANGUAGE
    - SENEC_SCHEMA
    labels:
    - com.centurylinklabs.watchtower.scope=solectrus
    depends_on:
      ingest:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  # ┌───────────────────────────────────────────────────────────┐
  # │  MQTT Collector — Receives sensor data via MQTT protocol  │
  # └───────────────────────────────────────────────────────────┘
  #
  mqtt-collector:
    image: ghcr.io/solectrus/mqtt-collector:latest
    environment:
    - TZ
    - INFLUX_BUCKET
    - INFLUX_HOST=ingest
    - INFLUX_ORG
    - INFLUX_PORT=4567
    - INFLUX_TOKEN=${INFLUX_TOKEN_WRITE}
    - MAPPING_0_FIELD
    - MAPPING_0_JSON_KEY
    - MAPPING_0_MAX
    - MAPPING_0_MEASUREMENT
    - MAPPING_0_MIN
    - MAPPING_0_TOPIC
    - MAPPING_0_TYPE
    - MAPPING_1_FIELD
    - MAPPING_1_JSON_PATH
    - MAPPING_1_MAX
    - MAPPING_1_MEASUREMENT
    - MAPPING_1_MIN
    - MAPPING_1_TOPIC
    - MAPPING_1_TYPE
    - MAPPING_2_FIELD
    - MAPPING_2_JSON_PATH
    - MAPPING_2_MAX
    - MAPPING_2_MEASUREMENT
    - MAPPING_2_MIN
    - MAPPING_2_TOPIC
    - MAPPING_2_TYPE
    - MAPPING_3_FIELD
    - MAPPING_3_JSON_PATH
    - MAPPING_3_MAX
    - MAPPING_3_MEASUREMENT
    - MAPPING_3_MIN
    - MAPPING_3_TOPIC
    - MAPPING_3_TYPE
    - MAPPING_4_FIELD
    - MAPPING_4_JSON_PATH
    - MAPPING_4_MAX
    - MAPPING_4_MEASUREMENT
    - MAPPING_4_MIN
    - MAPPING_4_TOPIC
    - MAPPING_4_TYPE
    - MAPPING_5_FIELD
    - MAPPING_5_JSON_PATH
    - MAPPING_5_MAX
    - MAPPING_5_MEASUREMENT
    - MAPPING_5_MIN
    - MAPPING_5_TOPIC
    - MAPPING_5_TYPE
    - MAPPING_6_FIELD
    - MAPPING_6_JSON_KEY
    - MAPPING_6_MAX
    - MAPPING_6_MEASUREMENT
    - MAPPING_6_MIN
    - MAPPING_6_TOPIC
    - MAPPING_6_TYPE
    - MAPPING_7_FIELD
    - MAPPING_7_JSON_PATH
    - MAPPING_7_MAX
    - MAPPING_7_MEASUREMENT
    - MAPPING_7_MIN
    - MAPPING_7_TOPIC
    - MAPPING_7_TYPE
    - MAPPING_8_FIELD
    - MAPPING_8_JSON_FORMULA
    - MAPPING_8_MAX
    - MAPPING_8_MEASUREMENT
    - MAPPING_8_MIN
    - MAPPING_8_TOPIC
    - MAPPING_8_TYPE
    - MAPPING_9_FIELD
    - MAPPING_9_JSON_FORMULA
    - MAPPING_9_MAX
    - MAPPING_9_MEASUREMENT
    - MAPPING_9_MIN
    - MAPPING_9_TOPIC
    - MAPPING_9_TYPE
    - MQTT_HOST
    - MQTT_PASSWORD
    - MQTT_PORT
    - MQTT_SSL
    - MQTT_USERNAME
    labels:
    - com.centurylinklabs.watchtower.scope=solectrus
    depends_on:
      ingest:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  # ┌───────────────────────────────────────────────────────────┐
  # │  Forecast Collector — Fetches solar production forecasts  │
  # └───────────────────────────────────────────────────────────┘
  #
  forecast-collector:
    image: ghcr.io/solectrus/forecast-collector:latest
    environment:
    - TZ
    - FORECAST_0_AZIMUTH
    - FORECAST_0_DECLINATION
    - FORECAST_0_KWP
    - FORECAST_1_AZIMUTH
    - FORECAST_1_DECLINATION
    - FORECAST_1_KWP
    - FORECAST_2_AZIMUTH
    - FORECAST_2_DECLINATION
    - FORECAST_2_KWP
    - FORECAST_3_AZIMUTH
    - FORECAST_3_DECLINATION
    - FORECAST_3_KWP
    - FORECAST_CONFIGURATIONS
    - FORECAST_LATITUDE
    - FORECAST_LONGITUDE
    - FORECAST_PROVIDER
    - INFLUX_BUCKET
    - INFLUX_HOST=influxdb
    - INFLUX_MEASUREMENT=${INFLUX_MEASUREMENT_FORECAST}
    - INFLUX_ORG
    - INFLUX_TOKEN=${INFLUX_TOKEN_WRITE}
    - PVNODE_0_EXTRA_PARAMS
    - PVNODE_1_EXTRA_PARAMS
    - PVNODE_2_EXTRA_PARAMS
    - PVNODE_3_EXTRA_PARAMS
    - PVNODE_APIKEY
    - PVNODE_PAID
    labels:
    - com.centurylinklabs.watchtower.scope=solectrus
    depends_on:
      influxdb:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  # ┌──────────────────────────────────────────────────────────┐
  # │  Power Splitter — Calculates derived power values        │
  # └──────────────────────────────────────────────────────────┘
  #
  power-splitter:
    image: ghcr.io/solectrus/power-splitter:0.7.1
    environment:
    - TZ
    - DB_HOST=postgresql
    - DB_PASSWORD=${POSTGRES_PASSWORD}
    - DB_USER=postgres
    - INFLUX_BUCKET
    - INFLUX_HOST=influxdb
    - INFLUX_ORG
    - INFLUX_SENSOR_BATTERY_CHARGING_POWER
    - INFLUX_SENSOR_BATTERY_DISCHARGING_POWER
    - INFLUX_SENSOR_BATTERY_SOC
    - INFLUX_SENSOR_CAR_BATTERY_SOC
    - INFLUX_SENSOR_CASE_TEMP
    - INFLUX_SENSOR_CUSTOM_POWER_01
    - INFLUX_SENSOR_CUSTOM_POWER_02
    - INFLUX_SENSOR_CUSTOM_POWER_03
    - INFLUX_SENSOR_CUSTOM_POWER_04
    - INFLUX_SENSOR_CUSTOM_POWER_05
    - INFLUX_SENSOR_CUSTOM_POWER_06
    - INFLUX_SENSOR_CUSTOM_POWER_07
    - INFLUX_SENSOR_CUSTOM_POWER_08
    - INFLUX_SENSOR_CUSTOM_POWER_09
    - INFLUX_SENSOR_CUSTOM_POWER_10
    - INFLUX_SENSOR_CUSTOM_POWER_11
    - INFLUX_SENSOR_CUSTOM_POWER_12
    - INFLUX_SENSOR_CUSTOM_POWER_13
    - INFLUX_SENSOR_GRID_EXPORT_LIMIT
    - INFLUX_SENSOR_GRID_EXPORT_POWER
    - INFLUX_SENSOR_GRID_IMPORT_POWER
    - INFLUX_SENSOR_HEATPUMP_HEATING_POWER
    - INFLUX_SENSOR_HEATPUMP_POWER
    - INFLUX_SENSOR_HEATPUMP_STATUS
    - INFLUX_SENSOR_HEATPUMP_TANK_TEMP
    - INFLUX_SENSOR_HOUSE_POWER
    - INFLUX_SENSOR_INVERTER_POWER_1
    - INFLUX_SENSOR_INVERTER_POWER_2
    - INFLUX_SENSOR_INVERTER_POWER_3
    - INFLUX_SENSOR_INVERTER_POWER_FORECAST
    - INFLUX_SENSOR_INVERTER_POWER_FORECAST_CLEARSKY
    - INFLUX_SENSOR_OUTDOOR_TEMP
    - INFLUX_SENSOR_OUTDOOR_TEMP_FORECAST
    - INFLUX_SENSOR_SYSTEM_STATUS
    - INFLUX_SENSOR_SYSTEM_STATUS_OK
    - INFLUX_SENSOR_WALLBOX_CAR_CONNECTED
    - INFLUX_SENSOR_WALLBOX_POWER
    - INFLUX_TOKEN=${INFLUX_TOKEN_READWRITE}
    - INSTALLATION_DATE
    - POSTGRES_PASSWORD
    - POWER_SPLITTER_INTERVAL
    - REDIS_URL=redis://redis:6379/1
    labels:
    - com.centurylinklabs.watchtower.scope=solectrus
    depends_on:
      influxdb:
        condition: service_healthy
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  # ┌──────────────────────────────────────────────────────────┐
  # │  Watchtower — Automatic Docker image updates             │
  # └──────────────────────────────────────────────────────────┘
  #
  watchtower:
    image: nickfedor/watchtower:latest
    environment:
    - TZ
    - WATCHTOWER_CLEANUP
    - WATCHTOWER_POLL_INTERVAL
    - WATCHTOWER_SCOPE
    volumes:
    - "/var/run/docker.sock:/var/run/docker.sock"
    labels:
    - com.centurylinklabs.watchtower.scope=solectrus
    healthcheck:
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
      start_interval: 2s
      test:
      - CMD
      - "/watchtower"
      - "--health-check"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  # ┌──────────────────────────────────────────────────────────┐
  # │  HELIOS — Configuration management UI                    │
  # └──────────────────────────────────────────────────────────┘
  #
  helios:
    image: ghcr.io/solectrus/helios:develop
    environment:
    - ADMIN_PASSWORD
    - SECRET_KEY_BASE
    volumes:
    - ".:/data"
    - "/var/run/docker.sock:/var/run/docker.sock"
    ports:
    - 3999:3000
    labels:
    - com.centurylinklabs.watchtower.scope=solectrus
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  # ┌────────────────────────────────────────────────────────────┐
  # │  Unmanaged service (preserved from existing installation)  │
  # └────────────────────────────────────────────────────────────┘
  #
  mosquitto:
    image: eclipse-mosquitto:2.0
    user: 1000:1000
    environment:
    - TZ
    volumes:
    - "${BASE_DIR}/mosquitto/config:/mosquitto/config"
    - "${BASE_DIR}/mosquitto/data:/mosquitto/data"
    - type: tmpfs
      target: "/mosquitto/log"
      tmpfs:
        mode: 511
        size: 100M
    labels:
    - traefik.docker.network=traefik
    - traefik.enable=true
    - traefik.tcp.routers.to-mosquittoTls.entrypoints=mqtt
    - traefik.tcp.routers.to-mosquittoTls.rule=HostSNI(`ds-mosquitto.${DOMAIN}`)
    - traefik.tcp.routers.to-mosquittoTls.service=mosquitto
    - traefik.tcp.routers.to-mosquittoTls.tls=true
    - traefik.tcp.routers.to-mosquittoTls.tls.passthrough=false
    - traefik.tcp.services.mosquitto.loadbalancer.server.port=1883
    healthcheck:
      test:
      - CMD
      - mosquitto_sub
      - "-p"
      - '1880'
      - "-t"
      - "$$SYS/#"
      - "-C"
      - '1'
      - "-i"
      - healthcheck
      - "-W"
      - '3'
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    logging:
      options:
        max-size: 10m
        max-file: '3'
    expose:
    - '1883'
    networks:
      default:
        aliases:
        - mosquitto
      traefik:

  # ┌────────────────────────────────────────────────────────────┐
  # │  Unmanaged service (preserved from existing installation)  │
  # └────────────────────────────────────────────────────────────┘
  #
  mqtt_collector_ingest:
    image: ghcr.io/solectrus/mqtt-collector:0.7.4
    environment:
    - TZ
    - INFLUX_BUCKET
    - INFLUX_HOST=${INGEST_HOST}
    - INFLUX_ORG
    - INFLUX_PORT=${INGEST_PORT}
    - INFLUX_SCHEMA
    - INFLUX_TOKEN=${MQTT_COLLECTOR_INFLUX_TOKEN}
    - MAPPING_0_FIELD_NEGATIVE=${INGEST_MAPPING_0_FIELD_NEGATIVE}
    - MAPPING_0_FIELD_POSITIVE=${INGEST_MAPPING_0_FIELD_POSITIVE}
    - MAPPING_0_JSON_PATH=${INGEST_MAPPING_0_JSON_PATH}
    - MAPPING_0_MAX=${INGEST_MAPPING_0_MAX}
    - MAPPING_0_MEASUREMENT_NEGATIVE=${INGEST_MAPPING_0_MEASUREMENT_NEGATIVE}
    - MAPPING_0_MEASUREMENT_POSITIVE=${INGEST_MAPPING_0_MEASUREMENT_POSITIVE}
    - MAPPING_0_MIN=${INGEST_MAPPING_0_MIN}
    - MAPPING_0_TOPIC=${INGEST_MAPPING_0_TOPIC}
    - MAPPING_0_TYPE=${INGEST_MAPPING_0_TYPE}
    - MQTT_HOST
    - MQTT_PASSWORD
    - MQTT_PORT
    - MQTT_SSL
    - MQTT_USERNAME
    restart: unless-stopped
    logging:
      options:
        max-size: 10m
        max-file: '3'
    links:
    - influxdb
    - ingest
    - mosquitto
    networks:
    - default

  # ┌────────────────────────────────────────────────────────────┐
  # │  Unmanaged service (preserved from existing installation)  │
  # └────────────────────────────────────────────────────────────┘
  #
  tibber_collector:
    image: ghcr.io/solectrus/tibber-collector:0.4.1
    environment:
    - TZ
    - INFLUX_BUCKET
    - INFLUX_HOST
    - INFLUX_MEASUREMENT=${TIBBER_INFLUX_MEASUREMENT}
    - INFLUX_ORG
    - INFLUX_PORT
    - INFLUX_SCHEMA
    - INFLUX_TOKEN=${TIBBER_INFLUX_TOKEN}
    - TIBBER_INTERVAL
    - TIBBER_TOKEN
    restart: unless-stopped
    logging:
      options:
        max-size: 10m
        max-file: '3'
    links:
    - influxdb
    networks:
    - default
    deploy:
      resources:
        limits:
          cpus: '0.35'
          memory: 100M

networks:
  default:
    name: solectrus_default
