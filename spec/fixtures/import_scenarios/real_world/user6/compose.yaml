# ============================================================
# DO NOT EDIT THIS FILE.
#
# This file is generated by HELIOS. Any manual change WILL be
# overwritten — silently, without backup — the next time HELIOS
# applies a configuration. In the worst case your edit breaks
# the stack and HELIOS can no longer recover it.
#
# Change every setting through the HELIOS web interface.
#
# Missing a setting? HELIOS is actively developed and can be
# extended — suggest it at:
# https://github.com/solectrus/helios/issues
#
# HELIOS fits the vast majority of setups. For a very
# specialized configuration, managing compose.yaml + .env
# by hand instead remains a valid alternative.
# ============================================================

name: solectrus

services:

  # ┌──────────────────────────────────────────────────────────┐
  # │  SOLECTRUS — Web application                             │
  # └──────────────────────────────────────────────────────────┘
  #
  dashboard:
    image: ghcr.io/solectrus/solectrus:develop
    environment:
    - TZ
    - ADMIN_PASSWORD
    - APP_HOST
    - DB_DATABASE=solectrus
    - DB_HOST=postgresql
    - DB_PASSWORD=${POSTGRES_PASSWORD}
    - DB_USER=postgres
    - FORCE_SSL
    - INFLUX_BUCKET
    - INFLUX_EXCLUDE_FROM_HOUSE_POWER
    - INFLUX_HOST=influxdb
    - INFLUX_ORG
    - INFLUX_POLL_INTERVAL
    - INFLUX_SENSOR_BATTERY_CHARGING_POWER
    - INFLUX_SENSOR_BATTERY_DISCHARGING_POWER
    - INFLUX_SENSOR_BATTERY_SOC
    - INFLUX_SENSOR_CAR_BATTERY_SOC
    - INFLUX_SENSOR_CASE_TEMP
    - INFLUX_SENSOR_CUSTOM_POWER_01
    - INFLUX_SENSOR_CUSTOM_POWER_02
    - INFLUX_SENSOR_CUSTOM_POWER_03
    - INFLUX_SENSOR_CUSTOM_POWER_04
    - INFLUX_SENSOR_CUSTOM_POWER_05
    - INFLUX_SENSOR_CUSTOM_POWER_06
    - INFLUX_SENSOR_CUSTOM_POWER_07
    - INFLUX_SENSOR_GRID_EXPORT_LIMIT
    - INFLUX_SENSOR_GRID_EXPORT_POWER
    - INFLUX_SENSOR_GRID_IMPORT_POWER
    - INFLUX_SENSOR_HEATPUMP_HEATING_POWER
    - INFLUX_SENSOR_HEATPUMP_POWER
    - INFLUX_SENSOR_HEATPUMP_TANK_TEMP
    - INFLUX_SENSOR_HOUSE_POWER
    - INFLUX_SENSOR_INVERTER_POWER_1
    - INFLUX_SENSOR_INVERTER_POWER_2
    - INFLUX_SENSOR_INVERTER_POWER_FORECAST
    - INFLUX_SENSOR_INVERTER_POWER_FORECAST_CLEARSKY
    - INFLUX_SENSOR_OUTDOOR_TEMP
    - INFLUX_SENSOR_OUTDOOR_TEMP_FORECAST
    - INFLUX_SENSOR_SYSTEM_STATUS
    - INFLUX_SENSOR_SYSTEM_STATUS_OK
    - INFLUX_SENSOR_WALLBOX_CAR_CONNECTED
    - INFLUX_SENSOR_WALLBOX_POWER
    - INFLUX_TOKEN=${INFLUX_TOKEN_READ}
    - INSTALLATION_DATE
    - REDIS_URL=redis://redis:6379/1
    - SECRET_KEY_BASE
    - WEB_CONCURRENCY
    labels:
    - traefik.enable=true
    - traefik.http.routers.dashboard.rule=Host(`solectrus.example.com`)
    - traefik.http.routers.dashboard.entrypoints=websecure
    - traefik.http.routers.dashboard.tls.certresolver=letsencrypt
    - traefik.http.services.dashboard.loadbalancer.server.port=3000
    - traefik.http.middlewares.test-ratelimit.ratelimit.average=100
    - traefik.http.middlewares.test-ratelimit.ratelimit.burst=200
    - com.centurylinklabs.watchtower.scope=solectrus
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
      influxdb:
        condition: service_healthy
    healthcheck:
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
      start_interval: 2s
      test:
      - CMD-SHELL
      - nc -z 127.0.0.1 3000 || exit 1
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  # ┌───────────────────────────────────────────────────────────┐
  # │  InfluxDB — Time-series database for sensor measurements  │
  # └───────────────────────────────────────────────────────────┘
  #
  influxdb:
    image: influxdb:2.8-alpine
    environment:
    - TZ
    - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUX_ADMIN_TOKEN}
    - DOCKER_INFLUXDB_INIT_BUCKET=${INFLUX_BUCKET}
    - DOCKER_INFLUXDB_INIT_MODE=setup
    - DOCKER_INFLUXDB_INIT_ORG=${INFLUX_ORG}
    - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUX_PASSWORD}
    - DOCKER_INFLUXDB_INIT_USERNAME=admin
    volumes:
    - "${INFLUX_VOLUME_PATH}:/var/lib/influxdb2"
    labels:
    - traefik.enable=true
    - traefik.http.routers.influxdb-solectrus.rule=Host(`solectrus.example.com`)
    - traefik.http.routers.influxdb-solectrus.entrypoints=influxdb
    - traefik.http.routers.influxdb-solectrus.tls.certresolver=myresolver
    - traefik.http.routers.influxdb-solectrus.tls=true
    - com.centurylinklabs.watchtower.scope=solectrus
    healthcheck:
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 2s
      test:
      - CMD
      - influx
      - ping
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  # ┌──────────────────────────────────────────────────────────────────────────────────────────┐
  # │  PostgreSQL — Relational database for daily summaries, electricity prices, and settings  │
  # └──────────────────────────────────────────────────────────────────────────────────────────┘
  #
  postgresql:
    image: postgres:18-alpine
    environment:
    - TZ
    - POSTGRES_DB=solectrus
    - POSTGRES_PASSWORD
    volumes:
    - "${DB_VOLUME_PATH}:/var/lib/postgresql"
    labels:
    - com.centurylinklabs.watchtower.scope=solectrus
    healthcheck:
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 2s
      test:
      - CMD-SHELL
      - pg_isready -U postgres
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  # ┌──────────────────────────────────────────────────────────┐
  # │  Redis — In-memory store for caching                     │
  # └──────────────────────────────────────────────────────────┘
  #
  redis:
    image: redis:8-alpine
    environment:
    - TZ
    volumes:
    - "${REDIS_VOLUME_PATH}:/data"
    labels:
    - com.centurylinklabs.watchtower.scope=solectrus
    healthcheck:
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
      start_interval: 2s
      test:
      - CMD
      - redis-cli
      - ping
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  # ┌───────────────────────────────────────────────────────────┐
  # │  MQTT Collector — Receives sensor data via MQTT protocol  │
  # └───────────────────────────────────────────────────────────┘
  #
  mqtt-collector:
    image: ghcr.io/solectrus/mqtt-collector:latest
    environment:
    - TZ
    - INFLUX_BUCKET
    - INFLUX_HOST=influxdb
    - INFLUX_ORG
    - INFLUX_TOKEN=${INFLUX_TOKEN_WRITE}
    - MAPPING_0_FIELD
    - MAPPING_0_MEASUREMENT
    - MAPPING_0_TOPIC
    - MAPPING_0_TYPE
    - MAPPING_1_FIELD
    - MAPPING_1_JSON_KEY
    - MAPPING_1_MEASUREMENT
    - MAPPING_1_TOPIC
    - MAPPING_1_TYPE
    - MAPPING_2_FIELD
    - MAPPING_2_JSON_KEY
    - MAPPING_2_MEASUREMENT
    - MAPPING_2_TOPIC
    - MAPPING_2_TYPE
    - MAPPING_3_FIELD
    - MAPPING_3_JSON_KEY
    - MAPPING_3_MEASUREMENT
    - MAPPING_3_TOPIC
    - MAPPING_3_TYPE
    - MAPPING_4_FIELD
    - MAPPING_4_JSON_PATH
    - MAPPING_4_MEASUREMENT
    - MAPPING_4_TOPIC
    - MAPPING_4_TYPE
    - MAPPING_5_FIELD
    - MAPPING_5_JSON_PATH
    - MAPPING_5_MEASUREMENT
    - MAPPING_5_TOPIC
    - MAPPING_5_TYPE
    - MAPPING_6_FIELD
    - MAPPING_6_JSON_KEY
    - MAPPING_6_MEASUREMENT
    - MAPPING_6_TOPIC
    - MAPPING_6_TYPE
    - MAPPING_7_FIELD
    - MAPPING_7_JSON_KEY
    - MAPPING_7_MEASUREMENT
    - MAPPING_7_TOPIC
    - MAPPING_7_TYPE
    - MAPPING_8_FIELD
    - MAPPING_8_MEASUREMENT
    - MAPPING_8_TOPIC
    - MAPPING_8_TYPE
    - MAPPING_9_FIELD
    - MAPPING_9_JSON_KEY
    - MAPPING_9_MEASUREMENT
    - MAPPING_9_TOPIC
    - MAPPING_9_TYPE
    - MAPPING_10_FIELD
    - MAPPING_10_MEASUREMENT
    - MAPPING_10_TOPIC
    - MAPPING_10_TYPE
    - MAPPING_11_FIELD
    - MAPPING_11_MEASUREMENT
    - MAPPING_11_TOPIC
    - MAPPING_11_TYPE
    - MAPPING_12_FIELD
    - MAPPING_12_MEASUREMENT
    - MAPPING_12_TOPIC
    - MAPPING_12_TYPE
    - MAPPING_13_FIELD
    - MAPPING_13_MEASUREMENT
    - MAPPING_13_TOPIC
    - MAPPING_13_TYPE
    - MAPPING_14_FIELD
    - MAPPING_14_MEASUREMENT
    - MAPPING_14_TOPIC
    - MAPPING_14_TYPE
    - MQTT_HOST
    - MQTT_PASSWORD
    - MQTT_PORT
    - MQTT_SSL
    - MQTT_USERNAME
    labels:
    - com.centurylinklabs.watchtower.scope=solectrus
    depends_on:
      influxdb:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  # ┌───────────────────────────────────────────────────────────┐
  # │  Forecast Collector — Fetches solar production forecasts  │
  # └───────────────────────────────────────────────────────────┘
  #
  forecast-collector:
    image: ghcr.io/solectrus/forecast-collector:latest
    environment:
    - TZ
    - FORECAST_0_AZIMUTH
    - FORECAST_0_DECLINATION
    - FORECAST_0_KWP
    - FORECAST_1_AZIMUTH
    - FORECAST_1_DECLINATION
    - FORECAST_1_KWP
    - FORECAST_CONFIGURATIONS
    - FORECAST_LATITUDE
    - FORECAST_LONGITUDE
    - FORECAST_PROVIDER
    - INFLUX_BUCKET
    - INFLUX_HOST=influxdb
    - INFLUX_MEASUREMENT=${INFLUX_MEASUREMENT_FORECAST}
    - INFLUX_ORG
    - INFLUX_TOKEN=${INFLUX_TOKEN_WRITE}
    - PVNODE_APIKEY
    - PVNODE_EXTRA_PARAMS
    - PVNODE_PAID
    labels:
    - com.centurylinklabs.watchtower.scope=solectrus
    depends_on:
      influxdb:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  # ┌──────────────────────────────────────────────────────────┐
  # │  Power Splitter — Calculates derived power values        │
  # └──────────────────────────────────────────────────────────┘
  #
  power-splitter:
    image: ghcr.io/solectrus/power-splitter:latest
    environment:
    - TZ
    - DB_HOST=postgresql
    - DB_PASSWORD=${POSTGRES_PASSWORD}
    - DB_USER=postgres
    - INFLUX_BUCKET
    - INFLUX_HOST=influxdb
    - INFLUX_ORG
    - INFLUX_SENSOR_BATTERY_CHARGING_POWER
    - INFLUX_SENSOR_BATTERY_DISCHARGING_POWER
    - INFLUX_SENSOR_BATTERY_SOC
    - INFLUX_SENSOR_CAR_BATTERY_SOC
    - INFLUX_SENSOR_CASE_TEMP
    - INFLUX_SENSOR_CUSTOM_POWER_01
    - INFLUX_SENSOR_CUSTOM_POWER_02
    - INFLUX_SENSOR_CUSTOM_POWER_03
    - INFLUX_SENSOR_CUSTOM_POWER_04
    - INFLUX_SENSOR_CUSTOM_POWER_05
    - INFLUX_SENSOR_CUSTOM_POWER_06
    - INFLUX_SENSOR_CUSTOM_POWER_07
    - INFLUX_SENSOR_GRID_EXPORT_LIMIT
    - INFLUX_SENSOR_GRID_EXPORT_POWER
    - INFLUX_SENSOR_GRID_IMPORT_POWER
    - INFLUX_SENSOR_HEATPUMP_HEATING_POWER
    - INFLUX_SENSOR_HEATPUMP_POWER
    - INFLUX_SENSOR_HEATPUMP_TANK_TEMP
    - INFLUX_SENSOR_HOUSE_POWER
    - INFLUX_SENSOR_INVERTER_POWER_1
    - INFLUX_SENSOR_INVERTER_POWER_2
    - INFLUX_SENSOR_INVERTER_POWER_FORECAST
    - INFLUX_SENSOR_INVERTER_POWER_FORECAST_CLEARSKY
    - INFLUX_SENSOR_OUTDOOR_TEMP
    - INFLUX_SENSOR_OUTDOOR_TEMP_FORECAST
    - INFLUX_SENSOR_SYSTEM_STATUS
    - INFLUX_SENSOR_SYSTEM_STATUS_OK
    - INFLUX_SENSOR_WALLBOX_CAR_CONNECTED
    - INFLUX_SENSOR_WALLBOX_POWER
    - INFLUX_TOKEN=${INFLUX_TOKEN_READWRITE}
    - INSTALLATION_DATE
    - POSTGRES_PASSWORD
    - POWER_SPLITTER_INTERVAL
    - REDIS_URL=redis://redis:6379/1
    labels:
    - com.centurylinklabs.watchtower.scope=solectrus
    depends_on:
      influxdb:
        condition: service_healthy
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  # ┌──────────────────────────────────────────────────────────┐
  # │  Traefik — Reverse proxy with automatic HTTPS            │
  # └──────────────────────────────────────────────────────────┘
  #
  traefik:
    image: traefik:v3
    command:
    - "--log.level=DEBUG"
    - "--api.insecure=false"
    - "--providers.docker=true"
    - "--providers.docker.exposedbydefault=false"
    - "--entrypoints.web.address=:80"
    - "--entrypoints.websecure.address=:443"
    - "--entrypoints.influxdb.address=:8086"
    - "--entrypoints.pgadmin.address=:8888"
    - "--entrypoints.dozzle.address=:9090"
    - "--entrypoints.mqtt.address=:8883"
    - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
    - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
    - "--certificatesresolvers.myresolver.acme.tlschallenge=true"
    - "--certificatesresolvers.myresolver.acme.email=postmaster@example.com"
    - "--certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json"
    environment:
    - TZ
    volumes:
    - "./letsencrypt:/letsencrypt"
    - "/var/run/docker.sock:/var/run/docker.sock:ro"
    ports:
    - 80:80
    - 443:443
    - 8086:8086
    - 9090:9090
    - 8883:8883
    - 8888:8888
    labels:
    - com.centurylinklabs.watchtower.scope=solectrus
    restart: always
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  # ┌──────────────────────────────────────────────────────────┐
  # │  Watchtower — Automatic Docker image updates             │
  # └──────────────────────────────────────────────────────────┘
  #
  watchtower:
    image: nickfedor/watchtower:latest
    environment:
    - TZ
    - WATCHTOWER_CLEANUP
    - WATCHTOWER_POLL_INTERVAL
    - WATCHTOWER_SCOPE
    volumes:
    - "/var/run/docker.sock:/var/run/docker.sock"
    labels:
    - com.centurylinklabs.watchtower.scope=solectrus
    healthcheck:
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
      start_interval: 2s
      test:
      - CMD
      - "/watchtower"
      - "--health-check"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  # ┌──────────────────────────────────────────────────────────┐
  # │  HELIOS — Configuration management UI                    │
  # └──────────────────────────────────────────────────────────┘
  #
  helios:
    image: ghcr.io/solectrus/helios:develop
    environment:
    - ADMIN_PASSWORD
    - SECRET_KEY_BASE
    volumes:
    - ".:/data"
    - "/var/run/docker.sock:/var/run/docker.sock"
    ports:
    - 3999:3000
    labels:
    - com.centurylinklabs.watchtower.scope=solectrus
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  # ┌────────────────────────────────────────────────────────────┐
  # │  Unmanaged service (preserved from existing installation)  │
  # └────────────────────────────────────────────────────────────┘
  #
  dozzle:
    image: amir20/dozzle:latest
    environment:
    - DOZZLE_AUTH_PROVIDER=simple
    volumes:
    - "/var/run/docker.sock:/var/run/docker.sock"
    - "./dozzle/data:/data"
    labels:
    - traefik.enable=true
    - traefik.http.routers.dozzle-solectrus.rule=Host(`solectrus.example.com`)
    - traefik.http.routers.dozzle-solectrus.entrypoints=dozzle
    - traefik.http.routers.dozzle-solectrus.tls.certresolver=myresolver
    - traefik.http.routers.dozzle-solectrus.tls=true
    - com.centurylinklabs.watchtower.scope=solectrus
    restart: always
    logging:
      options:
        max-size: 10m
        max-file: '3'

  # ┌────────────────────────────────────────────────────────────┐
  # │  Unmanaged service (preserved from existing installation)  │
  # └────────────────────────────────────────────────────────────┘
  #
  pgadmin:
    image: dpage/pgadmin4
    environment:
    - TZ
    - PGADMIN_DEFAULT_EMAIL=pgadmin_email
    - PGADMIN_DEFAULT_PASSWORD=pgadmin_password
    - PGADMIN_ENABLE_TLS
    volumes:
    - "./pgAdmin:/var/lib/pgadmin"
    labels:
    - traefik.enable=true
    - traefik.http.routers.pgadmin-solectrus.rule=Host(`solectrus.example.com`)
    - traefik.http.routers.pgadmin-solectrus.entrypoints=pgadmin
    - traefik.http.routers.pgadmin-solectrus.tls.certresolver=myresolver
    - traefik.http.routers.pgadmin-solectrus.tls=true
    - traefik.tcp.routers.pgadmin.service=pgadminservice
    - traefik.tcp.services.pgadminservice.loadbalancer.server.port=80
    - com.centurylinklabs.watchtower.scope=solectrus
    depends_on:
      postgresql:
        condition: service_healthy
    restart: always
    logging:
      options:
        max-size: 10m
        max-file: '3'

  # ┌────────────────────────────────────────────────────────────┐
  # │  Unmanaged service (preserved from existing installation)  │
  # └────────────────────────────────────────────────────────────┘
  #
  mosquitto:
    image: eclipse-mosquitto
    environment:
    - TZ
    volumes:
    - "./mosquitto:/mosquitto"
    - "./mosquitto/data:/mosquitto/data"
    labels:
    - traefik.enable=true
    - traefik.tcp.routers.mqtt.rule=HostSNI(`solectrus.example.com`)
    - traefik.tcp.routers.mqtt.entrypoints=mqtt
    - traefik.tcp.routers.mqtt.service=mqttservice
    - traefik.tcp.routers.mqtt.tls=true
    - traefik.tcp.services.mqttservice.loadbalancer.server.port=8883
    - com.centurylinklabs.watchtower.scope=solectrus
    restart: always
    logging:
      options:
        max-size: 10m
        max-file: '3'
    expose:
    - 1883
    - 8883

networks:
  default:
    name: solectrus_default
