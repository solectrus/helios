    shelly_connection: local
    shelly_host: 192.168.178.134
    shelly_interval: '10'
    source: shelly
  custom_power_02:
    field: power
    measurement: beamer
    name: beamer
    shelly_connection: local
    shelly_host: 192.168.178.65
    shelly_interval: '10'
    source: shelly
  custom_power_03:
