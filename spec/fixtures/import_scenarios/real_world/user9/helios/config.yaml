---
_schema_version: 4
system:
  admin_password: AAAAA
  installation_date: '2020-11-27'
  secret_key_base: BBBBB
  timezone: Europe/Berlin
dashboard:
  image: ghcr.io/solectrus/solectrus:latest
postgresql:
  image: postgres:18-alpine
  password: CCCCC
influxdb:
  bucket: GGGGG
  image: influxdb:2-alpine
  org: GGGGG
  password: HHHHH
  publish_port: true
  token_admin: IIIII
  token_read: KKKKK
  token_readwrite: IIIII
  token_write: JJJJJ
redis:
  image: redis:7-alpine
watchtower:
  image: nickfedor/watchtower:latest
forecast:
  forecast: pvnode
  forecast_declination1: '28'
  forecast_kwp1: '9.24'
  forecast_latitude: '0.00000'
  forecast_longitude: '0.00000'
  forecast_pvnode_apikey: LLLLL
  forecast_pvnode_azimuth1: '209'
  forecast_pvnode_extra_params: panel_age_years=4
  forecast_pvnode_paid: 'false'
  forecast_roofs: '1'
  image: ghcr.io/solectrus/forecast-collector:develop
  measurement: forecast
senec:
  adapter: cloud
  interval: '600'
  password: EEEEE
  system_id: '0'
  totp_uri: FFFFF
  username: DDDDD
  version: v4
tibber:
  image: ghcr.io/solectrus/tibber-collector:develop
  measurement: prices
  token: MMMMM
shelly:
  connection: local
  interval: '30'
sensors:
  battery_charging_power:
    source: senec
  battery_discharging_power:
    source: senec
  battery_soc:
    source: senec
  case_temp:
    source: senec
  custom_power_01:
    field: power
    measurement: Washer
    name: Washer
    source: external
  custom_power_02:
    field: power
    measurement: Fridge
    name: Fridge
    source: external
  custom_power_03:
    field: power
    measurement: KabelFritz
    name: KabelFritz
    source: external
  custom_power_04:
    field: power
    measurement: Synology
    name: Synology
    source: external
  custom_power_05:
    field: power
    measurement: iMac
    name: iMac
    source: external
  custom_power_06:
    field: power
    measurement: Dishwasher
    name: Dishwasher
    source: external
  grid_export_limit:
    source: senec
  grid_export_power:
    source: senec
  grid_import_power:
    source: senec
  heatpump_heating_power:
    field: heating_power
    measurement: heatpump
    source: external
  heatpump_power:
    exclude_from_house_power: true
    field: power
    measurement: Consumer
    shelly_host: shelly-heatpump.fritz.box
    source: shelly
  house_power:
    source: senec
  inverter_power:
    source: senec
  inverter_power_1:
    source: senec
  inverter_power_2:
    source: senec
  inverter_power_3:
    source: senec
  inverter_power_forecast:
    source: forecast
  inverter_power_forecast_clearsky:
    source: forecast
  outdoor_temp:
    field: temperature
    measurement: outdoor
    source: external
  outdoor_temp_forecast:
    source: forecast
  system_status:
    source: senec
  system_status_ok:
    source: senec
  wallbox_power:
    source: senec
power_splitter:
  image: ghcr.io/solectrus/power-splitter:develop
helios:
  image: ghcr.io/solectrus/helios:develop
_unmanaged:
  services:
    dozzle:
      environment:
      - DOZZLE_ENABLE_ACTIONS=true
      - DOZZLE_ENABLE_SHELL=true
      - DOZZLE_NO_ANALYTICS=true
      image: amir20/dozzle:latest
      labels:
      - com.centurylinklabs.watchtower.scope=solectrus
      ports:
      - 8080:8080
      restart: unless-stopped
      volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
