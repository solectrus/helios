# This file is generated by HELIOS. Any manual change WILL be
# overwritten — silently, without backup — the next time HELIOS
# applies a configuration. In the worst case your edit breaks
# the stack and HELIOS can no longer recover it.
#
# Change every setting through the HELIOS web interface.
#
# Missing a setting? HELIOS is actively developed and can be
# extended — suggest it at:
# https://github.com/solectrus/helios/issues
#
# HELIOS fits the vast majority of setups. For a very
# specialized configuration, managing compose.yaml + .env
# by hand instead remains a valid alternative.
# ============================================================

name: solectrus

services:

  # +----------------------------------------------------------+
  # |  SOLECTRUS — Web application                             |
  # +----------------------------------------------------------+
  #
  dashboard:
    image: ghcr.io/solectrus/solectrus:latest
    environment:
    - TZ
    - ADMIN_PASSWORD
    - APP_HOST
    - DB_DATABASE=solectrus
    - DB_HOST=postgresql
    - DB_PASSWORD=${POSTGRES_PASSWORD}
    - DB_USER=postgres
    - FORCE_SSL
    - INFLUX_BUCKET
    - INFLUX_EXCLUDE_FROM_HOUSE_POWER
    - INFLUX_HOST=influxdb
    - INFLUX_ORG
    - INFLUX_POLL_INTERVAL
    - INFLUX_SENSOR_BATTERY_CHARGING_POWER
    - INFLUX_SENSOR_BATTERY_DISCHARGING_POWER
    - INFLUX_SENSOR_BATTERY_SOC
    - INFLUX_SENSOR_CASE_TEMP
    - INFLUX_SENSOR_CUSTOM_POWER_01
    - INFLUX_SENSOR_CUSTOM_POWER_02
    - INFLUX_SENSOR_CUSTOM_POWER_03
    - INFLUX_SENSOR_CUSTOM_POWER_04
    - INFLUX_SENSOR_CUSTOM_POWER_05
    - INFLUX_SENSOR_CUSTOM_POWER_06
    - INFLUX_SENSOR_GRID_EXPORT_LIMIT
    - INFLUX_SENSOR_GRID_EXPORT_POWER
    - INFLUX_SENSOR_GRID_IMPORT_POWER
    - INFLUX_SENSOR_HEATPUMP_HEATING_POWER
    - INFLUX_SENSOR_HEATPUMP_POWER
    - INFLUX_SENSOR_HOUSE_POWER
    - INFLUX_SENSOR_INVERTER_POWER
    - INFLUX_SENSOR_INVERTER_POWER_1
    - INFLUX_SENSOR_INVERTER_POWER_2
    - INFLUX_SENSOR_INVERTER_POWER_3
    - INFLUX_SENSOR_INVERTER_POWER_FORECAST
    - INFLUX_SENSOR_INVERTER_POWER_FORECAST_CLEARSKY
    - INFLUX_SENSOR_OUTDOOR_TEMP
    - INFLUX_SENSOR_OUTDOOR_TEMP_FORECAST
    - INFLUX_SENSOR_SYSTEM_STATUS
    - INFLUX_SENSOR_SYSTEM_STATUS_OK
    - INFLUX_SENSOR_WALLBOX_POWER
    - INFLUX_TOKEN=${INFLUX_TOKEN_READ}
    - INSTALLATION_DATE
    - REDIS_URL=redis://redis:6379/1
    - SECRET_KEY_BASE
    - WEB_CONCURRENCY
    ports:
    - 3000:3000
    labels:
    - com.centurylinklabs.watchtower.scope=solectrus
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
      influxdb:
        condition: service_healthy
    healthcheck:
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
      start_interval: 2s
      test:
      - CMD-SHELL
      - nc -z 127.0.0.1 3000 || exit 1
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  # +-----------------------------------------------------------+
  # |  InfluxDB — Time-series database for sensor measurements  |
  # +-----------------------------------------------------------+
  #
  influxdb:
    image: influxdb:2-alpine
    environment:
    - TZ
    - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUX_ADMIN_TOKEN}
    - DOCKER_INFLUXDB_INIT_BUCKET=${INFLUX_BUCKET}
    - DOCKER_INFLUXDB_INIT_MODE=setup
    - DOCKER_INFLUXDB_INIT_ORG=${INFLUX_ORG}
    - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUX_PASSWORD}
    - DOCKER_INFLUXDB_INIT_USERNAME=admin
    volumes:
    - "${INFLUX_VOLUME_PATH}:/var/lib/influxdb2"
    - "./influx-backup-staging:/influx-backup-staging"
    ports:
    - 8086:8086
    labels:
    - com.centurylinklabs.watchtower.scope=solectrus
    healthcheck:
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 2s
      test:
      - CMD
      - influx
      - ping
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  # +------------------------------------------------------------------------------------------+
  # |  PostgreSQL — Relational database for daily summaries, electricity prices, and settings  |
  # +------------------------------------------------------------------------------------------+
  #
  postgresql:
    image: postgres:18-alpine
    environment:
    - TZ
    - POSTGRES_DB=solectrus
    - POSTGRES_PASSWORD
    volumes:
    - "${DB_VOLUME_PATH}:/var/lib/postgresql"
    labels:
    - com.centurylinklabs.watchtower.scope=solectrus
    healthcheck:
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 2s
      test:
      - CMD-SHELL
      - pg_isready -U postgres
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  # +----------------------------------------------------------+
  # |  Redis — In-memory store for caching                     |
  # +----------------------------------------------------------+
  #
  redis:
    image: redis:7-alpine
    environment:
    - TZ
    volumes:
    - "${REDIS_VOLUME_PATH}:/data"
    labels:
    - com.centurylinklabs.watchtower.scope=solectrus
    healthcheck:
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
      start_interval: 2s
      test:
      - CMD
      - redis-cli
      - ping
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  # +-------------------------------------------------------------------+
  # |  SENEC Collector — Reads data from SENEC battery storage systems  |
  # +-------------------------------------------------------------------+
  #
  senec-collector:
    image: ghcr.io/solectrus/senec-collector:latest
    environment:
    - TZ
    - INFLUX_BUCKET
    - INFLUX_HOST=influxdb
    - INFLUX_MEASUREMENT_SENEC
    - INFLUX_ORG
    - INFLUX_TOKEN=${INFLUX_TOKEN_WRITE}
    - SENEC_ADAPTER
    - SENEC_INTERVAL
    - SENEC_PASSWORD
    - SENEC_SYSTEM_ID
    - SENEC_TOTP_URI
    - SENEC_USERNAME
    labels:
    - com.centurylinklabs.watchtower.scope=solectrus
    depends_on:
      influxdb:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  # +-----------------------------------------------------------+
  # |  Shelly Collector — Reads data from Shelly energy meters  |
  # +-----------------------------------------------------------+
  #
  shelly-collector:
    image: ghcr.io/solectrus/shelly-collector:latest
    environment:
    - TZ
    - INFLUX_BUCKET
    - INFLUX_HOST=influxdb
    - INFLUX_MEASUREMENT
    - INFLUX_ORG
    - INFLUX_TOKEN=${INFLUX_TOKEN_WRITE}
    - SHELLY_HOST
    - SHELLY_INTERVAL
    labels:
    - com.centurylinklabs.watchtower.scope=solectrus
    depends_on:
      influxdb:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  # +-----------------------------------------------------------+
  # |  Forecast Collector — Fetches solar production forecasts  |
  # +-----------------------------------------------------------+
  #
  forecast-collector:
    image: ghcr.io/solectrus/forecast-collector:latest
    environment:
    - TZ
    - FORECAST_AZIMUTH
    - FORECAST_DECLINATION
    - FORECAST_KWP
    - FORECAST_LATITUDE
    - FORECAST_LONGITUDE
    - FORECAST_PROVIDER
    - INFLUX_BUCKET
    - INFLUX_HOST=influxdb
    - INFLUX_MEASUREMENT=${INFLUX_MEASUREMENT_FORECAST}
    - INFLUX_ORG
    - INFLUX_TOKEN=${INFLUX_TOKEN_WRITE}
    - PVNODE_APIKEY
    - PVNODE_EXTRA_PARAMS
    labels:
    - com.centurylinklabs.watchtower.scope=solectrus
    depends_on:
      influxdb:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  # +----------------------------------------------------------+
  # |  Power Splitter — Calculates derived power values        |
  # +----------------------------------------------------------+
  #
  power-splitter:
    image: ghcr.io/solectrus/power-splitter:develop
    environment:
    - TZ
    - DB_HOST=postgresql
    - DB_PASSWORD=${POSTGRES_PASSWORD}
    - DB_USER=postgres
    - INFLUX_BUCKET
    - INFLUX_HOST=influxdb
    - INFLUX_ORG
    - INFLUX_SENSOR_BATTERY_CHARGING_POWER
    - INFLUX_SENSOR_BATTERY_DISCHARGING_POWER
    - INFLUX_SENSOR_BATTERY_SOC
    - INFLUX_SENSOR_CASE_TEMP
    - INFLUX_SENSOR_CUSTOM_POWER_01
    - INFLUX_SENSOR_CUSTOM_POWER_02
    - INFLUX_SENSOR_CUSTOM_POWER_03
    - INFLUX_SENSOR_CUSTOM_POWER_04
    - INFLUX_SENSOR_CUSTOM_POWER_05
    - INFLUX_SENSOR_CUSTOM_POWER_06
    - INFLUX_SENSOR_GRID_EXPORT_LIMIT
    - INFLUX_SENSOR_GRID_EXPORT_POWER
    - INFLUX_SENSOR_GRID_IMPORT_POWER
    - INFLUX_SENSOR_HEATPUMP_HEATING_POWER
    - INFLUX_SENSOR_HEATPUMP_POWER
    - INFLUX_SENSOR_HOUSE_POWER
    - INFLUX_SENSOR_INVERTER_POWER
    - INFLUX_SENSOR_INVERTER_POWER_1
    - INFLUX_SENSOR_INVERTER_POWER_2
    - INFLUX_SENSOR_INVERTER_POWER_3
    - INFLUX_SENSOR_INVERTER_POWER_FORECAST
    - INFLUX_SENSOR_INVERTER_POWER_FORECAST_CLEARSKY
    - INFLUX_SENSOR_OUTDOOR_TEMP
    - INFLUX_SENSOR_OUTDOOR_TEMP_FORECAST
    - INFLUX_SENSOR_SYSTEM_STATUS
    - INFLUX_SENSOR_SYSTEM_STATUS_OK
    - INFLUX_SENSOR_WALLBOX_POWER
    - INFLUX_TOKEN=${INFLUX_TOKEN_READWRITE}
    - INSTALLATION_DATE
    - POSTGRES_PASSWORD
    - POWER_SPLITTER_INTERVAL
    - REDIS_URL=redis://redis:6379/1
    labels:
    - com.centurylinklabs.watchtower.scope=solectrus
    depends_on:
      influxdb:
        condition: service_healthy
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  # +----------------------------------------------------------+
  # |  Watchtower — Automatic Docker image updates             |
  # +----------------------------------------------------------+
  #
  watchtower:
    image: nickfedor/watchtower:latest
    environment:
    - TZ
    - WATCHTOWER_CLEANUP
    - WATCHTOWER_POLL_INTERVAL
    - WATCHTOWER_SCOPE
    volumes:
    - "/var/run/docker.sock:/var/run/docker.sock"
    labels:
    - com.centurylinklabs.watchtower.scope=solectrus
    healthcheck:
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
      start_interval: 2s
      test:
      - CMD
      - "/watchtower"
      - "--health-check"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  # +----------------------------------------------------------+
  # |  HELIOS — Configuration management UI                    |
  # +----------------------------------------------------------+
  #
  helios:
    image: ghcr.io/solectrus/helios:develop
    environment:
    - ADMIN_PASSWORD
    - SECRET_KEY_BASE
    volumes:
    - ".:/data"
    - "/var/run/docker.sock:/var/run/docker.sock"
    - "/sys/fs/cgroup:/host/sys/fs/cgroup:ro"
    ports:
    - 3999:3000
    labels:
    - com.centurylinklabs.watchtower.scope=solectrus
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  # +------------------------------------------------------------+
  # |  Unmanaged service (preserved from existing installation)  |
  # +------------------------------------------------------------+
  #
  senec-charger:
    image: ghcr.io/solectrus/senec-charger:develop
    environment:
    - TZ
    - INFLUX_ADMIN_TOKEN
    - INFLUX_BUCKET
    - INFLUX_EXCLUDE_FROM_HOUSE_POWER
    - INFLUX_HOST
    - INFLUX_MEASUREMENT_FORECAST
    - INFLUX_MEASUREMENT_SHELLY_HEATPUMP
    - INFLUX_ORG
    - INFLUX_PASSWORD
    - INFLUX_POLL_INTERVAL
    - INFLUX_PORT
    - INFLUX_SCHEMA
    - INFLUX_SENSOR_BATTERY_CHARGING_POWER
    - INFLUX_SENSOR_BATTERY_DISCHARGING_POWER
    - INFLUX_SENSOR_BATTERY_SOC
    - INFLUX_SENSOR_CASE_TEMP
    - INFLUX_SENSOR_CUSTOM_POWER_01
    - INFLUX_SENSOR_CUSTOM_POWER_02
    - INFLUX_SENSOR_CUSTOM_POWER_03
    - INFLUX_SENSOR_CUSTOM_POWER_04
    - INFLUX_SENSOR_CUSTOM_POWER_05
    - INFLUX_SENSOR_CUSTOM_POWER_06
    - INFLUX_SENSOR_GRID_EXPORT_LIMIT
    - INFLUX_SENSOR_GRID_EXPORT_POWER
    - INFLUX_SENSOR_GRID_IMPORT_POWER
    - INFLUX_SENSOR_HEATPUMP_HEATING_POWER
    - INFLUX_SENSOR_HEATPUMP_POWER
    - INFLUX_SENSOR_HOUSE_POWER
    - INFLUX_SENSOR_INVERTER_POWER
    - INFLUX_SENSOR_INVERTER_POWER_1
    - INFLUX_SENSOR_INVERTER_POWER_2
    - INFLUX_SENSOR_INVERTER_POWER_3
    - INFLUX_SENSOR_INVERTER_POWER_FORECAST
    - INFLUX_SENSOR_INVERTER_POWER_FORECAST_CLEARSKY
    - INFLUX_SENSOR_OUTDOOR_TEMP
    - INFLUX_SENSOR_OUTDOOR_TEMP_FORECAST
    - INFLUX_SENSOR_SYSTEM_STATUS
    - INFLUX_SENSOR_SYSTEM_STATUS_OK
    - INFLUX_SENSOR_WALLBOX_POWER
    - INFLUX_TOKEN=${INFLUX_TOKEN_READ}
    - INFLUX_USERNAME
    - INFLUX_VOLUME_PATH
    - CHARGER_DRY_RUN
    - CHARGER_INTERVAL
    - DB_VOLUME_PATH
    - FORCE_SSL
    - FORECAST_0_AZIMUTH
    - FORECAST_0_DECLINATION
    - FORECAST_0_KWP
    - FORECAST_CONFIGURATIONS
    - FORECAST_INTERVAL
    - FORECAST_LATITUDE
    - FORECAST_LONGITUDE
    - FORECAST_PROVIDER
    - INGEST_HOST
    - INGEST_PORT
    - INGEST_VOLUME_PATH
    - INSTALLATION_DATE
    - POSTGRES_PASSWORD
    - POWER_SPLITTER_INTERVAL
    - PVNODE_APIKEY
    - PVNODE_EXTRA_PARAMS
    - PVNODE_PAID
    - REDIS_VOLUME_PATH
    - SENEC_ADAPTER
    - SENEC_HOST
    - SENEC_INFLUX_MEASUREMENT
    - SENEC_INTERVAL
    - SENEC_LANGUAGE
    - SENEC_PASSWORD
    - SENEC_SCHEMA
    - SENEC_SYSTEM_ID
    - SENEC_TOTP_URI
    - SENEC_USERNAME
    - SHELLY_HOST
    - SHELLY_INTERVAL
    - TIBBER_TOKEN
    labels:
    - com.centurylinklabs.watchtower.scope=solectrus
    depends_on:
      influxdb:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    links:
    - influxdb

  # +------------------------------------------------------------+
  # |  Unmanaged service (preserved from existing installation)  |
  # +------------------------------------------------------------+
  #
  tibber-collector:
    image: ghcr.io/solectrus/tibber-collector:develop
    environment:
    - TZ
    - INFLUX_ADMIN_TOKEN
    - INFLUX_BUCKET
    - INFLUX_EXCLUDE_FROM_HOUSE_POWER
    - INFLUX_HOST
    - INFLUX_MEASUREMENT=${INFLUX_MEASUREMENT_PRICES}
    - INFLUX_MEASUREMENT_FORECAST
    - INFLUX_MEASUREMENT_SHELLY_HEATPUMP
    - INFLUX_ORG
    - INFLUX_PASSWORD
    - INFLUX_POLL_INTERVAL
    - INFLUX_PORT
    - INFLUX_SCHEMA
    - INFLUX_SENSOR_BATTERY_CHARGING_POWER
    - INFLUX_SENSOR_BATTERY_DISCHARGING_POWER
    - INFLUX_SENSOR_BATTERY_SOC
    - INFLUX_SENSOR_CASE_TEMP
    - INFLUX_SENSOR_CUSTOM_POWER_01
    - INFLUX_SENSOR_CUSTOM_POWER_02
    - INFLUX_SENSOR_CUSTOM_POWER_03
    - INFLUX_SENSOR_CUSTOM_POWER_04
    - INFLUX_SENSOR_CUSTOM_POWER_05
    - INFLUX_SENSOR_CUSTOM_POWER_06
    - INFLUX_SENSOR_GRID_EXPORT_LIMIT
    - INFLUX_SENSOR_GRID_EXPORT_POWER
    - INFLUX_SENSOR_GRID_IMPORT_POWER
    - INFLUX_SENSOR_HEATPUMP_HEATING_POWER
    - INFLUX_SENSOR_HEATPUMP_POWER
    - INFLUX_SENSOR_HOUSE_POWER
    - INFLUX_SENSOR_INVERTER_POWER
    - INFLUX_SENSOR_INVERTER_POWER_1
    - INFLUX_SENSOR_INVERTER_POWER_2
    - INFLUX_SENSOR_INVERTER_POWER_3
    - INFLUX_SENSOR_INVERTER_POWER_FORECAST
    - INFLUX_SENSOR_INVERTER_POWER_FORECAST_CLEARSKY
    - INFLUX_SENSOR_OUTDOOR_TEMP
    - INFLUX_SENSOR_OUTDOOR_TEMP_FORECAST
    - INFLUX_SENSOR_SYSTEM_STATUS
    - INFLUX_SENSOR_SYSTEM_STATUS_OK
    - INFLUX_SENSOR_WALLBOX_POWER
    - INFLUX_TOKEN=${INFLUX_TOKEN_WRITE}
    - INFLUX_USERNAME
    - INFLUX_VOLUME_PATH
    - CHARGER_DRY_RUN
    - CHARGER_INTERVAL
    - DB_VOLUME_PATH
    - FORCE_SSL
    - FORECAST_0_AZIMUTH
    - FORECAST_0_DECLINATION
    - FORECAST_0_KWP
    - FORECAST_CONFIGURATIONS
    - FORECAST_INTERVAL
    - FORECAST_LATITUDE
    - FORECAST_LONGITUDE
    - FORECAST_PROVIDER
    - INGEST_HOST
    - INGEST_PORT
    - INGEST_VOLUME_PATH
    - INSTALLATION_DATE
    - POSTGRES_PASSWORD
    - POWER_SPLITTER_INTERVAL
    - PVNODE_APIKEY
    - PVNODE_EXTRA_PARAMS
    - PVNODE_PAID
    - REDIS_VOLUME_PATH
    - SENEC_ADAPTER
    - SENEC_HOST
    - SENEC_INFLUX_MEASUREMENT
    - SENEC_INTERVAL
    - SENEC_LANGUAGE
    - SENEC_PASSWORD
    - SENEC_SCHEMA
    - SENEC_SYSTEM_ID
    - SENEC_TOTP_URI
    - SENEC_USERNAME
    - SHELLY_HOST
    - SHELLY_INTERVAL
    - TIBBER_TOKEN
    labels:
    - com.centurylinklabs.watchtower.scope=solectrus
    depends_on:
      influxdb:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    links:
    - influxdb

  # +------------------------------------------------------------+
  # |  Unmanaged service (preserved from existing installation)  |
  # +------------------------------------------------------------+
  #
  dozzle:
    image: amir20/dozzle:latest
    environment:
    - DOZZLE_ENABLE_ACTIONS=true
    - DOZZLE_ENABLE_SHELL=true
    - DOZZLE_NO_ANALYTICS=true
    volumes:
    - "/var/run/docker.sock:/var/run/docker.sock:ro"
    ports:
    - 8080:8080
    labels:
    - com.centurylinklabs.watchtower.scope=solectrus
    restart: unless-stopped

networks:
  default:
    name: solectrus_default
