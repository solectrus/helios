name: solectrus

services:

  # ┌──────────────────────────────────────────────────────────┐
  # │  SOLECTRUS — Web application                             │
  # └──────────────────────────────────────────────────────────┘
  #
  dashboard:
    image: ghcr.io/solectrus/solectrus:latest
    environment:
    - TZ
    - INSTALLATION_DATE
    - INFLUX_TOKEN
    - INFLUX_ORG
    - INFLUX_BUCKET
    - SECRET_KEY_BASE
    - ADMIN_PASSWORD
    - APP_HOST
    - FORCE_SSL
    - REDIS_URL=redis://redis:6379
    - INFLUX_HOST=influxdb
    - DB_HOST=postgresql
    - DB_USER=postgres
    - DB_PASSWORD=${POSTGRES_PASSWORD}
    - DB_DATABASE=solectrus
    - WEB_CONCURRENCY=0
    - FRAME_ANCESTORS
    - INFLUX_EXCLUDE_FROM_HOUSE_POWER
    - INFLUX_SENSOR_INVERTER_POWER
    - INFLUX_SENSOR_INVERTER_POWER_FORECAST
    - INFLUX_SENSOR_HOUSE_POWER
    - INFLUX_SENSOR_GRID_IMPORT_POWER
    - INFLUX_SENSOR_GRID_EXPORT_POWER
    - INFLUX_SENSOR_GRID_EXPORT_LIMIT
    - INFLUX_SENSOR_BATTERY_CHARGING_POWER
    - INFLUX_SENSOR_BATTERY_DISCHARGING_POWER
    - INFLUX_SENSOR_BATTERY_SOC
    - INFLUX_SENSOR_WALLBOX_POWER
    - INFLUX_SENSOR_CASE_TEMP
    - INFLUX_SENSOR_SYSTEM_STATUS
    - INFLUX_SENSOR_SYSTEM_STATUS_OK
    - INFLUX_SENSOR_HEATPUMP_POWER
    ports:
    - 3000:3000
    labels:
    - com.centurylinklabs.watchtower.scope=solectrus
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
      influxdb:
        condition: service_healthy
    healthcheck:
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
      start_interval: 2s
      test:
      - CMD-SHELL
      - nc -z 127.0.0.1 3000 || exit 1
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  # ┌───────────────────────────────────────────────────────────┐
  # │  InfluxDB — Time-series database for sensor measurements  │
  # └───────────────────────────────────────────────────────────┘
  #
  influxdb:
    image: influxdb:2.7-alpine
    environment:
    - DOCKER_INFLUXDB_INIT_MODE=setup
    - DOCKER_INFLUXDB_INIT_USERNAME=admin
    - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUX_PASSWORD}
    - DOCKER_INFLUXDB_INIT_ORG=${INFLUX_ORG}
    - DOCKER_INFLUXDB_INIT_BUCKET=${INFLUX_BUCKET}
    - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUX_TOKEN}
    volumes:
    - "${INFLUX_VOLUME_PATH}:/var/lib/influxdb2"
    ports:
    - 8086:8086
    labels:
    - com.centurylinklabs.watchtower.scope=solectrus
    healthcheck:
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 2s
      test:
      - CMD
      - influx
      - ping
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  # ┌──────────────────────────────────────────────────────────────────────────────────────────┐
  # │  PostgreSQL — Relational database for daily summaries, electricity prices, and settings  │
  # └──────────────────────────────────────────────────────────────────────────────────────────┘
  #
  postgresql:
    image: postgres:16-alpine
    environment:
    - POSTGRES_PASSWORD
    - POSTGRES_DB=solectrus
    volumes:
    - "${DB_VOLUME_PATH}:/var/lib/postgresql"
    labels:
    - com.centurylinklabs.watchtower.scope=solectrus
    healthcheck:
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 2s
      test:
      - CMD-SHELL
      - pg_isready -U postgres
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  # ┌──────────────────────────────────────────────────────────┐
  # │  Redis — In-memory store for caching                     │
  # └──────────────────────────────────────────────────────────┘
  #
  redis:
    image: redis:7-alpine
    volumes:
    - "${REDIS_VOLUME_PATH}:/data"
    labels:
    - com.centurylinklabs.watchtower.scope=solectrus
    healthcheck:
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
      start_interval: 2s
      test:
      - CMD
      - redis-cli
      - ping
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  # ┌───────────────────────────────────────────────────────────┐
  # │  MQTT Collector — Receives sensor data via MQTT protocol  │
  # └───────────────────────────────────────────────────────────┘
  #
  mqtt-collector:
    image: ghcr.io/solectrus/mqtt-collector:latest
    environment:
    - TZ
    - INFLUX_TOKEN
    - INFLUX_ORG
    - INFLUX_BUCKET
    - MQTT_HOST
    - INFLUX_HOST=influxdb
    - MQTT_PORT
    - MQTT_SSL
    - MQTT_USERNAME
    - MQTT_PASSWORD
    - MAPPING_0_TOPIC
    - MAPPING_0_MEASUREMENT
    - MAPPING_0_FIELD
    - MAPPING_0_TYPE
    - MAPPING_1_TOPIC
    - MAPPING_1_MEASUREMENT
    - MAPPING_1_FIELD
    - MAPPING_1_TYPE
    - MAPPING_2_TOPIC
    - MAPPING_2_MEASUREMENT
    - MAPPING_2_FIELD
    - MAPPING_2_TYPE
    - MAPPING_2_FORMULA
    - MAPPING_3_TOPIC
    - MAPPING_3_MEASUREMENT
    - MAPPING_3_FIELD
    - MAPPING_3_TYPE
    - MAPPING_3_FORMULA
    - MAPPING_4_TOPIC
    - MAPPING_4_MEASUREMENT
    - MAPPING_4_FIELD
    - MAPPING_4_TYPE
    - MAPPING_4_FORMULA
    - MAPPING_5_TOPIC
    - MAPPING_5_MEASUREMENT
    - MAPPING_5_FIELD
    - MAPPING_5_TYPE
    - MAPPING_5_FORMULA
    - MAPPING_6_TOPIC
    - MAPPING_6_MEASUREMENT
    - MAPPING_6_FIELD
    - MAPPING_6_TYPE
    - MAPPING_7_TOPIC
    - MAPPING_7_MEASUREMENT
    - MAPPING_7_FIELD
    - MAPPING_7_TYPE
    labels:
    - com.centurylinklabs.watchtower.scope=solectrus
    depends_on:
      influxdb:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  # ┌──────────────────────────────────────────────────────────┐
  # │  Power Splitter — Calculates derived power values        │
  # └──────────────────────────────────────────────────────────┘
  #
  power-splitter:
    image: ghcr.io/solectrus/power-splitter:latest
    environment:
    - TZ
    - INSTALLATION_DATE
    - INFLUX_TOKEN
    - INFLUX_ORG
    - INFLUX_BUCKET
    - POSTGRES_PASSWORD
    - INFLUX_HOST=influxdb
    - REDIS_URL=redis://redis:6379/1
    - DB_HOST=postgresql
    - DB_USER=postgres
    - DB_PASSWORD=${POSTGRES_PASSWORD}
    - POWER_SPLITTER_INTERVAL=300
    - INFLUX_SENSOR_INVERTER_POWER
    - INFLUX_SENSOR_INVERTER_POWER_FORECAST
    - INFLUX_SENSOR_HOUSE_POWER
    - INFLUX_SENSOR_GRID_IMPORT_POWER
    - INFLUX_SENSOR_GRID_EXPORT_POWER
    - INFLUX_SENSOR_GRID_EXPORT_LIMIT
    - INFLUX_SENSOR_BATTERY_CHARGING_POWER
    - INFLUX_SENSOR_BATTERY_DISCHARGING_POWER
    - INFLUX_SENSOR_BATTERY_SOC
    - INFLUX_SENSOR_WALLBOX_POWER
    - INFLUX_SENSOR_CASE_TEMP
    - INFLUX_SENSOR_SYSTEM_STATUS
    - INFLUX_SENSOR_SYSTEM_STATUS_OK
    - INFLUX_SENSOR_HEATPUMP_POWER
    labels:
    - com.centurylinklabs.watchtower.scope=solectrus
    depends_on:
      influxdb:
        condition: service_healthy
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  # ┌──────────────────────────────────────────────────────────┐
  # │  Watchtower — Automatic Docker image updates             │
  # └──────────────────────────────────────────────────────────┘
  #
  watchtower:
    image: containrrr/watchtower:latest
    environment:
    - TZ
    - WATCHTOWER_POLL_INTERVAL
    - WATCHTOWER_SCOPE
    - WATCHTOWER_CLEANUP
    volumes:
    - "/var/run/docker.sock:/var/run/docker.sock"
    labels:
    - com.centurylinklabs.watchtower.scope=solectrus
    healthcheck:
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
      start_interval: 2s
      test:
      - CMD
      - "/watchtower"
      - "--health-check"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  # ┌──────────────────────────────────────────────────────────┐
  # │  HELIOS — Configuration management UI                    │
  # └──────────────────────────────────────────────────────────┘
  #
  helios:
    image: ghcr.io/solectrus/helios:develop
    environment:
    - ADMIN_PASSWORD
    - SECRET_KEY_BASE
    volumes:
    - ".:/data"
    - "/var/run/docker.sock:/var/run/docker.sock"
    ports:
    - 3999:3000
    labels:
    - com.centurylinklabs.watchtower.scope=solectrus
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

networks:
  default:
    name: solectrus_default
