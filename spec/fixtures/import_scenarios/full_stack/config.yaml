---
system:
  admin_password: secret_admin_password
  app_host: localhost
  installation_date: '2026-03-18'
  lockup_codeword: secret
  secret_key_base: very_secret_key_base
  timezone: Europe/Berlin
  ui_theme: light
dashboard:
  image: ghcr.io/solectrus/solectrus:latest
postgresql:
  image: postgres:18-alpine
  password: secret_postgres_password
influxdb:
  bucket: solectrus
  image: influxdb:2.8-alpine
  org: solectrus
  password: secret_influx_password
  token: secret_influx_token
redis:
  image: redis:8-alpine
watchtower:
  image: nickfedor/watchtower:latest
forecast:
  forecast: pvnode
  forecast_azimuth1: '0'
  forecast_declination1: '27'
  forecast_interval: '900'
  forecast_kwp1: '9.24'
  forecast_latitude: '50.12345'
  forecast_longitude: '6.12345'
  forecast_pvnode_apikey: pvn_secret_1234567890abcdef
  forecast_roofs: '1'
  measurement: Forecast
senec:
  adapter: local
  host: senec.fritz.box
  interval: '60'
  language: de
  schema: https
  version: v3
mqtt:
  mqtt_host: iobroker.fritz.box
  mqtt_password: secret_mqtt_password
  mqtt_port: '1883'
  mqtt_username: admin
shelly:
  connection: local
  interval: '5'
sensors:
  battery_charging_power:
    source: senec
  battery_discharging_power:
    source: senec
  battery_soc:
    source: senec
  car_battery_soc:
    field: soc
    measurement: renault
    mqtt_payload_type: integer
    mqtt_topic: renault/0/secret_number/battery-status/batteryLevel
    source: mqtt
  case_temp:
    source: senec
  custom_power_01:
    field: power
    measurement: Fridge
    name: Fridge
    shelly_connection: local
    shelly_host: shelly-fridge.fritz.box
    shelly_interval: '5'
    source: shelly
  custom_power_02:
    field: power
    measurement: Dishwasher
    name: Dishwasher
    shelly_connection: local
    shelly_host: shelly-dishwasher.fritz.box
    shelly_interval: '5'
    source: shelly
  custom_power_03:
    field: power
    measurement: Washer
    name: Washer
    shelly_connection: local
    shelly_host: shelly-washer.fritz.box
    shelly_interval: '5'
    source: shelly
  custom_power_04:
    field: power
    measurement: KabelFritz
    name: KabelFritz
    shelly_connection: local
    shelly_host: shelly-kabelfritz.fritz.box
    shelly_interval: '5'
    source: shelly
  custom_power_05:
    field: power
    measurement: iMac
    name: iMac
    shelly_connection: local
    shelly_host: shelly-imac.fritz.box
    shelly_interval: '5'
    source: shelly
  custom_power_06:
    field: power
    measurement: TV
    name: TV
    shelly_connection: local
    shelly_host: shelly-tv.fritz.box
    shelly_interval: '5'
    shelly_password: secret
    source: shelly
  custom_power_07:
    field: power
    measurement: Synology
    name: Synology
    shelly_connection: local
    shelly_host: shelly-synology.fritz.box
    shelly_interval: '5'
    source: shelly
  custom_power_08:
    field: power
    measurement: Mini-PC-1
    name: Mini-PC-1
    shelly_connection: local
    shelly_host: shelly-mini-pc-1.fritz.box
    shelly_interval: '5'
    source: shelly
  custom_power_09:
    field: power
    measurement: Mac-Studio
    name: Mac-Studio
    shelly_connection: local
    shelly_host: shelly-macstudio.fritz.box
    shelly_interval: '5'
    source: shelly
  custom_power_10:
    field: power
    measurement: Studio-Display
    name: Studio-Display
    shelly_connection: local
    shelly_host: shelly-studiodisplay.fritz.box
    shelly_interval: '5'
    source: shelly
  grid_export_limit:
    source: senec
  grid_export_power:
    source: senec
  grid_import_power:
    source: senec
  heatpump_heating_power:
    field: heat
    measurement: ALTHERMA
    mqtt_json_formula: IF({Operation Mode} = 'Heating' AND {Freeze Protection} = 'OFF'
      AND {Leaving water temp. after BUH (R2T)} > {Inlet water temp.(R4T)}, {Flow
      sensor (l/min)} * 60.0 * 1.163 * ({Leaving water temp. after BUH (R2T)} - {Inlet
      water temp.(R4T)}), 0)
    mqtt_payload_type: float
    mqtt_topic: espaltherma/ATTR
    source: mqtt
  heatpump_power:
    exclude_from_house_power: true
    field: power
    measurement: Consumer
    name: Consumer
    shelly_connection: local
    shelly_host: shelly-heatpump.fritz.box
    shelly_interval: '5'
    source: shelly
  heatpump_status:
    field: current_state
    measurement: ALTHERMA
    mqtt_json_formula: IF({Freeze Protection} == 'ON', 'Frostschutz', IF({Defrost
      Operation} == 'ON', 'Abtauen', IF({[HPSU] Tank valve position (0:Bypass 100:Tank)}
      > 50, 'Warmwasser', IF({[HPSU] Bypass valve position (0:Bypass 100:Emitter)}
      > 50 AND {INV frequency (rps)} > 0, 'Heizen', 'Warten'))))
    mqtt_payload_type: string
    mqtt_topic: espaltherma/ATTR
    source: mqtt
  heatpump_tank_temp:
    field: tank_temp
    measurement: ALTHERMA
    mqtt_json_key: DHW tank temp. (R5T)
    mqtt_payload_type: float
    mqtt_topic: espaltherma/ATTR
    source: mqtt
  house_power:
    source: senec
  inverter_power:
    source: senec
  inverter_power_1:
    source: senec
  inverter_power_2:
    source: senec
  inverter_power_3:
    source: senec
  inverter_power_forecast:
    field: watt
    measurement: Forecast
    source: forecast
  inverter_power_forecast_clearsky:
    field: watt_clearsky
    measurement: Forecast
    source: forecast
  outdoor_temp:
    field: outdoor_temp
    measurement: ALTHERMA
    mqtt_json_key: R1T-Outdoor air temp.
    mqtt_payload_type: float
    mqtt_topic: espaltherma/ATTR
    source: mqtt
  outdoor_temp_forecast:
    field: temp
    measurement: Forecast
    source: forecast
  system_status:
    source: senec
  system_status_ok:
    source: senec
  wallbox_car_connected:
    source: senec
  wallbox_power:
    source: senec
