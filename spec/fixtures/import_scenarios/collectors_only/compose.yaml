name: solectrus

services:

  # ┌───────────────────────────────────────────────────────────────────┐
  # │  SENEC Collector — Reads data from SENEC battery storage systems  │
  # └───────────────────────────────────────────────────────────────────┘
  #
  senec-collector:
    image: ghcr.io/solectrus/senec-collector:develop
    environment:
    - TZ
    - INFLUX_TOKEN
    - INFLUX_ORG
    - INFLUX_BUCKET
    - INFLUX_MEASUREMENT_SENEC
    - SENEC_ADAPTER
    - SENEC_INTERVAL
    - INFLUX_HOST
    - INFLUX_PORT
    - INFLUX_SCHEMA
    - SENEC_HOST
    - SENEC_SCHEMA
    - SENEC_LANGUAGE
    labels:
    - com.centurylinklabs.watchtower.scope=solectrus
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  # ┌───────────────────────────────────────────────────────────┐
