name: Dependabot

on:
  pull_request:
    types: [opened, synchronize]
    branches: [develop]

permissions:
  contents: write
  pull-requests: write

jobs:
  dedupe:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.PAT }}
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Check for yarn.lock changes
        id: check
        run: |
          if git diff --name-only origin/develop...HEAD | grep -q '^yarn.lock$'; then
            echo "yarn_changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Enable Corepack
        if: steps.check.outputs.yarn_changed == 'true'
        run: corepack enable

      - name: Setup Node.js
        if: steps.check.outputs.yarn_changed == 'true'
        uses: actions/setup-node@v6
        with:
          node-version-file: 'package.json'
          cache: yarn

      - name: Install dependencies (immutable)
        if: steps.check.outputs.yarn_changed == 'true'
        run: yarn install --immutable

      - name: Dedupe
        if: steps.check.outputs.yarn_changed == 'true'
        run: yarn dedupe

      - name: Commit and push if yarn.lock changed
        if: steps.check.outputs.yarn_changed == 'true'
        run: |
          git config user.name "ledermann-bot"
          git config user.email "ledermann-bot@users.noreply.github.com"

          if ! git diff --quiet; then
            git add yarn.lock
            git commit -m 'chore: yarn dedupe'
            git push origin HEAD:${{ github.head_ref }}
          fi

  automerge:
    needs: dedupe
    if: always() && github.actor == 'dependabot[bot]' && needs.dedupe.result != 'failure'
    runs-on: ubuntu-24.04

    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3.1.0
        with:
          github-token: ${{ secrets.PAT }}

      - name: Enable auto-merge for Dependabot PRs
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.PAT }}
