en:
  reset: 'Reset configuration'
  reset_what_html: 'HELIOS restores <code class="bg-base-300 rounded px-1.5 py-0.5 font-mono text-xs">%{compose}</code> and <code class="bg-base-300 rounded px-1.5 py-0.5 font-mono text-xs">.env</code> from the backup, and re-reads them. All changes you made to your configuration since the initial import will be lost. All services will also be stopped.'
  reset_when: 'This is useful when …'
  reset_reason_user: 'you accidentally broke your configuration and want to start over'
  reset_reason_helios: 'the import was performed by an older HELIOS version and was incorrect'
  postgresql_downgrade: 'Resetting is not possible because PostgreSQL has since been upgraded to a newer major version.'
  reset_confirm_button: 'Reset'
  discard: 'Delete backups'
  discard_what_html: 'HELIOS permanently deletes <code class="bg-base-300 rounded px-1.5 py-0.5 font-mono text-xs">%{compose}.bak</code> and <code class="bg-base-300 rounded px-1.5 py-0.5 font-mono text-xs">.env.bak</code>. You will no longer be able to return to the originally imported state.'
  discard_when: 'This is useful when …'
  discard_reason_correct: 'you are sure your configuration is now correct'
  discard_reason_diverged: 'your configuration has diverged so far from the backup that a reset would no longer help'
  discard_confirm_button: 'Delete'
  or: 'or'
  cancel: 'Cancel'
