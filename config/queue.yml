# Polling intervals are tuned for low idle load: HELIOS enqueues jobs only
# via user clicks, and Docker Compose operations take seconds to minutes —
# so a few extra seconds of pickup latency are imperceptible.
default: &default
  dispatchers:
    - polling_interval: 10
      batch_size: 500
  workers:
    - queues: '*'
      threads: 3
      processes: <%= ENV.fetch("JOB_CONCURRENCY", 1) %>
      polling_interval: 2

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default
