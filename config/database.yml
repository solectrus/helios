# SQLite. Versions 3.8.0 and up are supported.
#   gem install sqlite3
#
#   Ensure the SQLite 3 gem is defined in your Gemfile
#   gem "sqlite3"
#
default: &default
  adapter: sqlite3
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

development:
  primary:
    <<: *default
    database: storage/development.sqlite3
  cable:
    <<: *default
    database: storage/development_cable.sqlite3
    migrations_paths: db/cable_migrate

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  primary:
    <<: *default
    # ENV["TEST_ENV_NUMBER"] is set per worker by turbo_tests ("1", "2", …),
    # giving each parallel worker its own database. Blank for a serial run.
    database: storage/test<%= ENV["TEST_ENV_NUMBER"] %>.sqlite3

# Store production databases in /data (the mounted stack directory),
# so they persist across container recreations without a separate volume.
production:
  primary:
    <<: *default
    database: /data/helios/primary.sqlite3
  cable:
    <<: *default
    database: /data/helios/cable.sqlite3
    migrations_paths: db/cable_migrate
