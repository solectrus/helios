formatter:
  enabled: true
  indentWidth: 2
  maxLineLength: 120

  exclude:
    - 'public/**'
    - node_modules/**

  rewriter:
    # Pre-format rewriters (run before formatting)
    pre:
      - tailwind-class-sorter

    # Post-format rewriters (run after formatting)
    post: []

linter:
  rules:
    # False positive: `>` is standard Stimulus action syntax (e.g. click->controller#method)
    html-no-unescaped-entities:
      enabled: false
    # False positive: content_for :title, t('.title') is standard Rails usage (side effect, not unused)
    erb-no-unused-expressions:
      enabled: false
    # CSP is not enabled, so script nonces are not applicable
    html-require-script-nonce:
      enabled: false
    # False positive in 0.9.6: flags enclosing `<% if/unless %>` blocks
    # whenever a `link_to`/`button_to` appears inside them
    actionview-no-silent-helper:
      enabled: false
