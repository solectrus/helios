plugins:
  - rubocop-capybara
  - rubocop-performance
  - rubocop-rails
  - rubocop-rspec
  - rubocop-rspec_rails
  - rubocop-thread_safety

AllCops:
  NewCops: enable
  TargetRubyVersion: 4.0
  Exclude:
    - bin/**/*
    - db/schema.rb
    - db/*_schema.rb
    - vendor/**/*

# Align with SyntaxTree formatting
Style/StringLiterals:
  EnforcedStyle: single_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: single_quotes

# Always use trailing commas (aligns with SyntaxTree)
Style/TrailingCommaInArrayLiteral:
  EnforcedStyleForMultiline: comma

Style/TrailingCommaInHashLiteral:
  EnforcedStyleForMultiline: comma

Style/TrailingCommaInArguments:
  EnforcedStyleForMultiline: comma

Style/FrozenStringLiteralComment:
  EnforcedStyle: never

# Documentation not required for all classes
Style/Documentation:
  Enabled: false

# Allow slightly longer methods
Metrics/MethodLength:
  Max: 15

# ComposeGenerator needs more lines due to service configurations
Metrics/ClassLength:
  Max: 200

Metrics/ModuleLength:
  Max: 110

Metrics/CyclomaticComplexity:
  Max: 10

# Disable - conflicts with SyntaxTree formatting
Layout/FirstArgumentIndentation:
  Enabled: false

Style/MultilineBlockChain:
  Enabled: false

Style/IfUnlessModifier:
  Enabled: false

# Exclude environment configs and rake tasks from block length check
Metrics/BlockLength:
  Exclude:
    - config/environments/*.rb
    - config/routes.rb
    - lib/tasks/*.rake

# RSpec settings - allow more flexibility
RSpec/MultipleExpectations:
  Max: 5

RSpec/ExampleLength:
  Max: 20

# Fixture-driven cross-class specs and system specs use string descriptions:
# the scenarios_spec covers the whole import/export round-trip, and system
# specs describe end-to-end UI flows, not a single class.
RSpec/DescribeClass:
  Exclude:
    - spec/services/scenarios_spec.rb
    - spec/services/import/configuration_importer/**/*_spec.rb
    - spec/system/**/*_spec.rb

# Integration specs manage expensive external resources (Docker containers,
# real stacks) once per group via before/after(:all) — that is intentional,
# not leaked DB state.
RSpec/BeforeAfterAll:
  Exclude:
    - spec/integration/**/*_spec.rb

Metrics/AbcSize:
  Max: 20

# annotaterb's "Schema Information" block can produce long comment lines
# for composite indexes — they are auto-generated and would be re-introduced
# on every annotation run, so don't enforce length on them.
Layout/LineLength:
  AllowedPatterns:
    - '^#\s+\w+\s+\([^)]+\)' # annotaterb index lines: `#  index_name  (cols)`
    - '^#\s+\S*\s+(GET|POST|PUT|PATCH|DELETE|HEAD|OPTIONS)\s+/' # annotaterb route lines
